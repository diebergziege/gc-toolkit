function aiSetupReport(s, msg, draw, projects) {
  const done = (text, next) => { put(msg, h("div", { class: "okbox" }, text, " ", RELOAD_HINT)); draw(next); window.scrollTo({ top: 0, behavior: "smooth" }); };
  const failed = (err) => { put(msg, h("div", { class: "error" }, err.message)); window.scrollTo({ top: 0, behavior: "smooth" }); };
  const post = (x, kind) => api("/api/ai-setup/fix", { method: "POST", body: { file: x.file, section: x.section, name: x.name, fix: kind } });
  const ctx = {
    msg, draw,
    async fix(x, kind) {
      const names = x.env.filter((v) => v.plain).map((v) => v.name).join(", ");
      const ask = {
        keychain: `Move ${names} of "${x.name}" (${whereText(x)}) into the keychain? The secret is then no longer in\n${x.file}\n\nScripts that read the secret from this file themselves stop working (a demo started from the Demos page gets it from gctk).`,
        restore: `Write the secret of "${x.name}" back into\n${x.file}\nin plain text?`,
        remove: `Remove the server "${x.name}" from\n${x.file}?`,
        "clean-env": `Remove the old variable from "${x.name}"?`,
        repair: `Point "${x.name}" (${whereText(x)}) to the copy of gctk that stays across plugin updates?\n${x.file}`,
      }[kind];
      if (!confirm(ask)) return;
      try { done(`Done: ${FIX_LABELS[kind].toLowerCase()} (${x.name}).`, await post(x, kind)); } catch (err) { failed(err); }
    },
    async restoreSkill(r) {
      try { done(`Restored ${r.name} to ${r.from}.`, await api("/api/ai-setup/skills/restore", { method: "POST", body: { id: r.id } })); } catch (err) { failed(err); }
    },
    async setCredentials(x, body) {
      try { done(`Saved the new credentials of ${x.name}.`, await api("/api/ai-setup/credentials", { method: "POST", body: { file: x.file, section: x.section, name: x.name, ...body } })); } catch (err) { failed(err); }
    },
    async fixAll(list, kind, what) {
      if (!confirm(`${what}?\n\n${list.map((x) => `• ${x.name} (${whereText(x)})`).join("\n")}`)) return;
      let next;
      try { for (const x of list) next = await post(x, kind); done(`Done for ${list.length} entries.`, next); } catch (err) { failed(err); if (next) draw(next); }
    },
  };
  const found = s.files.filter((f) => f.exists);
  const managed = s.secrets;
  const details = h("details", { class: "panel", style: "margin-top:14px" },
    h("summary", { style: "margin:0" }, h("strong", {}, "Details"), h("span", { class: "muted", style: "font-size:13px" }, ` · every entry, secrets in the keychain, ${found.length} config files`)),
    h("div", { style: "margin-top:10px" },
      h("h3", { style: "margin:0 0 4px;font-size:15px" }, "Every entry"),
      h("p", { class: "muted", style: "margin:0 0 6px;font-size:13px" }, "Open an entry for its file, command and variables (secrets masked) and the fixes for it."),
      sortServers(s.servers).map((x) => serverRow(x, ctx)),
      managed.length ? [h("h3", { style: "margin:16px 0 4px;font-size:15px" }, "Secrets in the keychain"), managed.map((m) => secretCard(m, ctx.msg, ctx.draw))] : null,
      s.removedSkills.length ? [h("h3", { style: "margin:16px 0 4px;font-size:15px" }, "Skills an earlier gctk removed"),
        s.removedSkills.map((r) => h("div", { class: "todo-row" }, h("strong", {}, r.name), h("span", { class: "mono muted", style: "font-size:11px" }, r.from), h("span", { class: "spacer" }), h("button", { class: "btn", onclick: () => ctx.restoreSkill(r) }, "Restore")))] : null,
      filesPanel(s, msg, draw)));
  return [todoPanel(s, ctx), aiOverview(s, ctx), folderPanel(s, projects), details];
}

/** Everything that needs a look, grouped by what it is, with one button per group where gctk can fix it. */
function todoPanel(s, ctx) {
  const having = (kind) => s.servers.filter((x) => x.problems.some((p) => p.kind === kind));
  const fixable = (kind, fix) => having(kind).filter((x) => x.problems.some((p) => p.kind === kind && p.fix === fix));

    h("strong", {}, x.name), h("span", { class: "muted" }, whereText(x)),
    SAYS_MORE.includes(kind) ? h("span", { class: "muted", style: "font-size:12px;flex-basis:100%" }, x.problems.filter((p) => p.kind === kind).map((p) => p.text).join(" ")) : null,
    h("span", { class: "spacer" }), btn);
  let first = true;
  const group = (title, why, rows, all) => {
    if (!rows.length) return null;
    const open = first;
    first = false;
    return h("details", { class: "todo-group", open },
      h("summary", {}, h("strong", {}, title), pill(String(rows.length), "s-pending"), why ? h("span", { class: "muted", style: "font-size:13px" }, why) : null),
      all ? h("div", { class: "row", style: "margin:4px 0 6px" }, all) : null, rows);
  };
  const secrets = having("plain-secret");
  const canMove = fixable("plain-secret", "keychain");
  const shared = secrets.some((x) => x.problems.some((p) => p.kind === "same-secret"));
  const broken = [...having("missing-command"), ...having("launch-invalid")];
  const removable = broken.filter((x) => x.editable && !x.problems.some((p) => p.fix === "repair"));
  const groups = [
    group("Secrets in plain text", `Anyone who can read these files can use the secret.${shared ? " Several share one secret; in the keychain it becomes one entry." : ""}`,
      secrets.map((x) => row(x, "plain-secret", canMove.includes(x) ? h("button", { class: "btn", onclick: () => ctx.fix(x, "keychain") }, "Move to keychain") : null)),
      canMove.length > 1 ? h("button", { class: "btn primary", onclick: () => ctx.fixAll(canMove, "keychain", `Move the secrets of ${canMove.length} entries into the keychain`) }, `Move all ${canMove.length} to the keychain`) : null),
    group("Entries that cannot start", "The program or script they point to is gone, so Cursor shows an error for them.",
      broken.map((x) => row(x, x.problems.some((p) => p.kind === "missing-command") ? "missing-command" : "launch-invalid", !x.editable ? null : x.problems.some((p) => p.fix === "repair")
        ? h("button", { class: "btn primary", onclick: () => ctx.fix(x, "repair") }, "Repair")
        : h("button", { class: "btn danger", onclick: () => ctx.fix(x, "remove") }, "Remove"))),
      removable.length > 1 ? h("button", { class: "btn", onclick: () => ctx.fixAll(removable, "remove", `Remove ${removable.length} entries that cannot start`) }, "Remove all") : null),
    group("Leftovers from an earlier gctk", "", having("obsolete-env").map((x) => row(x, "obsolete-env", x.editable ? h("button", { class: "btn", onclick: () => ctx.fix(x, "clean-env") }, "Clean up") : null))),
    group("Secrets in headers", "Remote servers: gctk cannot move these. Use Cursor's variables (for example ${env:NAME}) instead.", having("header-secret").map((x) => row(x, "header-secret", null))),
    group("OAuth clients gctk does not know", "Add the org on the Orgs page to see which org they belong to.", having("unknown-client").map((x) => row(x, "unknown-client", null))),
  ].filter(Boolean);
  return groups.length
    ? h("div", { class: "panel" }, h("h3", { style: "margin-top:0" }, "To do"), groups)
    : h("div", { class: "okbox" }, "Nothing to fix: no secrets in plain text, and every entry can start.");
}

/** New client ID, secret or region for a Genesys server, or those of one of the user's gctk orgs. */
function credentialsForm(x, ctx) {

/** What Cursor loads in every folder: the Genesys tools with their org and status, then the rest. */
function aiOverview(s, ctx) {
  const orgs = (state.overview?.profiles || []).filter((p) => !p.error && p.credentialsStored);

  const everywhere = s.servers.filter((x) => x.scope !== "project");
  const orgOf = (x) => {
    if (x.credentials === "gctk-profile") return h("span", { class: "muted" }, "needs no org");
    if (x.org?.profile) { const t = tierOf(x.org.profile); return h("span", {}, h("strong", {}, x.org.profile), t ? [" ", pill(t, `t-${t}`)] : null); }
    if (x.org?.clientId) return h("span", { class: "muted" }, `an OAuth client gctk does not know (${x.org.clientId})`);
    if (x.credentials === "reference") return h("span", { class: "muted" }, "credentials from a variable");
    return h("span", { class: "muted" }, "no org set");
  };
  const status = (x) => {
    const warn = x.problems.filter((p) => p.level === "warn");
    if (x.disabled) return pill("switched off", "");
    if (warn.some((p) => p.kind === "missing-command" || p.kind === "launch-invalid")) return pill("cannot start", "s-failed");
    if (warn.some((p) => p.kind === "plain-secret")) return pill("secret in plain text", "s-failed");
    if (x.org?.profile && tierOf(x.org.profile) === "production") return pill("production org", "s-failed");
    return pill("ready", "s-applied");
  };
  const useOrg = (x) => {
    if (!x.credentialKeys || !x.editable || !orgs.length) return null;
    const sel = h("select", { style: "max-width:220px" }, h("option", { value: "" }, x.org?.profile ? "Use another org…" : "Use one of your orgs…"),
      orgs.filter((o) => o.name !== x.org?.profile).map((o) => h("option", { value: o.name }, `${o.name} (${o.tier})`)));
    sel.addEventListener("change", () => {
      const o = sel.value;
      if (!o) return;
      if (!confirm(`Let "${x.name}" (${whereText(x)}) work on ${o}?\n\nIts client ID, secret and region become those of ${o}; the secret stays in the keychain.\n${x.file}`)) { sel.value = ""; return; }
      ctx.setCredentials(x, { profile: o, keychain: true });
    });
    return sel;
  };
  const toolRow = (x) => h("div", { class: "todo-row" },
    h("span", { class: "muted", style: "flex:0 0 200px;max-width:100%;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap", title: x.file }, x.scope === "plugin" ? `plugin ${x.plugin}` : "~/.cursor/mcp.json"),
    h("span", { style: "flex:1;min-width:200px" }, orgOf(x)), status(x), useOrg(x));
  const genesys = everywhere.filter((x) => x.genesys);
  const others = everywhere.filter((x) => !x.genesys);
  const names = [...new Set(genesys.map((x) => x.name))].sort((a, b) => (a === "gctk") - (b === "gctk") || a.localeCompare(b));
  return h("div", { class: "panel" },
    h("div", { class: "grp-head" }, h("strong", { style: "font-size:17px" }, "In every folder"),
      h("span", { class: "muted" }, genesys.length ? `${names.length} Genesys tool${names.length > 1 ? "s" : ""} from ~/.cursor/mcp.json and plugins` : "no Genesys tools")),
    genesys.length ? names.map((n) => {
      const [title, what] = TOOL_NAMES[n] || [n, ""];
      return h("div", { style: "margin-top:10px" },
        h("div", { class: "row", style: "gap:8px" }, h("strong", {}, title), title !== n ? h("span", { class: "muted mono", style: "font-size:12px" }, n) : null, what ? h("span", { class: "muted", style: "font-size:13px" }, `· ${what}`) : null),
        sortServers(genesys.filter((x) => x.name === n)).map(toolRow));
    }) : h("p", { class: "muted", style: "margin:6px 0 0" }, "Cursor has no Genesys Cloud tools in every folder. Give single folders their own on the Projects page."),
    others.length ? h("div", { class: "muted", style: "font-size:13px;margin-top:10px" }, `Also ${others.length} other MCP server${others.length > 1 ? "s" : ""}: ${[...new Set(others.map((x) => x.name))].join(", ")}.`) : null);
}

/** Folders with their own .cursor/mcp.json: the ones that are projects open there, the others can become one. */
function folderPanel(s, projects) {
  const folders = [...new Set(s.servers.filter((x) => x.scope === "project").map((x) => x.project))].sort((a, b) => projName(a).localeCompare(projName(b)));
  if (!folders.length) return null;
  const open = (id) => { state.axlOpen = id; go("axl"); };
  const make = async (folder) => {
    try {
      const r = await api("/api/axl/workshops", { method: "POST", body: { name: projName(folder), folder, lab: false } });
      open(r.id);
    } catch (err) { showError(err); }
  };
  return h("div", { class: "panel" },
    h("div", { class: "grp-head" }, h("strong", { style: "font-size:17px" }, "Folders with their own servers"), h("span", { class: "muted" }, "Cursor loads these only in that folder, next to the ones above")),
    folders.map((f) => {
      const here = s.servers.filter((x) => x.project === f);
      const p = projects.find((w) => w.folder === f);
      const bad = here.some((x) => x.problems.some((q) => q.level === "warn"));
      return h("div", { class: "todo-row" },
        h("span", { style: "flex:1;min-width:220px" }, h("strong", {}, projName(f)), p ? [" ", pill(p.lab === false ? "project" : "AXL workshop", "")] : null,
          h("div", { class: "muted mono", style: "font-size:11.5px;overflow-wrap:anywhere" }, f)),
        h("span", { class: "muted", style: "font-size:13px;min-width:200px" }, here.map((x) => toolTitle(x.name)).join(", ")),
        bad ? pill("needs a look", "s-failed") : null,
        p ? h("button", { class: "btn", onclick: () => open(p.id) }, "Open project") : h("button", { class: "btn", title: "Choose its org and Genesys tools on the Projects page", onclick: () => make(f) }, "Make it a project"));
    }));
}

/** A keychain item gctk created; a rotated OAuth secret is entered here once for all its servers. */
function secretCard(m, msg, draw) {
  const inputs = m.names.map((n) => [n, h("input", { type: "password", autocomplete: "new-password", placeholder: "new value", style: "flex:1;min-width:220px" })]);
  const save = async () => {
    try {
      const next = await api(`/api/ai-setup/secrets/${encodeURIComponent(m.account)}`, { method: "PUT", body: { values: Object.fromEntries(inputs.map(([n, el]) => [n, el.value])) } });
      put(msg, h("div", { class: "okbox" }, `Saved the new secret for ${m.usedBy.map((u) => u.server).join(", ")}. `, RELOAD_HINT));
      draw(next);
    } catch (err) { put(msg, h("div", { class: "error" }, err.message)); }
  };
  return h("div", { class: "keybox" },
    h("div", { class: "row" }, "🔑", h("strong", {}, `Secret in the keychain: ${m.names.join(", ")}`), m.profile ? h("span", { class: "muted" }, `org ${m.profile}`) : null, m.stored ? null : pill("missing in the keychain", "s-failed"),
      h("span", { class: "muted", style: "font-size:13px" }, `used by ${m.usedBy.length} entr${m.usedBy.length > 1 ? "ies" : "y"}`)),
    h("details", {}, h("summary", {}, "Enter a new secret (after rotating it in Genesys Cloud)"),
      inputs.map(([n, el]) => h("div", { class: "row", style: "margin:6px 0" }, h("span", { class: "mono", style: "min-width:220px" }, n), el)),
      h("button", { class: "btn primary", onclick: save }, "Save in the keychain")));
}

function filesPanel(s, msg, draw) {
  const input = h("input", { placeholder: "~/projects/demo or ~/somewhere/.cursor/mcp.json", style: "flex:1;min-width:280px" });
  const call = async (url, body) => {
    try { draw(await api(url, { method: "POST", body })); msg.replaceChildren(); } catch (err) { put(msg, h("div", { class: "error" }, err.message)); window.scrollTo({ top: 0, behavior: "smooth" }); }
  };
  const status = (f) => !f.exists ? h("span", { class: "muted" }, "not there") : f.error ? h("span", { class: "muted" }, f.error) : f.scope === "plugin" ? h("span", { class: "muted" }, "read-only (plugin)") : pill("found", "s-applied");
  const added = s.locations.filter((l) => !s.files.some((f) => f.path === l && f.added));
  return h("div", { style: "margin-top:16px" },
    h("h3", { style: "margin:0 0 4px;font-size:15px" }, "Config files"),
    h("p", { class: "muted", style: "margin:0 0 8px;font-size:13px" }, "gctk reads ~/.cursor/mcp.json, Cursor's plugins and the .cursor/mcp.json of the folders Cursor knows (its recent folders and your projects). Add a folder or file that is somewhere else."),
    h("table", {}, h("tr", {}, h("th", {}, "File"), h("th", {}, "For"), h("th", {}, "")),
      s.files.map((f) => h("tr", {},
        h("td", { class: "mono", style: "font-size:12px;overflow-wrap:anywhere" }, f.path),
        h("td", { class: "muted" }, f.scope === "plugin" ? `plugin ${f.plugin}` : f.scope === "project" ? "one folder" : "every folder"),
        h("td", { style: "white-space:nowrap" }, status(f), f.added ? [" ", h("button", { class: "btn", style: "padding:2px 8px;font-size:12px", onclick: () => call("/api/ai-setup/locations/remove", { path: f.path }) }, "Remove")] : null)))),
    added.length ? h("div", { style: "margin-top:10px" }, h("strong", { style: "font-size:13px" }, "Added folders"), added.map((l) => h("div", { class: "row", style: "margin-top:4px" }, h("span", { class: "mono", style: "font-size:12px;flex:1" }, l),
      h("button", { class: "btn", style: "padding:2px 8px;font-size:12px", onclick: () => call("/api/ai-setup/locations/remove", { path: l }) }, "Remove")))) : null,
    h("div", { class: "row", style: "margin-top:12px" }, input, h("button", { class: "btn primary", onclick: () => input.value.trim() && call("/api/ai-setup/locations", { path: input.value }) }, "Add")));
}

// ---------------------------------------------------------------- start
(async () => {
  if (!TOKEN) { main().replaceChildren(h("div", { class: "error" }, "No session token. Ask the AI to open the gctk UI again, or run `gctk ui`.")); return; }
  try {
    await refreshOverview();
    // A page this tab remembers that no longer exists opens Orgs.
    if (![...VIEWS, ...MINOR_VIEWS].some(([id]) => id === state.view)) {
      state.view = "profiles";
      try { sessionStorage.setItem("gctk-view", "profiles"); } catch {}
    }
    await render();
  }
  catch (err) { main().replaceChildren(h("div", { class: "error" }, err.message)); return; }
})();
</script>
</body>
</html>
