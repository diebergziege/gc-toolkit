<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gctk · Genesys Cloud Toolkit</title>
<style nonce="__NONCE__">
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5f6b7a; --line: #e2e6ec;
  --accent: #ff4f1f; --accent-ink: #ffffff;
  --ok: #1a7f4b; --ok-bg: #e5f5ec; --warn: #9a6200; --warn-bg: #fff4de; --bad: #b42318; --bad-bg: #fde8e6;
  --info: #1f5fbf; --info-bg: #e7effb; --neutral-bg: #eef0f3;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
/* Dark: the system setting, unless the user picked light in the top bar; or picked dark explicitly. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #1a1f27; --text: #e6e9ef; --muted: #98a2b3; --line: #2b323d;
    --ok: #5fd39b; --ok-bg: #173226; --warn: #f5c16c; --warn-bg: #3a2c12; --bad: #ff8a80; --bad-bg: #3d1a18;
    --info: #8db8ff; --info-bg: #182a44; --neutral-bg: #252b35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1a1f27; --text: #e6e9ef; --muted: #98a2b3; --line: #2b323d;
  --ok: #5fd39b; --ok-bg: #173226; --warn: #f5c16c; --warn-bg: #3a2c12; --bad: #ff8a80; --bad-bg: #3d1a18;
  --info: #8db8ff; --info-bg: #182a44; --neutral-bg: #252b35;
  color-scheme: dark;
}
.theme { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.theme button { background: none; border: 0; padding: 3px 10px; font: inherit; font-size: 12px; color: var(--muted); cursor: pointer; }
.theme button[aria-pressed="true"] { background: var(--neutral-bg); color: var(--text); font-weight: 600; }
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
header { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
.hbar { display: flex; align-items: center; gap: 14px; padding: 10px 20px 4px; flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
header h1 span { color: var(--accent); }
.org { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.org select { padding: 3px 6px; font-size: 13px; }
nav { display: flex; gap: 2px; flex-wrap: wrap; align-items: center; padding: 0 14px 6px; }
nav button { background: none; border: 0; padding: 6px 12px; border-radius: 6px; color: var(--muted); font: inherit; cursor: pointer; }
nav button[aria-current="page"] { background: var(--neutral-bg); color: var(--text); font-weight: 600; }
nav .sep { flex: 1; min-width: 12px; }
nav .minor button { font-size: 13px; padding: 6px 9px; }
.count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; text-align: center; }
.who { margin-left: auto; color: var(--muted); font-size: 12px; }
main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
h2 { font-size: 18px; margin: 8px 0 12px; }
h3 { font-size: 15px; margin: 18px 0 8px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
.muted { color: var(--muted); }
a { color: var(--info); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; background: var(--neutral-bg); }
.t-production, .r-high, .s-rejected, .s-failed, .s-stale { background: var(--bad-bg); color: var(--bad); }
.t-test, .r-medium, .s-pending { background: var(--warn-bg); color: var(--warn); }
.t-dev, .s-approved { background: var(--info-bg); color: var(--info); }
.r-low, .s-applied, .a-granted { background: var(--ok-bg); color: var(--ok); }
.a-missing { background: var(--bad-bg); color: var(--bad); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
td.v { font-family: var(--mono); font-size: 12px; word-break: break-word; max-width: 380px; }
.d-added td:first-child::before { content: "+ "; color: var(--ok); font-weight: 700; }
.d-removed td:first-child::before { content: "− "; color: var(--bad); font-weight: 700; }
.d-changed td:first-child::before { content: "~ "; color: var(--warn); font-weight: 700; }
.warn { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; margin: 10px 0; }
.warn li { margin: 2px 0; }
.error { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 8px 12px; margin: 10px 0; white-space: pre-wrap; }
.okbox { background: var(--ok-bg); color: var(--ok); border-radius: 8px; padding: 8px 12px; margin: 10px 0; }
button.btn { font: inherit; padding: 6px 14px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
button.btn:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: not-allowed; }
input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; }
textarea { width: 100%; min-height: 80px; font-family: var(--mono); font-size: 12.5px; }
label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
details summary { cursor: pointer; color: var(--muted); margin: 8px 0; }
pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow: auto; max-height: 360px; font-size: 12px; }
.empty { text-align: center; padding: 30px; color: var(--muted); }
main.wide { max-width: 1500px; padding-bottom: 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; margin-bottom: 14px; }
.cards .panel { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.lead { font-size: 15px; color: var(--muted); margin: 0 0 16px; max-width: 820px; }
.kv { display: grid; grid-template-columns: minmax(90px, 38%) minmax(0, 1fr); gap: 2px 10px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
[hidden] { display: none !important; }
/* ---- Monitoring: one card per object kind, count against the org's limit. */
.mon { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-bottom: 8px; }
.mon > div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.mon .n { font-size: 22px; font-weight: 700; line-height: 1.2; }
.mon .n small { font-size: 13px; font-weight: 400; color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--neutral-bg); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); }
.m-warn .meter i { background: var(--warn); }
.m-alert .meter i { background: var(--bad); }
.mon > .m-alert { border-color: var(--bad); }
.mon > .m-error .n { color: var(--muted); }
.ws-opts { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.ws-opt { display: flex; gap: 8px; align-items: flex-start; text-align: left; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; cursor: pointer; }
.ws-opt:hover { border-color: var(--muted); }
.ws-opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.ws-opt .mark { flex: none; width: 16px; height: 16px; margin-top: 2px; border: 2px solid var(--muted); border-radius: 50%; }
.ws-opt.multi .mark { border-radius: 4px; }
.ws-opt[aria-pressed="true"] .mark { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 2px var(--bg); }
.ws-opt small { display: block; color: var(--muted); font-size: 12px; }
.srv { border-top: 1px solid var(--line); }
.srv > summary { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; list-style: none; cursor: pointer; padding: 8px 4px; margin: 0; color: var(--text); }
.srv > summary::-webkit-details-marker { display: none; }
.srv > summary::before { content: "▸"; color: var(--muted); width: 12px; }
.srv[open] > summary::before { content: "▾"; }
.srv > summary:hover { background: var(--neutral-bg); border-radius: 6px; }
.srv .body { padding: 0 4px 12px 24px; display: grid; gap: 8px; }
.grp-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.sub-head { font-size: 12px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); margin: 4px 0 2px; }
.sub-head .mono { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 11px; }
.skill-group > summary { margin: 8px 0 2px; }
.todo-group { border-top: 1px solid var(--line); padding: 10px 0; }
.todo-group:first-of-type { border-top: 0; padding-top: 0; }
.todo-group > summary { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0; color: var(--text); }
.todo-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 0; }
.skill-row { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 5px 4px; border-top: 1px solid var(--line); font-size: 13px; }
.creds > summary { color: var(--info); margin: 0; }
.twin { padding: 4px 0 8px; }
.twin .todo-row { flex-wrap: nowrap; }
.twin-path { flex: 1; min-width: 0; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.twin + .twin { border-top: 1px dashed var(--line); padding-top: 8px; }
.skill-row > .row { justify-content: flex-end; }
.prereqs { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 10px; align-items: baseline; }
.keybox { margin-top: 10px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 8px; background: var(--bg); }
.chat { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
.dtabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin: 0 0 14px; }
.dtabs button { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 8px 14px; font: inherit; color: var(--muted); cursor: pointer; }
.dtabs button[aria-selected="true"] { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
.dtabs button:disabled { cursor: default; opacity: .55; }
.dtabs small { font-size: 10px; margin-left: 4px; text-transform: uppercase; letter-spacing: .04em; }
.dblock { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 12px 0; }
.dblock.live { border-left: 4px solid var(--ok); }
.dblock.setup { border-left: 4px solid var(--accent); }
.dblock-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.dblock-head strong { font-size: 15px; }
.dstep { display: flex; align-items: baseline; gap: 10px; margin: 22px 0 10px; }
.dstep b { flex: none; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 13px; }
.dstep h3 { margin: 0; font-size: 17px; }
.dcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.dcard { display: flex; flex-direction: column; gap: 6px; text-align: left; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
.dcard:hover { border-color: var(--muted); }
.dcard[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.dcard strong { font-size: 15px; }
.dcard .what { color: var(--muted); font-size: 13px; }
.dcard .st { margin-top: auto; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.dcard .st::before { content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.dcard .st.ok { color: var(--ok); } .dcard .st.ok::before { background: var(--ok); }
.dcard .st.todo { color: var(--warn); } .dcard .st.todo::before { background: var(--warn); }
.dcard .st.bad { color: var(--bad); } .dcard .st.bad::before { background: var(--bad); }
.dblock input, .dblock select, .dblock textarea, .panel select { max-width: 100%; box-sizing: border-box; }
.dtools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
</style>
</head>
<body>
<header>
  <div class="hbar">
    <h1><span>gctk</span> Genesys Cloud Toolkit</h1>
    <div class="org" id="org"></div>
    <div class="who" id="who"></div>
    <div class="theme" id="theme" role="group" aria-label="Colour theme"></div>
  </div>
  <nav id="nav" aria-label="Pages"></nav>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<script nonce="__NONCE__">
"use strict";
// Colour theme: follows the system until the user picks light or dark in the top bar (remembered
// in this browser). Set before the first render so the page does not flash.
const THEME_KEY = "gctk-theme";
function currentTheme() {
  const t = document.documentElement.dataset.theme;
  return t === "light" || t === "dark" ? t : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(THEME_KEY, t); } catch {}
  renderThemeToggle();
}
function renderThemeToggle() {
  const box = document.getElementById("theme");
  const now = currentTheme();
  box.replaceChildren(...[["light", "☀ Light"], ["dark", "☾ Dark"]].map(([t, label]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.setAttribute("aria-pressed", String(now === t));
    b.addEventListener("click", () => setTheme(t));
    return b;
  }));
}
(() => {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch {}
  if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
  renderThemeToggle();
  // Without an explicit choice, follow system changes live.
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!document.documentElement.dataset.theme) renderThemeToggle(); });
})();
// Token arrives in the URL fragment; keep it for this tab only and remove it from the address bar.
const TOKEN = (() => {
  const m = location.hash.match(/token=([\w-]+)/);
  if (m) {
    const view = location.hash.match(/view=([\w-]+)/);
    const demo = location.hash.match(/[#&]demo=([\w-]+)/);
    try {
      sessionStorage.setItem("gctk-token", m[1]);
      if (view) sessionStorage.setItem("gctk-view", view[1]);
      if (demo) sessionStorage.setItem("gctk-open-demo", demo[1]);
    } catch {}
    history.replaceState(null, "", "/");
    return m[1];
  }
  try { return sessionStorage.getItem("gctk-token") || ""; } catch { return ""; }
})();

async function api(path, opts = {}) {
  const method = opts.method || "GET";
  // Every write is JSON (the server refuses anything else, which also stops cross-site form posts).
  const body = method === "GET" ? undefined : JSON.stringify(opts.body ?? {});
  const res = await fetch(path, {
    method,
    headers: { "x-gctk-token": TOKEN, ...(body ? { "content-type": "application/json" } : {}) },
    body,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

// DOM builder: all dynamic content goes through text nodes, never parsed as HTML.
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : String(v));
  }
  for (const c of children.flat(Infinity)) {
    if (c === undefined || c === null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
const pill = (text, cls) => h("span", { class: `pill ${cls || ""}` }, text);
const fmt = (v) => v === undefined ? "" : (typeof v === "string" ? JSON.stringify(v) : JSON.stringify(v, null, 0));
const short = (s, n = 160) => (s = fmt(s), s.length > n ? s.slice(0, n - 1) + "…" : s);
const time = (iso) => iso ? new Date(iso).toLocaleString() : "";

const state = { view: (() => { try { return sessionStorage.getItem("gctk-view") || "profiles"; } catch { return "profiles"; } })(), overview: null, profile: null };
// Main pages follow a solution consultant's demo prep; setup and control pages sit on the right.
// The ids are the page names the agent opens with gc_ui (UI_PAGES), so they stay as they are.
const VIEWS = [
  ["profiles", "Orgs", "Your Genesys Cloud orgs, their credentials and rules"],
  ["ai-setup", "Cursor setup", "The MCP servers Cursor loads in every folder: which org each one works on, and fixes"],
  ["axl", "Projects", "Folders you build demos in with the AI in Cursor, each with its own org; AXL workshops too"],
  ["demos", "Demos", "Deploy a whole demo into an org with one button, and start what it needs on this computer"],
  ["site", "Website", "A customer website for the industry, in the customer's brand, with your Messenger on it"],
  ["demo", "Demo ready", "Fill the agent's home screen with demo data: coaching, learning, evaluations, scorecard, schedule"],
];
const MINOR_VIEWS = [
  ["monitoring", "Monitoring", "How many queues, flows, data actions … an org has, next to its limits"],
  ["data", "Your data", "Where gctk keeps your orgs, settings and records on this computer"],
];

function renderNav() {
  const nav = document.getElementById("nav");
  const btn = ([id, label, title]) => h("button", { "aria-current": state.view === id ? "page" : null, title, onclick: () => go(id) }, label);
  nav.replaceChildren(...VIEWS.map(btn), h("span", { class: "sep" }), h("span", { class: "minor", style: "display:contents" }, MINOR_VIEWS.map(btn)));
  const o = state.overview;
  document.getElementById("who").replaceChildren(o ? `${o.user} · gctk ${o.version}` : "",
    o?.persistent ? h("button", { class: "btn", style: "padding:2px 8px;font-size:12px;margin-left:8px", title: "Stops the background UI; the AI or `gctk ui` starts it again", onclick: stopUi }, "Stop UI") : "");
  renderOrg();
}

/** The org the AI works on by default (in Cursor or Claude Code), switchable in the top bar. */
function renderOrg() {
  const box = document.getElementById("org");
  const o = state.overview;
  if (!o) return box.replaceChildren();
  const usable = o.profiles.filter((p) => !p.error);
  if (!usable.length) return box.replaceChildren(h("button", { class: "btn primary", style: "padding:3px 10px;font-size:12px", onclick: () => go("profiles") }, "Connect an org"));
  const active = usable.find((p) => p.name === o.activeProfile);
  const sel = h("select", { title: "The org the AI works on unless you name another one.", "aria-label": "Org the AI works on" },
    active ? null : h("option", { value: "" }, "choose…"),
    usable.map((p) => h("option", { value: p.name, selected: p.name === o.activeProfile }, `${p.name} · ${p.tier}${p.credentialsStored ? "" : " · no credentials"}`)));
  sel.addEventListener("change", async () => {
    const next = usable.find((p) => p.name === sel.value);
    if (!next) return;
    if (next.tier === "production" && !confirm(`Work on the production org "${next.name}" by default?`)) { sel.value = o.activeProfile || ""; return; }
    try {
      await api(`/api/profiles/${encodeURIComponent(next.name)}/activate`, { method: "POST", body: {} });
      state.profile = next.name;
      await refreshOverview();
      await render();
    } catch (err) { sel.value = o.activeProfile || ""; showError(err); }
  });
  box.replaceChildren(...[h("span", {}, "Working on"), sel, active ? pill(active.tier, `t-${active.tier}`) : null].filter(Boolean));
}

async function refreshOverview() {
  state.overview = await api("/api/overview");
  if (!state.profile) state.profile = state.overview.activeProfile || state.overview.profiles[0]?.name || null;
  renderNav();
}

function go(view) {
  state.view = view;
  try { sessionStorage.setItem("gctk-view", view); } catch {}
  render();
}
const main = () => document.getElementById("main");
async function stopUi() {
  if (!confirm("Stop the gctk UI? The AI can open it again any time.")) return;
  try { await api("/api/shutdown", { method: "POST", body: {} }); main().replaceChildren(h("div", { class: "panel empty" }, "The gctk UI was stopped. Ask the AI to open it again, or run `gctk ui`.")); }
  catch (err) { showError(err); }
}
function showError(err) { main().prepend(h("div", { class: "error" }, err.message || String(err))); }

async function render() {
  renderNav();
  state.cleanup?.();
  state.cleanup = null;
  const view = { site: viewSite, "ai-setup": viewAiSetup, demos: viewDemos, data: viewData, demo: viewDemo, axl: viewAxl, monitoring: viewMonitoring, profiles: viewProfiles }[state.view] || viewProfiles;
  try { main().replaceChildren(await view()); } catch (err) { main().replaceChildren(h("div", { class: "error" }, err.message)); }
}

// ----------------------------------------------------------------- home
function copyButton(text) {
  const btn = h("button", { class: "btn", style: "padding:2px 10px;font-size:12px" }, "Copy");
  btn.addEventListener("click", () => { try { navigator.clipboard.writeText(text); btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy"), 1200); } catch {} });
  return btn;
}

/** The n-th working day from today at a local time, for template dates. */
function workday(offset, time) {
  const d = new Date();
  for (let n = 0; n < offset;) { d.setDate(d.getDate() + 1); if (d.getDay() !== 0 && d.getDay() !== 6) n++; }
  const [hh, mm] = time.split(":").map(Number);
  d.setHours(hh, mm, 0, 0);
  return d;
}

function demoRunner(section, base, out, reload) {

    if (input) last = input;
    if (!last) return;

function demoCoaching(prof, pick, users) {

    users.filter((u) => u.id !== pick.userId).map((u) => h("option", { value: u.id }, u.name)));
  const rows = h("div", { style: "display:grid;gap:10px" });
  const addRow = (t) => {
    const r = {
      use: h("input", { type: "checkbox", checked: true, title: "Include" }),
      name: h("input", { value: t.name, style: "flex:1;min-width:220px" }),

      length: h("input", { type: "number", min: 5, max: 480, step: 5, value: t.lengthInMinutes, style: "width:72px", title: "Minutes" }),
      completed: h("input", { type: "checkbox", checked: Boolean(t.completed) }),
      description: h("input", { value: t.description, style: "width:100%" }),
      state: h("span"),
    };
    const el = h("div", { style: "border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:6px" },
      h("div", { class: "row" }, r.use, r.name, r.when, r.length, h("span", { class: "muted", style: "font-size:12px" }, "min"),
        h("label", { class: "row", style: "font-size:12px", title: "Created, then set to completed. Completed appointments cannot be deleted later." }, r.completed, "completed"),
        r.state,

      r.description);

    if (!known) return;
    const at = new Date(r.when.value).getTime();
    const same = known.find((a) => a.name === r.name.value && Math.abs(Date.parse(a.dateStart) - at) < 60_000);
    const named = known.find((a) => a.name === r.name.value);
    if (same && uncheck) r.use.checked = false;
    r.state.replaceChildren(same ? pill("already in the org", "s-applied") : named ? h("span", { class: "muted", style: "font-size:12px" }, `same name on ${new Date(named.dateStart).toLocaleDateString()}`) : pill("new", ""));
  };
  for (const t of templates) addRow({ ...t, date: workday(t.workdayOffset, t.time) });

  const run = demoRunner("coaching", base, out, () => load());

  const createBtn = h("button", { class: "btn primary" }, "Add to the agent's calendar");
  createBtn.addEventListener("click", () => {
    const chosen = [...rows.children].map((el) => el.demo).filter((r) => r.use.checked);
    if (!chosen.length) { out.replaceChildren(h("div", { class: "error" }, "Choose at least one appointment.")); return; }
    if (chosen.some((r) => !r.when.value)) { out.replaceChildren(h("div", { class: "error" }, "Every appointment needs a start.")); return; }
    if (chosen.some((r) => r.completed.checked) && !confirm("Appointments marked completed cannot be deleted afterwards (Genesys Cloud keeps them). Continue?")) return;
    run({ appointments: chosen.map((r) => ({
      name: r.name.value, description: r.description.value, dateStart: new Date(r.when.value).toISOString(),
      lengthInMinutes: Number(r.length.value), completed: r.completed.checked, ...(facilitator.value ? { facilitatorId: facilitator.value } : {}),
    })) }, createBtn);
  });

  const load = async () => {
    try {
      const s = await api(`/api/demo/coaching/status?profile=${encodeURIComponent(pick.profile)}&userId=${encodeURIComponent(pick.userId)}`);
      const now = Date.now();
      const upcoming = s.appointments.filter((a) => Date.parse(a.dateStart) >= now && a.status !== "Completed").length;
      known = s.appointments;
      for (const el of rows.children) mark(el.demo, true);
      put(list, 
        h("div", { class: "row", style: "margin-bottom:6px" }, h("strong", {}, `${s.appointments.length} appointment${s.appointments.length === 1 ? "" : "s"}`),
          h("span", { class: "muted" }, `(last 60 and next 90 days; ${upcoming} upcoming)`)),
        !s.appointments.length ? h("div", { class: "muted" }, "The agent has no coaching appointments yet.") : null,
        s.appointments.length ? h("div", { style: "overflow-x:auto" }, h("table", {},
          h("tr", {}, ["When", "Appointment", "Length", "Facilitator", "Status", ""].map((t) => h("th", {}, t))),
          s.appointments.map((a) => h("tr", {},
            h("td", { style: "white-space:nowrap" }, time(a.dateStart)),
            h("td", {}, a.name),
            h("td", {}, a.lengthInMinutes ? `${a.lengthInMinutes} min` : ""),
            h("td", {}, nameOf(a.facilitatorId)),
            h("td", {}, pill(a.status || "?", a.status === "Completed" ? "s-applied" : a.isOverdue ? "s-failed" : "s-approved")),
            h("td", {}, a.status === "Scheduled" ? h("button", { class: "btn danger", style: "padding:2px 10px", onclick: (e) => {
              if (confirm(`Delete "${a.name}"?`)) run({ appointments: [], remove: [a.id] }, e.target);
            } }, "Delete") : null))))) : null);

  return h("div", { class: "panel" },

    demoBlock("live", `${pick.userName || "The agent"}'s appointments`, "", list),
    demoBlock("setup", "Suggested appointments", "change anything you like; nothing is created until you press the button",
      h("div", { class: "row", style: "margin-bottom:8px" }, h("label", { class: "row", title: "The facilitator and the agent need the permission coaching:appointment:participate." }, "Facilitator (optional)", facilitator)),
      rows,
      h("div", { class: "row", style: "margin-top:10px" },
        h("button", { class: "btn", onclick: () => addRow({ name: "Coaching session", description: "", lengthInMinutes: 30, date: workday(3, "13:00") }) }, "+ Appointment"),
        h("span", { class: "spacer" }), createBtn)),
    out);

const dateInput = (d) => localInput(d).slice(0, 10);

function demoCleanup(pick) {
  const list = h("div", {}, h("div", { class: "muted" }, "Loading what Demo ready created…"));
  const out = h("div");
  const run = demoRunner("cleanup", { profile: pick.profile, userId: pick.userId, agentName: pick.userName }, out, () => load());
  const TITLES = { coaching: "Coaching", learning: "Learning", sta: "Speech and text analytics", evaluations: "Evaluations", scorecard: "Scorecard", schedule: "Schedule" };
  const STATE = { remove: ["will be removed", "s-pending"], restore: ["will be restored", "s-pending"], gone: ["already removed", "s-applied"], kept: ["cannot be removed", "s-failed"] };
  const load = async () => {
    try {
      const s = await api(`/api/demo/cleanup/status?profile=${encodeURIComponent(pick.profile)}&userId=${encodeURIComponent(pick.userId)}`);
      const open = s.items.filter((i) => i.state === "remove" || i.state === "restore");

        const n = open.filter((i) => chosen.includes(i.section)).length;

      put(list, 
        s.items.length ? h("div", {},
          sections.map((k) => {
            const its = s.items.filter((i) => i.section === k);

            boxes[k] = h("input", { type: "checkbox", checked: todo > 0, disabled: !todo });

              h("table", {}, its.filter((i) => i.state !== "gone").map(row)),

          }),
          h("div", { class: "row" }, h("span", { class: "spacer" }), btn))
          : h("div", { class: "muted" }, "Demo ready has not created anything for this agent in this org yet."),

  };
  load();
  return h("div", { class: "panel" },
    h("p", { class: "muted", style: "margin-top:0" }, "Removes what this page created for the agent and puts back what it changed. What was already in the org stays as it is."),

}

// ------------------------------------------------------------------ axl
// AXL workshops run in the Cursor app (skill axl-lab-facilitator, AVA harness). The user keeps a list
// of workshops here, each with the org the harness works on and the folder opened in Cursor.
// Everything shown is local state; names and paths are the user's text (text nodes only).
const AXL_STAGES = [["research", "Research"], ["discovery", "Discovery"], ["build", "Build & test"], ["readout", "Readout"]];
const AXL_ARTIFACT_LABELS = { pov: "POV deck", spec: "Spec", run: "Run", readout: "Readout" };
const axlUrl = (id, rest = "") => `/api/axl/workshops/${encodeURIComponent(id)}${rest}`;

/** One word for where a workshop stands, for the overview and the detail view. */
function axlHarnessState(x) {
  const w = x.workshop, f = x.folder;
  if (!w.profile || !w.folder) return ["incomplete", "", "Choose an org and a folder."];
  if (x.org?.problem) return ["problem", "s-failed", x.org.problem];
  if (!f.connected || f.stale) return [f.connected ? "out of date" : "not set up", "s-pending", "Press Set up folder."];
  if (x.lastStart?.sinceSetup) return ["running", "s-applied", `Cursor started the harness ${time(x.lastStart.at)} (${x.lastStart.detail}).`];
  return ["not started in Cursor", "s-pending", "Switch on this project's ava-harness in Cursor (Settings → MCP)."];
}

function axlOpenInCursor(id, small) {
  return h("button", { class: "btn", style: small ? "padding:2px 10px;font-size:12px" : null, onclick: async () => {
    try { const r = await api(axlUrl(id, "/open-cursor"), { method: "POST", body: {} }); if (!r.opened) showError(new Error("Could not open Cursor. Open the folder in Cursor yourself.")); } catch (err) { showError(err); }
  } }, "Open in Cursor");
}

async function viewAxl() {
  const [st, templates] = await Promise.all([api("/api/axl"), api("/api/axl/tool-templates").catch(() => [])]);
  state.toolTemplates = templates;
  const box = h("div", {});
  const draw = (next) => {
    const open = state.axlOpen;
    const x = open && open !== "new" ? next.workshops.find((y) => y.workshop.id === open) : null;
    if (open && open !== "new" && !x) state.axlOpen = null;
    box.replaceChildren(state.axlOpen === "new" ? axlNew(next, draw) : x ? axlDetail(next, x, draw) : axlOverview(next, draw));
  };
  draw(st);
  return box;
}

const isLabProject = (w) => w.lab !== false;
const usesHarnessUi = (w) => isLabProject(w) || w.harness === true;
const toolTitle = (n) => (TOOL_NAMES[n] || [n])[0];
/** The tools a project's folder gets, in plain names. */
const projectTools = (w) => [...(usesHarnessUi(w) ? ["AVA harness"] : []), ...(w.tools || []).map((t) => toolTitle(t.name))];

/** Where a project stands: workshops by their harness, projects by their folder's tools. */
function projectState(x) {
  const w = x.workshop, f = x.folder;
  if (isLabProject(w)) return axlHarnessState(x);
  if (!w.profile || !w.folder) return ["incomplete", "", "Choose an org and a folder."];
  if (x.org?.problem) return ["problem", "s-failed", x.org.problem];
  if (!projectTools(w).length) return ["no tools", "s-pending", "Pick the Genesys tools for this folder."];
  if (!f.exists || f.stale || (!f.connected && !(f.tools || []).some((t) => t.connected))) return [f.stale ? "out of date" : "not set up", "s-pending", "Press Set up folder."];
  const started = Object.keys(x.toolStarts || {}).length || x.lastStart;
  return started ? ["running", "s-applied", "Cursor has started the tools of this folder."] : ["set up", "s-applied", "Open the folder in Cursor and switch its tools on (Settings → MCP)."];
}

function axlHarnessMissing(st, draw) {
  if (st.harnessInstalled) return null;

}

function axlOverview(st, draw) {

      h("td", {}, h("a", { href: "#", onclick: (e) => { e.preventDefault(); open(w.id); } }, h("strong", {}, w.name)), isLabProject(w) ? [" ", pill("AXL workshop", "")] : null,
        h("div", { class: "muted mono", style: "font-size:11.5px;overflow-wrap:anywhere" }, w.folder || "no folder")),
      h("td", {}, x.org ? [x.org.profile, " ", pill(x.org.tier, `t-${x.org.tier}`)] : h("span", { class: "muted" }, "no org")),

  });
  const harnessUsers = st.workshops.filter((x) => usesHarnessUi(x.workshop));
  return h("div", {},
    h("div", { class: "row" }, h("h2", { style: "font-size:22px;margin-bottom:6px" }, "Projects"), h("span", { class: "spacer" }),
      h("button", { class: "btn" , onclick: async () => { try { draw(await api("/api/axl")); } catch (err) { showError(err); } } }, "Refresh"),
      h("button", { class: "btn primary", onclick: () => open("new") }, "+ New project")),
    h("p", { class: "lead" }, "A project is a folder you build a demo in with the AI in Cursor. Each project has its own org: gctk gives the folder the Genesys tools you pick, started with that org's credentials from the keychain, and nothing changes in your other folders. An AXL workshop is a project with the lab guide."),
    harnessUsers.length ? axlHarnessMissing(st, draw) : null,
    st.globalHarness.present && harnessUsers.length ? h("div", { class: "warn" }, `Your global ~/.cursor/mcp.json has its own ava-harness${st.globalHarness.inlineSecret ? " (with the client secret in plain text)" : ""}. Cursor runs it next to a project's, so switch it off in each project folder (Settings → MCP).`) : null,
    st.workshops.length
      ? h("div", { class: "panel", style: "overflow-x:auto" }, h("table", {}, h("tr", {}, h("th", {}, "Project"), h("th", {}, "Org"), h("th", {}, "Tools"), h("th", {}, "Status"), h("th", {}, "")), rows))
      : h("div", { class: "panel empty" }, "No projects yet. ", h("a", { href: "#", onclick: (e) => { e.preventDefault(); open("new"); } }, "Create the first one"), "."));
}

/** Orgs for a project (any, production marked) or a workshop (sandbox and dev only). */
function projectOrgSelect(st, value, lab) {
  const list = lab ? st.choices : st.orgs;
  return h("select", { "aria-label": "Org" },
    h("option", { value: "" }, list.length ? "choose…" : lab ? "no sandbox or dev org" : "no org yet: add one on the Orgs page"),
    list.map((c) => h("option", { value: c.name, selected: c.name === value }, `${c.name} · ${c.tier} · ${c.region}${c.tier === "production" ? " · PRODUCTION" : ""}`)));
}
/** Asks once before a project works on a production org; true when the org is fine to use. */
function confirmOrg(st, name) {
  const o = st.orgs.find((x) => x.name === name);
  if (!o || o.tier !== "production") return { ok: true };
  return { ok: confirm(`${name} is a PRODUCTION org.\n\nThe AI tools in this folder would read and change it directly, with that org's credentials. Use a sandbox or dev org for demos where you can.\n\nLet this project work on ${name}?`), confirmProduction: true };
}

/** Checkboxes for the AVA harness and the Genesys tools found in the user's configs. */
function toolPicker(w, st) {
  const lab = isLabProject(w);
  const templates = state.toolTemplates || [];
  const harness = h("input", { type: "checkbox", checked: usesHarnessUi(w) ? true : null, disabled: lab ? true : null, style: "width:auto" });
  const stored = w.tools || [];
  const boxes = [];
  const line = (box, title, sub) => h("label", { style: "display:flex;gap:8px;align-items:flex-start;color:var(--text);font-size:14px" }, box, h("span", {}, h("strong", {}, title), sub ? h("div", { class: "muted", style: "font-size:12px" }, sub) : null));
  const rows = [line(harness, "AVA harness", lab ? "always on for an AXL workshop" : `builds and tests AI agents · starts ${st.harnessCommand}${st.harnessInstalled ? "" : " (not installed yet)"}`)];
  for (const t of templates) {
    const has = stored.some((x) => x.name === t.name);
    const box = h("input", { type: "checkbox", checked: has ? true : null, style: "width:auto" });
    boxes.push([box, t.id]);
    rows.push(line(box, toolTitle(t.name), `${t.name !== toolTitle(t.name) ? `${t.name} · ` : ""}as in ${t.from.replace(/^\/Users\/[^/]+/, "~")}`));
  }
  for (const x of stored.filter((x) => !templates.some((t) => t.name === x.name))) {
    const box = h("input", { type: "checkbox", checked: true, style: "width:auto" });
    boxes.push([box, `keep:${x.name}`]);
    rows.push(line(box, toolTitle(x.name), "set up earlier; no longer found in your editor configs"));
  }
  if (!templates.length && !stored.length) rows.push(h("div", { class: "muted", style: "font-size:13px" }, "Other Genesys tools appear here once you have them in one of your editor configs (for example the Architect MCP server); gctk copies the program and settings, never the credentials."));
  return { el: h("div", { style: "display:grid;gap:8px" }, rows), read: () => ({ ...(lab ? {} : { harness: harness.checked }), tools: boxes.filter(([b]) => b.checked).map(([, id]) => id) }) };
}

function axlNew(st, draw) {
  const back = () => { state.axlOpen = null; draw(st); };
  let lab = false;
  const name = h("input", { placeholder: "e.g. Acme Bank", style: "min-width:260px", "aria-label": "Project name" });
  const folder = h("input", { placeholder: "~/Demos/Acme Bank", style: "flex:1;min-width:320px", "aria-label": "Project folder" });
  let folderTouched = false;
  folder.addEventListener("input", () => { folderTouched = true; });
  name.addEventListener("input", () => { if (!folderTouched) folder.value = name.value.trim() ? `~/${lab ? "AXL" : "Demos"}/${name.value.trim()}` : ""; });
  const orgBox = h("div");
  const toolsBox = h("div");
  let org, picker;
  const drawType = () => {
    org = projectOrgSelect(st, org?.value, lab);
    put(orgBox, h("label", {}, lab ? "Org the lab builds in (sandbox or dev)" : "Org the AI works on in this folder", org));
    picker = toolPicker({ lab: lab ? undefined : false, harness: false }, st);
    put(toolsBox, h("div", { style: "font-size:12px;color:var(--muted);margin-bottom:6px" }, "Genesys tools for this folder"), picker.el);
    if (!folderTouched && name.value.trim()) folder.value = `~/${lab ? "AXL" : "Demos"}/${name.value.trim()}`;
  };
  const kind = (value, title, sub) => h("button", { class: "ws-opt", "aria-pressed": String(lab === value), onclick: (e) => { lab = value; for (const b of e.currentTarget.parentElement.children) b.setAttribute("aria-pressed", String(b === e.currentTarget)); drawType(); } },
    h("span", { class: "mark" }), h("span", {}, h("strong", {}, title), h("small", {}, sub)));
  drawType();
  const create = async () => {
    const c = confirmOrg(st, org.value);
    if (!c.ok) return;
    try {
      const r = await api("/api/axl/workshops", { method: "POST", body: { name: name.value, profile: org.value, folder: folder.value, lab, ...(c.confirmProduction ? { confirmProduction: true } : {}), ...picker.read() } });
      state.axlOpen = r.id;
      draw(r);
    } catch (err) { showError(err); }
  };
  return h("div", {},
    h("p", {}, h("a", { href: "#", onclick: (e) => { e.preventDefault(); back(); } }, "← All projects")),
    h("h2", { style: "font-size:22px;margin-bottom:6px" }, "New project"),
    h("div", { class: "panel" },
      h("div", { class: "grid", style: "grid-template-columns:1fr;gap:12px" },
        h("div", { class: "grid", style: "grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px" },
          kind(false, "Demo project", "A folder for building a demo with the AI, on any of your orgs."),
          kind(true, "AXL workshop", "An AI Agent eXperience Lab: AVA harness, lab guide and sessions; sandbox or dev orgs only.")),
        h("label", {}, "Name (usually the customer)", name),
        orgBox,
        h("label", {}, "Folder you open in Cursor (created if it does not exist)", folder),
        toolsBox),
      h("p", { class: "muted", style: "font-size:13px" }, "gctk creates the folder and writes the chosen tools into its .cursor/mcp.json, each started through gctk with this org's credentials from the keychain. No secret goes into the folder."),
      h("div", { class: "row" }, h("button", { class: "btn primary", onclick: create }, "Create project"), h("button", { class: "btn", onclick: back }, "Cancel"))));
}

// A condensed AXL Session Field Guide (2026-09-24): what to do in each step, the prompts to paste
// into the Cursor agent, and what comes out. `done` names the session artifact that shows the step
// is finished. Keep it in step with the field guide when that changes. The facilitator skill never
// loads by itself (disable-model-invocation), so every prompt that starts a job names it; follow-ups
// in the same chat do not.
const AXL_GUIDE = [
  { id: "before", title: "Before the session", when: "days before", done: "spec",
    todo: [
      "Log the session in Salesforce as soon as it is agreed: SE/SA Task, Activity Type \"Agentic Experience Lab\".",

      { text: "Confirm which Genesys Cloud org you are connected to and show me its name and id.", note: "Check the org (in this workshop folder)" },

      "Path B: pick the option to build a new use case during discovery and author it live (costs ~45 min).",

    ],
    prompts: [{ text: "/axl-lab-facilitator Let's continue with the <use case>", note: "Job 2: discovery on the chosen use case (Path B: pick the new use case option it offers)" }],

  { id: "build", title: "3 · Create & test the AVA", when: "1:00–2:30", done: "run",

  { id: "review", title: "4 · Review, test manually & refine", when: "2:30–3:10",
    todo: [
      "Walk the run artifact with the customer and agree the UAT shortlist from the success criteria.",
      "With four or more people, split into groups: happy path, guardrails, edge cases & escalation, voice & language quality. Log everything, 5-minute readback, one refine pass.",

const AXL_BRIEF_DEFAULTS = { moreUseCases: 2, language: (navigator.language || "").startsWith("de") ? "de" : "en", functionPath: true, runsPerCase: 1, threshold: 80, afterThreshold: "decide", maxVersions: 5, parallel: 2 };

/** The research (Job 1) and build (Job 3) prompts from a workshop's brief, in the session language. */
function axlPrompts(w, brief) {
  const b = { ...AXL_BRIEF_DEFAULTS, customer: w.name, ...brief };
  const de = b.language === "de";
  const lines = [];
  const add = (text) => { if (text) lines.push(text); };
  const runs = b.runsPerCase === 1 ? (de ? "einmal" : "once") : (de ? `${b.runsPerCase}-mal` : `${b.runsPerCase} times`);
  const after = {
    decide: de ? "entscheide ich, ob wir weitermachen oder diese Lösung in die UATs übergeben" : "I decide whether we continue or hand this solution over to the UATs",
    uat: de ? "übergib die Lösung in die UATs" : "hand the solution over to the UATs",
    continue: de ? `iteriere weiter, bis alle Testcases bestanden sind, höchstens bis Version ${b.maxVersions}` : `keep iterating until all test cases pass, up to version ${b.maxVersions} at most`,
  }[b.afterThreshold];
  const testing = de
    ? `Das Testing soll später nach folgendem Ziel ablaufen: Nach dem Erstellen der Test Cases soll jeder Testcase pro Iteration ${runs} durchlaufen werden. Wenn mindestens ${b.threshold} % der Testcases bestanden sind, ${after}.`
    : `Testing later follows this goal: once the test cases are created, run each test case ${runs} per iteration. When at least ${b.threshold}% of the test cases pass, ${after}.`;
  const parallel = b.parallel > 1
    ? (de ? `Versuche das Testing mit ${b.parallel} parallelen Testcase Runs. Wenn Rate Limits erreicht werden, gehe zurück auf eine parallele Session.` : `Try testing with ${b.parallel} parallel test case runs. If you hit rate limits, fall back to one session at a time.`)
    : (de ? "Führe die Testcase Runs nacheinander aus." : "Run the test cases one at a time.");

  add(de ? `/axl-lab-facilitator Recherchiere für eine AXL Session mit ${b.customer} als Kunden.` : `/axl-lab-facilitator Research ${b.customer} for an upcoming AXL session.`);
  add(b.useCase);
  if (b.moreUseCases > 0) add(b.useCase
    ? (de ? `Entwickle außerdem ${b.moreUseCases} weitere mögliche Use Cases als Entscheidungsgrundlage.` : `Also develop ${b.moreUseCases} further possible use cases as a basis for the decision.`)
    : (de ? `Schlage ${b.moreUseCases} mögliche Use Cases als Entscheidungsgrundlage vor.` : `Propose ${b.moreUseCases} possible use cases as a basis for the decision.`));
  if (b.knowledge) add(de ? `Außerdem soll es Wissen zu folgenden Themen geben: ${b.knowledge}` : `The agent should also have knowledge about: ${b.knowledge}`);
  if (b.persona) add(de ? `Der Agentic Agent soll den Namen ${b.persona} tragen.` : `The agentic agent should be called ${b.persona}.`);
  add(de ? "Alle Assets und diese Session sollen auf Deutsch stattfinden." : "All assets and this session are in English.");
  if (b.functionPath) add(de ? "Alle Tools sollen soweit möglich den Function Path nutzen und nicht den Echo Path." : "All tools should use the function path rather than the echo path wherever possible.");
  add(testing);
  add(parallel);
  const research = lines.join("\n");

  const build = [
    de ? "/axl-lab-facilitator Job 3: Baue und teste den AVA." : "/axl-lab-facilitator Job 3: Build and test the AVA.",
    de ? `Höchstens 10 Testcases; jeder Testcase läuft pro Iteration ${runs}. Wenn mindestens ${b.threshold} % bestanden sind, ${after}. Sonst verfeinere und iteriere, höchstens bis Version ${b.maxVersions}.`
       : `At most 10 test cases; run each test case ${runs} per iteration. When at least ${b.threshold}% pass, ${after}. Otherwise refine and iterate, up to version ${b.maxVersions} at most.`,
    parallel,
  ].join("\n");
  return { research, build };
}

/** The form behind the research prompt; saved with the workshop (the user's text, shown as text only). */
function axlBriefForm(w, onChange) {
  const b = { ...AXL_BRIEF_DEFAULTS, customer: w.name, ...(w.brief || {}) };
  const field = (label, el, wide) => h("label", { style: wide ? "grid-column:1/-1" : null }, label, el);
  const input = (key, attrs = {}) => h("input", { value: b[key] ?? "", ...attrs });
  const area = (key, placeholder) => h("textarea", { placeholder, style: "min-height:70px;font-family:inherit;font-size:13.5px" }, b[key] ?? "");
  const num = (key, min, max) => h("input", { type: "number", min, max, value: b[key], style: "width:80px" });
  const select = (key, opts) => h("select", {}, opts.map(([v, l]) => h("option", { value: v, selected: String(b[key]) === v }, l)));
  const els = {
    customer: input("customer", { placeholder: w.name }),
    useCase: area("useCase", "What the agent should do, e.g. a central reservation line: ask for date, tent, lunch or evening, number of tables (10 people each), point out the prices."),
    moreUseCases: num("moreUseCases", 0, 5),
    knowledge: area("knowledge", "Optional, e.g. which beer is served where, opening hours"),
    persona: input("persona", { placeholder: "e.g. Johann" }),
    language: select("language", [["de", "Deutsch"], ["en", "English"]]),
    functionPath: h("input", { type: "checkbox", checked: b.functionPath ? true : null, style: "width:auto" }),
    runsPerCase: num("runsPerCase", 1, 5),
    threshold: num("threshold", 50, 100),
    afterThreshold: select("afterThreshold", [["decide", "I decide: continue or hand over to UATs"], ["uat", "hand over to UATs"], ["continue", "keep iterating up to the max version"]]),
    maxVersions: num("maxVersions", 1, 10),
    parallel: num("parallel", 1, 4),
  };
  const read = () => {
    const out = {};
    for (const [k, el] of Object.entries(els)) out[k] = el.type === "checkbox" ? el.checked : el.type === "number" ? Number(el.value) : el.value;
    return out;
  };
  for (const el of Object.values(els)) {
    el.addEventListener("input", () => onChange(read(), false));
    el.addEventListener("change", () => onChange(read(), true));
  }
  return h("div", { class: "grid", style: "grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:8px 0" },
    field("Customer", els.customer),
    field("Session and assets in", els.language),
    field("Persona name of the agent", els.persona),
    field("Use case", els.useCase, true),
    field("Further use cases to propose", els.moreUseCases),
    field("Knowledge", els.knowledge, true),
    h("label", { style: "display:flex;gap:8px;align-items:center;grid-column:1/-1" }, els.functionPath, "Tools use the function path where possible (a tool with a failure path, e.g. for the escalation, still needs the echo path)"),
    field("Runs per test case and iteration", els.runsPerCase),
    field("Pass threshold (%)", els.threshold),
    field("When reached", els.afterThreshold),
    field("Max version", els.maxVersions),
    field("Parallel test runs (falls back to 1 on rate limits)", els.parallel));
}

/** The field guide for one workshop; steps whose artifact exists in the latest session are ticked. */
function axlGuide(x) {
  const w = x.workshop;
  let brief = w.brief || {};
  const dyn = {};
  const refresh = () => {
    const p = axlPrompts(w, brief);
    for (const [k, el] of Object.entries(dyn)) el.pre.textContent = p[k];
  };
  const onChange = (next, persist) => {
    brief = next;
    refresh();
    if (persist) api(axlUrl(w.id), { method: "PUT", body: { brief: next } }).then((r) => { const y = r.workshops.find((z) => z.workshop.id === w.id); if (y) w.brief = y.workshop.brief; }).catch(showError);
  };
  const latest = x.sessions[0];
  const have = new Set(latest ? latest.artifacts : []);
  const doneIdx = AXL_GUIDE.reduce((n, g, i) => (g.done && have.has(g.done) ? i : n), -1);
  const fill = (text) => text.replaceAll("<customer>", x.workshop.name);
  const panel = h("div", { class: "panel" },
    h("h3", { style: "margin-top:0" }, "Running the workshop"),
    h("p", { class: "muted", style: "font-size:13px;margin:0 0 8px" }, latest
      ? `Progress from the latest session, ${latest.name.replace(/^AXL-/i, "")}. Prompts go into the Cursor agent you started for the research; keep that one agent for the whole engagement.`
      : "Condensed from the AXL Session Field Guide. Prompts go into the Cursor agent you start for the research; keep that one agent for the whole engagement."),
    AXL_GUIDE.map((g, i) => {
      const done = i <= doneIdx;
      return h("details", { style: "border-top:1px solid var(--line);padding:4px 0", open: i === doneIdx + 1 ? true : null },
        h("summary", { style: "color:var(--text)" }, done ? "✓ " : "", h("strong", {}, g.title), h("span", { class: "muted" }, `  ${g.when}`)),
        h("ul", { style: "margin:4px 0 8px;padding-left:20px;font-size:13.5px" }, g.todo.map((t) => h("li", {}, t))),
        g.id === "before" ? axlBriefForm(w, onChange) : null,
        (g.prompts || []).map((pr) => {
          const pre = h("pre", { style: "flex:1;margin:0;white-space:pre-wrap" }, pr.dynamic ? "" : fill(pr.text));
          if (pr.dynamic) dyn[pr.dynamic] = { pre };
          const copy = h("button", { class: "btn", style: "padding:2px 10px;font-size:12px" }, "Copy");
          copy.addEventListener("click", () => { try { navigator.clipboard.writeText(pre.textContent); copy.textContent = "Copied"; setTimeout(() => (copy.textContent = "Copy"), 1200); } catch {} });
          return h("div", { style: "margin:6px 0" },
            h("div", { class: "muted", style: "font-size:12px;margin-bottom:2px" }, pr.note),
            h("div", { class: "row", style: "align-items:flex-start;flex-wrap:nowrap" }, pre, copy));
        }),
        h("div", { style: "font-size:13px;margin:4px 0 6px" }, h("span", { class: "muted" }, "Comes out: "), g.out));
    }));
  refresh();
  return panel;
}

/** What the AI in Cursor gets in this folder: its own servers, your global ones and plugins. */
function folderServers(w) {
  const box = h("div", {}, h("div", { class: "muted" }, "Reading your Cursor configs…"));
  if (!w.folder) { put(box, h("div", { class: "muted" }, "Set the folder first.")); return box; }
  api("/api/ai-setup").then((s) => {
    const list = s.servers.filter((x) => x.editor === "cursor" && (x.scope === "user" || x.scope === "plugin" || x.project === w.folder));
    const own = new Set(list.filter((x) => x.project === w.folder).map((x) => x.name));
    const from = (x) => x.project === w.folder ? "this folder" : x.scope === "plugin" ? `plugin ${x.plugin}` : "all projects (~/.cursor/mcp.json)";
    const org = (x) => x.credentials === "gctk-profile" ? "needs no org" : x.org?.profile || (x.org?.clientId ? "an OAuth client gctk does not know" : x.genesys ? "org not known" : "–");
    put(box, list.length ? h("table", {}, h("tr", {}, h("th", {}, "Server"), h("th", {}, "From"), h("th", {}, "Org"), h("th", {}, "")),

        h("td", {}, h("strong", {}, toolTitle(x.name)), x.name !== toolTitle(x.name) ? h("div", { class: "muted mono", style: "font-size:11.5px" }, x.name) : null),
        h("td", { class: "muted" }, from(x)),
        h("td", {}, org(x), x.org?.profile && w.profile && x.genesys && x.org.profile !== w.profile && x.project !== w.folder ? [" ", pill("another org", "s-pending")] : null),

      : h("div", { class: "muted" }, "Cursor loads no MCP servers in this folder yet."));
  }).catch((err) => put(box, h("div", { class: "error" }, err.message)));
  return box;
}

        h("td", { class: "muted", style: "white-space:nowrap" }, time(s.modified)),
        h("td", {}, h("button", { class: "btn", style: "padding:2px 10px;font-size:12px", onclick: () => api(axlUrl(w.id, "/reveal"), { method: "POST", body: { session: s.name } }).catch(showError) }, "Open")))))
      : h("div", { class: "muted" }, x.sessionsDir ? "No sessions yet. They appear here when the lab writes its first artifact." : "Set the folder first."));
  }

  const remove = h("button", { class: "btn danger", onclick: async () => {
    if (!confirm(`Remove the project "${w.name}" from gctk? Its tools are taken out of the folder's .cursor/mcp.json; the folder and everything in it stay.`)) return;
    try { const r = await api(axlUrl(w.id), { method: "DELETE" }); state.axlOpen = null; draw(r); } catch (err) { showError(err); }
  } }, "Remove project");

  return h("div", {},
    h("p", {}, h("a", { href: "#", onclick: (e) => { e.preventDefault(); back(); } }, "← All projects")),

// ----------------------------------------------------------- monitoring
// Counts of objects in the org next to the org's own limits (organizations/limits API). Read-only.
const MON_GROUPS = ["Integrations", "Architect", "Routing", "People", "AI and digital", "Other"];
const monNumber = (n) => Number(n).toLocaleString();

function monCard(m) {
  const count = m.count === undefined ? "–" : `${monNumber(m.count)}${m.atLeast ? "+" : ""}`;
  return h("div", { class: `m-${m.level}`, title: m.hint || null },
    h("div", { class: "muted", style: "font-size:13px" }, m.label),
    h("div", { class: "n" }, count, m.limit ? h("small", {}, ` / ${monNumber(m.limit)}`) : null),
    m.note ? h("div", { class: "muted", style: "font-size:12px;overflow-wrap:anywhere" }, m.note) : null,
    m.error ? h("div", { class: "muted", style: "font-size:12px" }, m.error)
      : m.limit ? [h("div", { class: "meter" }, h("i", { style: `width:${Math.min(100, Math.max(m.count ? 2 : 0, m.percent))}%` })),
        h("div", { class: "muted", style: "font-size:12px" }, `${m.percent} % of the limit`)]
      : h("div", { class: "muted", style: "font-size:12px" }, "No limit in the API"));
}

async function viewMonitoring() {
  const o = state.overview || await api("/api/overview");
  const usable = o.profiles.filter((p) => !p.error);
  if (!usable.length) return h("div", { class: "panel empty" }, "Add a profile first.");
  if (!usable.some((p) => p.name === state.profile)) state.profile = usable[0].name;
  const select = h("select", { "aria-label": "Org", onchange: () => { state.profile = select.value; render(); } },
    usable.map((p) => h("option", { value: p.name, selected: p.name === state.profile }, `${p.name} (${p.tier})`)));
  const body = h("div", {}, h("div", { class: "panel empty" }, "Counting objects in the org…"));
  const refresh = h("button", { class: "btn" }, "Refresh");
  const load = async (fresh) => {
    const profile = state.profile;
    refresh.disabled = true;
    try {
      const r = await api(`/api/monitoring?profile=${encodeURIComponent(profile)}${fresh ? "&refresh=1" : ""}`);
      if (profile === state.profile && state.view === "monitoring") body.replaceChildren(monReport(r));
    } catch (err) {
      body.replaceChildren(h("div", { class: "error" }, err.message));
    } finally { refresh.disabled = false; }
  };
  refresh.addEventListener("click", () => load(true));
  load(false);
  return h("div", {},
    h("div", { class: "row" }, h("h2", { style: "font-size:22px;margin-bottom:6px" }, "Monitoring"), h("span", { class: "spacer" }), select, refresh),
    h("p", { class: "lead" }, "How many objects this org has, next to the limits Genesys Cloud sets for it. The limits come from the org itself, so raised limits show up too. Cards turn amber from 80 % and red from 95 %."),
    body);
}

function monReport(r) {
  const close = r.metrics.filter((m) => m.level === "warn" || m.level === "alert").sort((a, b) => b.percent - a.percent);
  const failed = r.metrics.filter((m) => m.level === "error").length;
  return h("div", {},
    h("div", { class: "muted", style: "margin:-6px 0 10px;font-size:12px" }, `${r.profile} · counted ${time(r.at)}${failed ? ` · ${failed} not readable` : ""}`),
    close.length
      ? h("div", { class: "warn" }, h("strong", {}, "Close to a limit: "), close.map((m, i) => [i ? ", " : "", `${m.label} ${monNumber(m.count)} / ${monNumber(m.limit)} (${m.percent} %)`]))
      : h("div", { class: "okbox" }, "Everything is below 80 % of its limit."),
    r.limitErrors.length ? h("div", { class: "warn" }, `Limits not readable for: ${r.limitErrors.join(", ")}. Those cards show the count only.`) : null,
    MON_GROUPS.map((g) => {
      const items = r.metrics.filter((m) => m.group === g);
      return items.length ? [h("h3", {}, g), h("div", { class: "mon" }, items.map(monCard)), g === "Integrations" ? monIntegrations(r) : null] : null;
    }));
}

const MON_TYPES = { "purecloud-data-actions": "Genesys Cloud", "custom-rest-actions": "Web services", "function-data-actions": "Function", "aws-lambda-data-actions": "AWS Lambda",
  "google-cloud-data-actions": "Google Cloud", "salesforce-datadip": "Salesforce", "microsoft-dynamics-data-actions": "Dynamics 365", "zendesk-datadip": "Zendesk" };

/** Data actions per integration: where the actions are, and which integration is full. */
function monIntegrations(r) {
  const rows = r.integrations || [];
  if (!rows.length) return null;
  const limit = r.metrics.find((m) => m.id === "dataactions-per-integration")?.limit;
  const cell = (n) => h("td", { style: "text-align:right;white-space:nowrap" }, n ? monNumber(n) : h("span", { class: "muted" }, "–"));
  const tr = (x) => {

// ---------------------------------------------------------------- demos
// Whole demos deployed into an org with one button: prerequisites (checked where possible), deploy
// and remove (background jobs, the page follows their log), commands the demo needs on this
// computer (Start / Stop / Log), and the manual steps on the day.
const DEMOS_KEY = "gctk-demos";
const PREREQ = { ok: ["ready", "s-applied"], missing: ["missing", "s-failed"], manual: ["check yourself", "s-pending"], error: ["could not check", "s-pending"] };

async function viewDemos() {
  const data = await api("/api/demos");
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(DEMOS_KEY) || "{}") || {}; } catch {}
  // pick.demo is the open demo; empty = the catalog. The page always starts in the catalog.
  // A link may open one demo directly: …#token=…&view=demos&demo=<id>.
  let linked = "";
  try { linked = sessionStorage.getItem("gctk-open-demo") || ""; sessionStorage.removeItem("gctk-open-demo"); } catch {}
  const pick = state.demosPick || (state.demosPick = { demo: linked, profile: saved.profile || "", query: "" });
  const keep = () => { try { localStorage.setItem(DEMOS_KEY, JSON.stringify({ profile: pick.profile })); } catch {} };
  const open = (id) => { pick.demo = id; render(); window.scrollTo({ top: 0 }); };
  const msg = h("div");
  const demo = data.demos.find((d) => d.id === pick.demo);
  if (demo) {
    const back = h("button", { class: "btn", onclick: () => open("") }, "← All demos");
    return h("div", {}, h("div", { class: "row", style: "margin-bottom:10px" }, back, h("span", { class: "muted" }, `Demos / ${demo.manifest?.name || demo.folder.split("/").pop()}`)), msg, demoDetail(demo, data, pick, keep, msg));
  }

  const head = [h("h2", { style: "font-size:22px;margin-bottom:6px" }, "Demos"),
    h("p", { class: "lead" }, "Pick a demo to see what it contains, what the org needs and how to deploy it. A deploy builds the whole demo in an org with one button: queues, case plans, Copilot, knowledge, bot flow, agent scripts.")];
  if (!data.demos.length) return h("div", {}, head, msg, h("div", { class: "panel empty" }, "This gctk has no demos."));

  const search = h("input", { type: "search", placeholder: "Search demos", value: pick.query || "", style: "min-width:260px" });
  const grid = h("div", { class: "cards" });
  const card = (d) => {
    const m = d.manifest;
    if (!m) return h("div", { class: "panel" }, h("strong", {}, d.folder.split("/").pop()), h("div", { class: "error" }, d.error || "This demo cannot be read."));
    const first = ["Digital bot flow", "Inbound message flow", "Copilot assistant", "Case plan", "Agent script", "Knowledge base", "Speech & text analytics program", "Queue"];
    const rank = (l) => (first.indexOf(l) + 1 || 99);
    const kinds = (d.snapshot?.contents || []).map((c) => c.label).sort((a, b) => rank(a) - rank(b));
    return h("div", { class: "panel", style: "cursor:pointer", role: "button", tabindex: "0", onclick: () => open(d.id), onkeydown: (ev) => { if (ev.key === "Enter") open(d.id); } },
      h("div", { class: "row" }, h("strong", { style: "font-size:16px" }, m.name), h("span", { class: "spacer" })),
      m.description ? h("div", { class: "muted", style: "font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden" }, m.description) : null,
      h("div", { style: "font-size:13px" }, d.snapshot ? `${d.snapshot.objects} objects: ${kinds.slice(0, 5).join(", ")}${kinds.length > 5 ? ` and ${kinds.length - 5} more kinds` : ""}` : h("span", { class: "muted" }, "No snapshot yet")),
      (m.parameters || []).length ? h("div", { class: "muted", style: "font-size:12px" }, `You enter: ${m.parameters.map((p) => p.label.split(" (")[0]).join(" · ")}`) : null,
      h("div", { class: "row", style: "margin-top:auto;flex-wrap:wrap;gap:6px" },
        d.deployments.length ? d.deployments.map((x) => pill(`deployed in ${x.profile}`, "s-applied")) : h("span", { class: "muted", style: "font-size:12px" }, "Not deployed yet"),
        h("span", { class: "spacer" }),
        h("button", { class: "btn primary", onclick: (ev) => { ev.stopPropagation(); open(d.id); } }, "Open")));
  };
  const draw = () => {
    const q = (pick.query || "").toLowerCase();
    const hits = data.demos.filter((d) => !q || `${d.manifest?.name || ""} ${d.manifest?.description || ""} ${(d.snapshot?.contents || []).map((c) => c.label).join(" ")}`.toLowerCase().includes(q));
    put(grid, hits.length ? hits.map(card) : h("div", { class: "panel empty" }, "No demo matches the search."));
  };
  search.oninput = () => { pick.query = search.value; draw(); };
  draw();
  return h("div", {}, head, msg, data.demos.length > 3 ? h("div", { class: "row", style: "margin-bottom:12px" }, search) : null, grid);
}

      h("div", { style: "font-size:13px;font-weight:600" }, c.name),
      h("table", { style: "font-size:13px;margin-top:4px" }, c.items.map((it) => h("tr", {}, h("td", { style: "vertical-align:top;white-space:nowrap;padding-right:12px" }, it.name), h("td", { class: "muted" }, it.ticksWhen))))))) : null,
    ref.topics.length ? block("Speech & text analytics topics (marked in the conversation afterwards)", ref.topics.map((tp) => h("div", { style: "font-size:13px;margin-top:4px" }, h("b", {}, tp.name), h("span", { class: "muted" }, `: ${tp.phrases.join(" · ")}`)))) : null);

// What the org's OAuth client needs for this demo, from the API spec. "a | b" means one of them is enough.
function permissionsPanel(d) {
  const groups = d.permissions || [];
  if (!groups.length) return null;
  const total = new Set(groups.flatMap((g) => g.items)).size;
  const text = groups.map((g) => `${g.title}\n${g.items.map((x) => `  ${x.split(" | ").join(" or ")}`).join("\n")}`).join("\n\n");
  return h("details", { class: "panel" },
    h("summary", { style: "margin:0" }, `Permissions the org's OAuth client needs (${total})`),
    h("p", { class: "muted", style: "font-size:13px" }, "Give the OAuth client of the org (Client Credentials) a role with these permissions. Without them the deploy stops at the first object it may not create. Where it says \"or\", one of the two is enough."),
    h("div", { class: "row", style: "margin-bottom:8px" }, h("button", { class: "btn", onclick: async (ev) => { await navigator.clipboard.writeText(text); ev.target.textContent = "Copied"; setTimeout(() => (ev.target.textContent = "Copy list"), 1500); } }, "Copy list")),
    groups.map((g) => h("div", { style: "margin-top:10px" },
      h("strong", { style: "font-size:13px" }, `${g.title} (${g.items.length})`),
      h("div", { class: "mono", style: "font-size:12px;columns:2 320px;column-gap:24px;margin-top:4px" }, g.items.map((x) => h("div", {}, x.split(" | ").join(" or ")))))));
}

function demoDetail(d, data, pick, keep, msg) {
  if (d.error) return h("div", { class: "error" }, d.error);
  const m = d.manifest;
  const profiles = (state.overview?.profiles || []).filter((p) => !p.error && p.credentialsStored);
  if (!profiles.some((p) => p.name === pick.profile)) pick.profile = profiles.find((p) => p.name !== d.sourceProfile)?.name || profiles[0]?.name || "";
  const orgSel = h("select", { onchange: () => { pick.profile = orgSel.value; keep(); render(); } },
    profiles.map((p) => h("option", { value: p.name, selected: p.name === pick.profile }, `${p.name} (${p.tier}, ${p.region})${p.name === d.sourceProfile ? " · the snapshot source" : ""}`)));
  const deployed = d.deployments.find((x) => x.profile === pick.profile);
  const prereqBox = h("div", {}, h("div", { class: "muted" }, "Checking the org …"));
  const divSel = h("select", {}, h("option", {}, "…"));
  const userSel = h("select", { style: "min-width:240px" }, h("option", {}, "…"));
  const waSel = h("select", { style: "min-width:240px" }, h("option", { value: "" }, "…"));
  let whatsapp = [];
  // Parameters: the presenter's own values (e.g. the phone that plays the customer), prefilled from the last deploy into this org.
  const paramInputs = (m.parameters || []).map((p) => ({ p, el: h("input", { type: p.format === "email" ? "email" : p.format === "phone" ? "tel" : "text", value: deployed?.params?.[p.id] || "", placeholder: p.format === "phone" ? "+4915112345678" : p.format === "email" ? "name@example.com" : "", style: "min-width:240px" }) }));
  const cmdBox = h("div");
  const out = h("div");

  const step = (n, title, ...body) => h("div", { class: "panel" }, h("div", { class: "row" }, h("span", { class: "count", style: "margin:0;font-size:13px;min-width:24px;padding:2px 6px" }, n), h("strong", {}, title)), h("div", { style: "margin-top:10px" }, ...body));
  // Background job: start it, then follow its log until it is done.
  const follow = async (url, body, title, after) => {
    const logEl = h("pre", { style: "max-height:300px;white-space:pre-wrap" }, "");
    put(out, h("div", { class: "panel" }, h("strong", {}, title), logEl));
    out.scrollIntoView({ behavior: "smooth", block: "nearest" });
    try {
      const { job } = await api(url, { method: "POST", body });
      for (;;) {
        await new Promise((r) => setTimeout(r, 1500));
        const j = await api(`/api/demos/jobs/${job}`);
        logEl.textContent = j.lines.join("\n");
        logEl.scrollTop = logEl.scrollHeight;
        if (j.done) {
          if (j.error) out.firstChild.append(h("div", { class: "error" }, j.error));
          else out.firstChild.append(h("div", { class: "okbox" }, after(j.result)));
          break;
        }
      }
    } catch (err) { out.firstChild.append(h("div", { class: "error" }, err.message)); }
    const fresh = await api("/api/demos");
    Object.assign(d, fresh.demos.find((x) => x.id === d.id));
    drawDeploy();
  };

  const deployBox = h("div");
  // Customer channel: preselected from the last deploy into this org, else the demo's first channel.
  const channels = m.channels || [];
  pick.channel = channels.some((ch) => ch.id === pick.channel) ? pick.channel : (deployed?.channel || channels[0]?.id || "");
  const routingHere = () => m.messageRouting && (!m.messageRouting.channel || m.messageRouting.channel === pick.channel);
  const channelLabel = (id) => channels.find((ch) => ch.id === id)?.label || id;
  const channelPick = () => channels.length ? h("div", { style: "margin-top:10px" },
    h("div", { style: "font-weight:600;margin-bottom:6px" }, "How does the customer write to you?"),
    h("div", { class: "grid" }, channels.map((ch) => h("label", { class: "panel", style: `margin:0;cursor:pointer;display:flex;gap:10px;align-items:flex-start;${ch.id === pick.channel ? "border-color:var(--accent)" : ""}` },
      h("input", { type: "radio", name: `channel-${d.id}`, checked: ch.id === pick.channel, onchange: () => { pick.channel = ch.id; drawDeploy(); }, style: "margin-top:4px" }),
      h("span", {}, h("strong", {}, ch.label), ch.description ? h("div", { class: "muted", style: "font-size:13px" }, ch.description) : null))))) : null;
  const drawDeploy = () => {
    const dep = d.deployments.find((x) => x.profile === pick.profile);
    put(deployBox,
      d.snapshot ? null : h("div", { class: "warn" }, d.canSnapshot ? `No snapshot yet: take one from ${d.sourceProfile} under "What the demo contains" first.` : "No snapshot yet, so this demo cannot be deployed. Update gctk to get it."),
      dep ? h("div", { class: "okbox" }, `Deployed into ${pick.profile} on ${time(dep.at)}: ${dep.created} objects created${dep.reused ? `, ${dep.reused} were already there` : ""}${dep.division ? `, division ${dep.division}` : ""}${dep.presenter ? `, presenter ${dep.presenter}` : ""}${dep.channel ? `, customer channel: ${channelLabel(dep.channel)}` : ""}.${dep.routing ? ` WhatsApp ${dep.routing.integration}${dep.routing.phone ? ` (${dep.routing.phone})` : ""} routes to the demo.` : ""}`) : null,
      channelPick(),
      h("div", { class: "grid", style: "margin-top:12px" }, h("label", {}, "Division", divSel), h("label", {}, "Presenter (member of the demo's queues)", userSel),
        routingHere() ? h("label", {}, `WhatsApp number (routed to "${m.messageRouting.flow}")`, waSel) : null,
        paramInputs.map(({ p, el }) => h("label", {}, `${p.label}${p.optional ? "" : " *"}`, el))),
      h("div", { class: "row", style: "margin-top:10px" },
        h("button", { class: "btn primary", disabled: !d.snapshot, onclick: () => {

          if (routingHere() && !wa && !confirm("No WhatsApp number is selected, so no message routing changes and the customer cannot write via WhatsApp. Deploy anyway?")) return;
          const route = wa ? `\n\nMessages to WhatsApp ${wa.name}${wa.phone ? ` (${wa.phone})` : ""} then go to "${m.messageRouting.flow}"${wa.flow && wa.flow !== m.messageRouting.flow ? ` instead of "${wa.flow}" (Remove puts "${wa.flow}" back)` : ""}.` : "";
          const params = Object.fromEntries(paramInputs.map(({ p, el }) => [p.id, el.value.trim()]));
          const empty = paramInputs.find(({ p, el }) => !p.optional && !el.value.trim());
          if (empty) { empty.el.focus(); put(msg, h("div", { class: "error" }, `Enter "${empty.p.label}".`)); return; }

          follow(`/api/demos/${d.id}/deploy`, { profile: pick.profile, divisionId: divSel.value, presenterId: userSel.value, whatsappIntegrationId: wa ? wa.id : "", channel: pick.channel, params }, `Deploying into ${pick.profile}`, (r) => `Done: ${r.created.length} objects in ${pick.profile}${r.reused.length ? `, ${r.reused.length} were already there` : ""}.`);

          if (!confirm(`Remove everything this page created in ${pick.profile} (${dep.created} objects)? Objects that were already there stay.`)) return;
          follow(`/api/demos/${d.id}/remove`, { profile: pick.profile }, `Removing from ${pick.profile}`, (r) => `Removed ${r.removed} objects.${r.failed.length ? ` Not removed: ${r.failed.join("; ")}` : ""}`);
        } }, "Remove from this org") : null));
  };

  const drawCommands = (cmds) => put(cmdBox, (cmds || []).length ? cmds.map((c) => {
    const logEl = h("pre", { style: "max-height:260px;white-space:pre-wrap", hidden: true });
    const showLog = async () => { logEl.hidden = !logEl.hidden; if (!logEl.hidden) logEl.textContent = (await api(`/api/demos/${d.id}/commands/${c.id}/log`)).log || "(no output yet)"; };
    const act = async (what) => {
      try {
        if (what === "start") await api(`/api/demos/${d.id}/commands/${c.id}/start`, { method: "POST", body: { profile: pick.profile } });
        else await api(`/api/demos/${d.id}/commands/${c.id}/stop`, { method: "POST", body: {} });
        setTimeout(async () => drawCommands(await api(`/api/demos/${d.id}/commands`)), what === "start" ? 2500 : 800);
      } catch (err) { put(msg, h("div", { class: "error" }, err.message)); window.scrollTo({ top: 0, behavior: "smooth" }); }
    };
    return h("div", { class: "todo-row", style: "flex-wrap:wrap" },
      h("strong", {}, c.label), c.running ? pill(`running for ${c.profile}`, "s-applied") : pill("stopped", ""),
      c.running && c.links?.length ? c.links.map((l) => h("a", { href: l.url, target: "_blank", rel: "noopener", style: "margin-right:10px" }, l.label)) : c.running && c.url ? h("a", { href: c.url, target: "_blank", rel: "noopener" }, c.url) : null,

      c.running ? h("button", { class: "btn danger", onclick: () => act("stop") }, "Stop") : null,

  }) : h("div", { class: "muted" }, "This demo needs nothing running on this computer."));

  if (pick.profile) api(`/api/demos/${d.id}/org?profile=${encodeURIComponent(pick.profile)}`).then((o) => {
