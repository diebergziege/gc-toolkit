<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gctk · Genesys Cloud Toolkit</title>
<style nonce="__NONCE__">
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5f6b7a; --line: #e2e6ec;
  --accent: #ff4f1f; --accent-ink: #ffffff;
  --ok: #1a7f4b; --ok-bg: #e5f5ec; --warn: #9a6200; --warn-bg: #fff4de; --bad: #b42318; --bad-bg: #fde8e6;
  --info: #1f5fbf; --info-bg: #e7effb; --neutral-bg: #eef0f3;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
/* Dark: the system setting, unless the user picked light in the top bar; or picked dark explicitly. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #1a1f27; --text: #e6e9ef; --muted: #98a2b3; --line: #2b323d;
    --ok: #5fd39b; --ok-bg: #173226; --warn: #f5c16c; --warn-bg: #3a2c12; --bad: #ff8a80; --bad-bg: #3d1a18;
    --info: #8db8ff; --info-bg: #182a44; --neutral-bg: #252b35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1a1f27; --text: #e6e9ef; --muted: #98a2b3; --line: #2b323d;
  --ok: #5fd39b; --ok-bg: #173226; --warn: #f5c16c; --warn-bg: #3a2c12; --bad: #ff8a80; --bad-bg: #3d1a18;
  --info: #8db8ff; --info-bg: #182a44; --neutral-bg: #252b35;
  color-scheme: dark;
}
.theme { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.theme button { background: none; border: 0; padding: 3px 10px; font: inherit; font-size: 12px; color: var(--muted); cursor: pointer; }
.theme button[aria-pressed="true"] { background: var(--neutral-bg); color: var(--text); font-weight: 600; }
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
header { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
.hbar { display: flex; align-items: center; gap: 14px; padding: 10px 20px 4px; flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
header h1 span { color: var(--accent); }
.org { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.org select { padding: 3px 6px; font-size: 13px; }
nav { display: flex; gap: 2px; flex-wrap: wrap; align-items: center; padding: 0 14px 6px; }
nav button { background: none; border: 0; padding: 6px 12px; border-radius: 6px; color: var(--muted); font: inherit; cursor: pointer; }
nav button[aria-current="page"] { background: var(--neutral-bg); color: var(--text); font-weight: 600; }
nav .sep { flex: 1; min-width: 12px; }
nav .minor button { font-size: 13px; padding: 6px 9px; }
.count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; text-align: center; }
.who { margin-left: auto; color: var(--muted); font-size: 12px; }
.update-btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 4px 12px; margin-right: 8px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
.update-btn:hover { filter: brightness(1.08); }
.update-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
dialog.gctk-update { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); max-width: min(520px, calc(100vw - 32px)); padding: 20px; }
dialog.gctk-update::backdrop { background: rgba(0, 0, 0, 0.35); }
dialog.gctk-update ol { padding-left: 20px; margin: 8px 0; } dialog.gctk-update li { margin: 4px 0; }
main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
h2 { font-size: 18px; margin: 8px 0 12px; }
h3 { font-size: 15px; margin: 18px 0 8px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
.muted { color: var(--muted); }
a { color: var(--info); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; background: var(--neutral-bg); }
.t-production, .r-high, .s-rejected, .s-failed, .s-stale { background: var(--bad-bg); color: var(--bad); }
.t-test, .r-medium, .s-pending { background: var(--warn-bg); color: var(--warn); }
.t-dev, .s-approved { background: var(--info-bg); color: var(--info); }
.r-low, .s-applied, .a-granted { background: var(--ok-bg); color: var(--ok); }
.a-missing { background: var(--bad-bg); color: var(--bad); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
td.v { font-family: var(--mono); font-size: 12px; word-break: break-word; max-width: 380px; }
.d-added td:first-child::before { content: "+ "; color: var(--ok); font-weight: 700; }
.d-removed td:first-child::before { content: "− "; color: var(--bad); font-weight: 700; }
.d-changed td:first-child::before { content: "~ "; color: var(--warn); font-weight: 700; }
.warn { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; margin: 10px 0; }
.warn li { margin: 2px 0; }
.error { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 8px 12px; margin: 10px 0; white-space: pre-wrap; }
.okbox { background: var(--ok-bg); color: var(--ok); border-radius: 8px; padding: 8px 12px; margin: 10px 0; }
button.btn { font: inherit; padding: 6px 14px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
button.btn:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: not-allowed; }
input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; }
textarea { width: 100%; min-height: 80px; font-family: var(--mono); font-size: 12.5px; }
label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
details summary { cursor: pointer; color: var(--muted); margin: 8px 0; }
pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow: auto; max-height: 360px; font-size: 12px; }
.empty { text-align: center; padding: 30px; color: var(--muted); }
main.wide { max-width: 1500px; padding-bottom: 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; margin-bottom: 14px; }
.cards .panel { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.lead { font-size: 15px; color: var(--muted); margin: 0 0 16px; max-width: 820px; }
.kv { display: grid; grid-template-columns: minmax(90px, 38%) minmax(0, 1fr); gap: 2px 10px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
[hidden] { display: none !important; }
/* ---- Monitoring: one card per object kind, count against the org's limit. */
.mon { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-bottom: 8px; }
.mon > div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.mon .n { font-size: 22px; font-weight: 700; line-height: 1.2; }
.mon .n small { font-size: 13px; font-weight: 400; color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--neutral-bg); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); }
.m-warn .meter i { background: var(--warn); }
.m-alert .meter i { background: var(--bad); }
.mon > .m-alert { border-color: var(--bad); }
.mon > .m-error .n { color: var(--muted); }
.ws-opts { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.ws-opt { display: flex; gap: 8px; align-items: flex-start; text-align: left; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; cursor: pointer; }
.ws-opt:hover { border-color: var(--muted); }
.ws-opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.ws-opt .mark { flex: none; width: 16px; height: 16px; margin-top: 2px; border: 2px solid var(--muted); border-radius: 50%; }
.ws-opt.multi .mark { border-radius: 4px; }
.ws-opt[aria-pressed="true"] .mark { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 2px var(--bg); }
.ws-opt small { display: block; color: var(--muted); font-size: 12px; }
.srv { border-top: 1px solid var(--line); }
.srv > summary { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; list-style: none; cursor: pointer; padding: 8px 4px; margin: 0; color: var(--text); }
.srv > summary::-webkit-details-marker { display: none; }
.srv > summary::before { content: "▸"; color: var(--muted); width: 12px; }
.srv[open] > summary::before { content: "▾"; }
.srv > summary:hover { background: var(--neutral-bg); border-radius: 6px; }
.srv .body { padding: 0 4px 12px 24px; display: grid; gap: 8px; }
.grp-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.sub-head { font-size: 12px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); margin: 4px 0 2px; }
.sub-head .mono { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 11px; }
.skill-group > summary { margin: 8px 0 2px; }
.todo-group { border-top: 1px solid var(--line); padding: 10px 0; }
.todo-group:first-of-type { border-top: 0; padding-top: 0; }
.todo-group > summary { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0; color: var(--text); }
.todo-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 0; }
.skill-row { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 5px 4px; border-top: 1px solid var(--line); font-size: 13px; }
.creds > summary { color: var(--info); margin: 0; }
.twin { padding: 4px 0 8px; }
.twin .todo-row { flex-wrap: nowrap; }
.twin-path { flex: 1; min-width: 0; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.twin + .twin { border-top: 1px dashed var(--line); padding-top: 8px; }
.skill-row > .row { justify-content: flex-end; }
.prereqs { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 10px; align-items: baseline; }
.keybox { margin-top: 10px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 8px; background: var(--bg); }
.chat { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
.dtabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin: 0 0 14px; }
.dtabs button { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 8px 14px; font: inherit; color: var(--muted); cursor: pointer; }
.dtabs button[aria-selected="true"] { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
.dtabs button:disabled { cursor: default; opacity: .55; }
.dtabs small { font-size: 10px; margin-left: 4px; text-transform: uppercase; letter-spacing: .04em; }
.dblock { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 12px 0; }
.dblock.live { border-left: 4px solid var(--ok); }
.dblock.setup { border-left: 4px solid var(--accent); }
.dblock-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.dblock-head strong { font-size: 15px; }
.dstep { display: flex; align-items: baseline; gap: 10px; margin: 22px 0 10px; }
.dstep b { flex: none; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 13px; }
.dstep h3 { margin: 0; font-size: 17px; }
.dcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.dcard { display: flex; flex-direction: column; gap: 6px; text-align: left; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
.dcard:hover { border-color: var(--muted); }
.dcard[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.dcard strong { font-size: 15px; }
.dcard .what { color: var(--muted); font-size: 13px; }
.dcard .st { margin-top: auto; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.dcard .st::before { content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.dcard .st.ok { color: var(--ok); } .dcard .st.ok::before { background: var(--ok); }
.dcard .st.todo { color: var(--warn); } .dcard .st.todo::before { background: var(--warn); }
.dcard .st.bad { color: var(--bad); } .dcard .st.bad::before { background: var(--bad); }
.dblock input, .dblock select, .dblock textarea, .panel select { max-width: 100%; box-sizing: border-box; }
.dtools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
/* ---- Shared look: page heads, icons, chips, tiles, explainers. */
:root { --accent-soft: color-mix(in srgb, var(--accent) 11%, var(--panel)); --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .04); }
header { box-shadow: 0 1px 0 var(--line); border-bottom: 0; }
header h1 { display: flex; align-items: center; gap: 8px; }
.logo-mark { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), #ff9a3d); color: #fff; font-size: 14px; font-weight: 800; }
nav { gap: 4px; padding: 2px 14px 8px; }
nav button { border-radius: 999px; padding: 6px 14px; }
nav button:hover { color: var(--text); background: var(--neutral-bg); }
nav button[aria-current="page"] { background: var(--text); color: var(--panel); }
.panel { border-radius: 12px; box-shadow: var(--shadow); }
.page-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin: 6px 0 20px; }
.page-head h2 { font-size: 26px; margin: 0; letter-spacing: -.015em; }
.page-head p { margin: 4px 0 0; color: var(--muted); font-size: 15px; max-width: 760px; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -4px; }
.btn .ic { width: 16px; height: 16px; margin-right: 4px; vertical-align: -3px; }
button.sm { padding: 3px 10px; font-size: 12.5px; }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--info); cursor: pointer; }
.linkbtn:hover { text-decoration: underline; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 13px; white-space: nowrap; color: var(--text); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.chip.tier-production .dot { background: var(--bad); } .chip.tier-test .dot { background: var(--warn); }
.chip.tier-dev .dot { background: var(--info); } .chip.tier-sandbox .dot { background: var(--ok); }
.chip.none { color: var(--muted); border-style: dashed; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin: 26px 0 10px; display: flex; align-items: center; gap: 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 14px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); display: grid; gap: 2px; }
.tile .lbl { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; font-weight: 600; }
.tile .n { font-size: 24px; font-weight: 750; line-height: 1.2; }
.tile small { color: var(--muted); font-size: 12.5px; }
.tile.bad { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); } .tile.bad .n { color: var(--bad); }
.tile.good .n { color: var(--ok); }
.explain { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.explain > div { display: flex; gap: 12px; align-items: flex-start; }
.bubble { flex: none; display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); }
.bubble .ic { width: 22px; height: 22px; }
.explain strong { display: block; margin-bottom: 2px; }
.explain span { color: var(--muted); font-size: 13.5px; }
.intro { background: linear-gradient(120deg, var(--accent-soft), var(--panel) 65%); }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.card-grid > .panel { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.card-foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status.ok { color: var(--ok); } .status.ok::before { background: var(--ok); }
.status.todo { color: var(--warn); } .status.todo::before { background: var(--warn); }
.status.bad { color: var(--bad); } .status.bad::before { background: var(--bad); }
.status.off { color: var(--muted); }
/* ---- AI Coding Tools: app → server → org. */
.apps { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 14px; }
.apps > .panel { margin: 0; }
.app-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.app-head .bubble { width: 36px; height: 36px; border-radius: 10px; }
.app-head strong { font-size: 17px; }
.conn { display: grid; grid-template-columns: minmax(130px, 1fr) 18px minmax(130px, 1fr) auto; gap: 8px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.conn .arrow { color: var(--muted); }
.conn .tool strong { display: block; font-size: 14px; }
.conn .tool small { color: var(--muted); font-size: 12px; }
.conn .end { display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.conn select { font-size: 12px; padding: 2px 6px; max-width: 170px; }
.sub-block { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { background: none; border: 0; padding: 5px 12px; font: inherit; font-size: 13px; color: var(--muted); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--neutral-bg); color: var(--text); font-weight: 600; }
.section-title .seg { text-transform: none; letter-spacing: 0; font-weight: 400; }
.more > summary { list-style: none; display: flex; align-items: center; gap: 8px; margin: 0; color: var(--text); }
.more > summary::-webkit-details-marker { display: none; }
.more > summary::after { content: "▸"; margin-left: auto; color: var(--muted); }
.more[open] > summary::after { content: "▾"; }
/* ---- Demo ready: pick what to add. */
.pick { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel); display: grid; gap: 6px; transition: border-color .12s, box-shadow .12s; }
.pick:has(.use:checked) { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); box-shadow: inset 3px 0 0 var(--accent); }
.pick:not(:has(.use:checked)) > :not(.pick-head) { opacity: .5; }
.pick-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pick-head .use { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.pick-title { flex: 1; min-width: 200px; font-weight: 600; border-color: transparent; background: transparent; padding-left: 4px; }
.pick-title:hover, .pick-title:focus { border-color: var(--line); background: var(--bg); }
.pick-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); padding-left: 28px; }
.pick-meta > label { display: inline-flex; flex-direction: row; align-items: center; gap: 6px; }
.pick-body { padding-left: 28px; }
.picks { display: grid; gap: 8px; }
.pick-head .linkbtn { color: var(--muted); display: inline-grid; place-items: center; }
.pick-head .linkbtn:hover { color: var(--bad); }
.dcard .bubble .ic { width: 16px; height: 16px; }

<body>
<header>
  <div class="hbar">
    <h1><b class="logo-mark" aria-hidden="true">g</b><span>gctk</span> Genesys Cloud Toolkit</h1>
    <div class="org" id="org"></div>
    <div class="who" id="who"></div>
    <div class="theme" id="theme" role="group" aria-label="Colour theme"></div>
  </div>
  <nav id="nav" aria-label="Pages"></nav>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<script nonce="__NONCE__">
"use strict";
// Colour theme: follows the system until the user picks light or dark in the top bar (remembered
// in this browser). Set before the first render so the page does not flash.
const THEME_KEY = "gctk-theme";
function currentTheme() {
  const t = document.documentElement.dataset.theme;
  return t === "light" || t === "dark" ? t : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(THEME_KEY, t); } catch {}
  renderThemeToggle();
}
function renderThemeToggle() {
  const box = document.getElementById("theme");
  const now = currentTheme();
  box.replaceChildren(...[["light", "☀ Light"], ["dark", "☾ Dark"]].map(([t, label]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.setAttribute("aria-pressed", String(now === t));
    b.addEventListener("click", () => setTheme(t));
    return b;
  }));
}
(() => {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch {}
  if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
  renderThemeToggle();
  // Without an explicit choice, follow system changes live.
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!document.documentElement.dataset.theme) renderThemeToggle(); });
})();
// Token arrives in the URL fragment and leaves the address bar right away. This browser keeps it for
// this address (the UI keeps its port and token), so a bookmark of the plain address opens the UI.
const TOKEN = (() => {
  const m = location.hash.match(/token=([\w-]+)/);
  if (m) {
    const view = location.hash.match(/view=([\w-]+)/);
    const demo = location.hash.match(/[#&]demo=([\w-]+)/);
    try {
      sessionStorage.setItem("gctk-token", m[1]);
      localStorage.setItem("gctk-token", m[1]);
      if (view) sessionStorage.setItem("gctk-view", view[1]);
      if (demo) sessionStorage.setItem("gctk-open-demo", demo[1]);
    } catch {}
    history.replaceState(null, "", "/");
    return m[1];
  }
  try { return sessionStorage.getItem("gctk-token") || localStorage.getItem("gctk-token") || ""; } catch { return ""; }
})();
const STALE_LINK = "This browser's link to gctk is out of date. Ask the AI to open the gctk UI, or run `gctk ui` in a terminal: this address then works again.";

async function api(path, opts = {}) {
  const method = opts.method || "GET";
  // Every write is JSON (the server refuses anything else, which also stops cross-site form posts).
  const body = method === "GET" ? undefined : JSON.stringify(opts.body ?? {});
  const res = await fetch(path, {
    method,
    headers: { "x-gctk-token": TOKEN, ...(body ? { "content-type": "application/json" } : {}) },
    body,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) {
    try { localStorage.removeItem("gctk-token"); sessionStorage.removeItem("gctk-token"); } catch {}
    throw new Error(STALE_LINK);
  }
  if (!res.ok) throw Object.assign(new Error(data.error || `HTTP ${res.status}`), { code: data.code });
  return data;
}

// DOM builder: all dynamic content goes through text nodes, never parsed as HTML.
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : String(v));
  }
  for (const c of children.flat(Infinity)) {
    if (c === undefined || c === null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
const pill = (text, cls) => h("span", { class: `pill ${cls || ""}` }, text);
const fmt = (v) => v === undefined ? "" : (typeof v === "string" ? JSON.stringify(v) : JSON.stringify(v, null, 0));
const short = (s, n = 160) => (s = fmt(s), s.length > n ? s.slice(0, n - 1) + "…" : s);
const time = (iso) => iso ? new Date(iso).toLocaleString() : "";

const state = { view: (() => { try { return sessionStorage.getItem("gctk-view") || "profiles"; } catch { return "profiles"; } })(), overview: null, profile: null };
// Main pages follow a solution consultant's demo prep; setup and control pages sit on the right.
// The ids are the page names the agent opens with gc_ui (UI_PAGES), so they stay as they are.
const VIEWS = [
  ["profiles", "Orgs", "Your Genesys Cloud orgs, their credentials and rules"],
  ["ai-setup", "AI Coding Tools", "Cursor and the Claude app: which MCP servers they load and which org each one works on"],
  ["axl", "Projects", "Folders you build demos in with the AI in Cursor, each with its own org; AXL workshops too"],
  ["demos", "Demos", "Deploy a whole demo into an org with one button, and start what it needs on this computer"],
  ["site", "Website", "A customer website for the industry, in the customer's brand, with your Messenger on it"],
  ["demo", "Demo ready", "Fill the agent's home screen with demo data: coaching, learning, evaluations, scorecard, schedule"],
  ["partner", "Partner", "Enablement Radar: your partners' survey answers on how demo-ready their orgs are, partner by partner"],
];
const MINOR_VIEWS = [
  ["pricing", "Pricing", "Genesys Cloud licences, AI tokens and prices explained with sources, a calculator, and an org's live billing broken down"],
  ["monitoring", "Monitoring", "How many queues, flows, data actions … an org has, next to its limits"],
  ["data", "Your data", "Where gctk keeps your orgs, settings and records on this computer"],
];

function renderNav() {
  const nav = document.getElementById("nav");
  const btn = ([id, label, title]) => h("button", { "aria-current": state.view === id ? "page" : null, title, onclick: () => go(id) }, label);
  nav.replaceChildren(...VIEWS.map(btn), h("span", { class: "sep" }), h("span", { class: "minor", style: "display:contents" }, MINOR_VIEWS.map(btn)));
  const o = state.overview;
  const v = state.gctkVersion;
  document.getElementById("who").replaceChildren(
    v?.update ? h("button", { class: "update-btn", title: `You have gctk ${v.running}; ${v.latest} is out.`, onclick: () => gctkUpdateDialog(v) }, `Update gctk to ${v.latest}`) : "",
    o ? `${o.user} · gctk ${o.version}` : "",
    o?.persistent ? h("button", { class: "btn", style: "padding:2px 8px;font-size:12px;margin-left:8px", title: "Stops the background UI; the AI or `gctk ui` starts it again", onclick: stopUi }, "Stop UI") : "");
  renderOrg();
}

/** The org the AI works on by default (in Cursor or Claude Code), switchable in the top bar. */
function renderOrg() {
  const box = document.getElementById("org");
  const o = state.overview;
  if (!o) return box.replaceChildren();
  const usable = o.profiles.filter((p) => !p.error);
  if (!usable.length) return box.replaceChildren(h("button", { class: "btn primary", style: "padding:3px 10px;font-size:12px", onclick: () => go("profiles") }, "Connect an org"));
  const active = usable.find((p) => p.name === o.activeProfile);
  const sel = h("select", { title: "The org the AI works on unless you name another one.", "aria-label": "Org the AI works on" },
    active ? null : h("option", { value: "" }, "choose…"),
    usable.map((p) => h("option", { value: p.name, selected: p.name === o.activeProfile }, `${p.name} · ${p.tier}${p.credentialsStored ? "" : " · no credentials"}`)));
  sel.addEventListener("change", async () => {
    const next = usable.find((p) => p.name === sel.value);
    if (!next) return;
    if (next.tier === "production" && !confirm(`Work on the production org "${next.name}" by default?`)) { sel.value = o.activeProfile || ""; return; }
    try {
      await api(`/api/profiles/${encodeURIComponent(next.name)}/activate`, { method: "POST", body: {} });
      state.profile = next.name;
      await refreshOverview();
      await render();
    } catch (err) { sel.value = o.activeProfile || ""; showError(err); }
  });
  box.replaceChildren(...[h("span", {}, "Working on"), sel, active ? pill(active.tier, `t-${active.tier}`) : null].filter(Boolean));
}

/** How to get the newer gctk depends on how this one was installed; npx is the one gctk updates itself. */
function gctkUpdateDialog(v) {
  const reopen = "Then ask the AI to open the gctk UI: the new version replaces this one.";
  const steps = {
    npx: null,
    "claude-plugin": ["In Claude Code, type /plugin and update the genesys-cloud-toolkit marketplace (or its plugin).", "Restart Claude Code.", reopen],
    "cursor-plugin": ["Quit Cursor and open it again; it updates its plugins at the start. If it still runs the old version, update the gctk plugin in Cursor's settings (Plugins).", reopen],
  }[v.install] || ["Update gctk where you installed it (the plugin in Cursor or Claude Code), then restart that editor.", reopen];
  const out = h("div");
  const close = h("button", { class: "btn" }, "Close");
  const run = h("button", { class: "btn primary" }, "Update gctk");
  run.addEventListener("click", async () => {
    run.disabled = true; run.textContent = "Updating…";
    try {
      const r = await api("/api/gctk-version/update", { method: "POST", body: {} });
      run.remove();
      put(out, h("div", { class: "okbox" }, `Done. ${r.next}`));
      state.gctkVersion = null;
    } catch (err) { put(out, h("div", { class: "error" }, err.message)); run.disabled = false; run.textContent = "Update gctk"; }
  });
  const dlg = h("dialog", { class: "gctk-update", "aria-labelledby": "gctk-update-title" },
    h("h3", { id: "gctk-update-title", style: "margin-top:0" }, `gctk ${v.latest} is out`),
    h("p", { class: "muted", style: "margin:0 0 8px" }, `You have ${v.running}. Updating keeps your orgs, projects and settings.`),
    steps ? h("ol", {}, steps.map((x) => h("li", {}, x))) : h("p", {}, "gctk deletes the copy Cursor downloaded; Cursor downloads the newest at its next start."),
    out,
    h("div", { class: "row", style: "margin-top:12px;justify-content:flex-end" }, steps ? null : run, close));
  close.addEventListener("click", () => dlg.close());
  dlg.addEventListener("close", () => { dlg.remove(); renderNav(); });
  document.body.append(dlg);
  dlg.showModal();
}

async function refreshOverview() {
  if (state.gctkVersion === undefined) {
    // Asked once per page load (the server asks GitHub at most once an hour).
    state.gctkVersion = null;
    api("/api/gctk-version").then((v) => { state.gctkVersion = v; renderNav(); }).catch(() => {});
  }
  state.overview = await api("/api/overview");
  if (!state.profile) state.profile = state.overview.activeProfile || state.overview.profiles[0]?.name || null;
  renderNav();
}

/** Page ids that moved: the Claude app page is part of AI Coding Tools now. */
function pageAlias(view) {
  if (view === "claude-app") { state.aiFocus = "claude-desktop"; return "ai-setup"; }
  return view;
}
function go(view) {
  state.view = view = pageAlias(view);
  try { sessionStorage.setItem("gctk-view", view); } catch {}
  render();
}
const main = () => document.getElementById("main");
async function stopUi() {
  if (!confirm("Stop the gctk UI? The AI can open it again any time.")) return;
  try { await api("/api/shutdown", { method: "POST", body: {} }); main().replaceChildren(h("div", { class: "panel empty" }, "The gctk UI was stopped. Ask the AI to open it again, or run `gctk ui`.")); }
  catch (err) { showError(err); }
}
function showError(err) { main().prepend(h("div", { class: "error" }, err.message || String(err))); }

async function render() {
  renderNav();
  state.cleanup?.();
  state.cleanup = null;
  const view = { site: viewSite, "ai-setup": viewAiSetup, demos: viewDemos, data: viewData, demo: viewDemo, axl: viewAxl, partner: viewPartner, pricing: viewPricing, monitoring: viewMonitoring, profiles: viewProfiles }[state.view] || viewProfiles;
  try { main().replaceChildren(await view()); } catch (err) { main().replaceChildren(h("div", { class: "error" }, err.message)); }
}

// ----------------------------------------------------------------- home
function copyButton(text) {
  const btn = h("button", { class: "btn", style: "padding:2px 10px;font-size:12px" }, "Copy");
  btn.addEventListener("click", () => { try { navigator.clipboard.writeText(text); btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy"), 1200); } catch {} });
  return btn;
}
const navLink = (view, text) => h("a", { href: "#", onclick: (e) => { e.preventDefault(); go(view); } }, text);

// Stroke icons (24×24), built as SVG elements: never parsed from markup.
const ICON_PATHS = {
  plus: ["M12 5v14M5 12h14"],
  folder: ["M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"],
  org: ["M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16", "M16 9h3a1 1 0 0 1 1 1v11", "M8 7h4M8 11h4M8 15h4M3 21h18"],
  tool: ["M14.7 6.3a4 4 0 0 0 5 5L11 20a2.1 2.1 0 0 1-3-3l8.7-8.7", "M14.7 6.3 17 4"],
  arrow: ["M5 12h14M13 6l6 6-6 6"],
  check: ["M5 12l5 5L20 7"],
  key: ["M15 7a4 4 0 1 1-3.9 4.9L4 19v2h3v-2h2v-2h2l1.1-1.1"],
  code: ["M8 8l-4 4 4 4M16 8l4 4-4 4M13 5l-2 14"],
  chat: ["M4 5h16v11H9l-5 4z"],
  globe: ["M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z", "M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"],
  play: ["M7 4l13 8-13 8z"],
  refresh: ["M20 11a8 8 0 1 0-2.3 5.7", "M20 5v6h-6"],
  alert: ["M12 3l10 18H2z", "M12 10v5M12 18h.01"],
  spark: ["M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"],
  calendar: ["M4 6h16v14H4z", "M4 10h16M9 3v4M15 3v4"],
  eye: ["M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z", "M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"],
  layers: ["M12 3l9 5-9 5-9-5z", "M3 13l9 5 9-5"],
  cursor: ["M5 3l14 8-6 2-2 6z"],
  claude: ["M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"],
  trash: ["M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"],

function icon(name) {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("class", "ic");
  svg.setAttribute("aria-hidden", "true");
  for (const d of ICON_PATHS[name] || ICON_PATHS.spark) { const p = document.createElementNS(ns, "path"); p.setAttribute("d", d); svg.append(p); }
  return svg;
}
/** Title, one short line under it, and the page's buttons on the right. */
const pageHead = (title, sub, ...actions) => h("div", { class: "page-head" },
  h("div", {}, h("h2", {}, title), sub ? h("p", {}, sub) : null),
  actions.filter(Boolean).length ? h("div", { class: "actions" }, actions) : null);
/** An org as a chip, coloured by its tier; null shows the fallback text. */
function orgChip(name, fallback = "no org") {
  if (!name) return h("span", { class: "chip none" }, fallback);
  const tier = state.overview?.profiles.find((p) => p.name === name)?.tier;
  return h("span", { class: `chip tier-${tier || "unknown"}`, title: tier ? `${name} · ${tier}` : name }, h("span", { class: "dot" }), name);
}
const tile = (label, n, sub, cls = "") => h("div", { class: `tile ${cls}` }, h("span", { class: "lbl" }, label), h("span", { class: "n" }, n), sub ? h("small", {}, sub) : null);

// -------------------------------------------------------------- website
// The customer's side of the demo: a fake website on its own origin (site.gctk.localhost) with the
// org's Web Messenger. Choices are remembered in this browser.
const SITE_KEY = "gctk-site";

const DEMO_KEY = "gctk-demo-pick";
/** replaceChildren that skips empty parts and flattens lists (DOM would print null and arrays as text). */
const put = (el, ...kids) => el.replaceChildren(...kids.flat(Infinity).filter((k) => k !== null && k !== undefined && k !== false));
function demoPick() {
  if (state.demoPick) return state.demoPick;
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(DEMO_KEY) || "{}") || {}; } catch {}
  return (state.demoPick = { profile: saved.profile || "", userId: saved.userId || "", userName: saved.userName || "" });
}
function saveDemoPick() { try { localStorage.setItem(DEMO_KEY, JSON.stringify(state.demoPick)); } catch {} }

/** The n-th working day from today at a local time, for template dates. */
function workday(offset, time) {
  const d = new Date();
  for (let n = 0; n < offset;) { d.setDate(d.getDate() + 1); if (d.getDay() !== 0 && d.getDay() !== 6) n++; }
  const [hh, mm] = time.split(":").map(Number);
  d.setHours(hh, mm, 0, 0);
  return d;
}
const localInput = (d) => { const p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };

async function demoUsers(profile) {
  state.demoUsers ??= {};
  return (state.demoUsers[profile] ??= api(`/api/demo/users?profile=${encodeURIComponent(profile)}`).catch((err) => { delete state.demoUsers[profile]; throw err; }));
}

/** Result of a run: what was applied, notes. */
function demoResult(r, onRetry) {
  const failed = r.applied.filter((a) => a.status !== "applied");
  return h("div", {},
    r.applied.length ? h("ul", { style: "margin:8px 0;padding-left:20px" }, r.applied.map((a) =>
      h("li", {}, a.status === "applied" ? "✓ " : "✗ ", a.title.replace(/^Demo ready \([^)]*\): /, ""), a.error ? h("div", { class: "error", style: "margin:4px 0" }, a.error) : null))) : null,
    r.busy && onRetry ? h("div", { class: "warn row" }, h("span", { style: "flex:1" }, "Genesys Cloud is still working on the last step. Continue in a minute to do the rest."),
      h("button", { class: "btn primary", onclick: onRetry }, "Continue")) : null,
    r.notes.map((n) => h("div", { class: "muted", style: "font-size:13px" }, n)),
    r.done && !failed.length ? h("div", { class: "okbox" }, r.applied.length ? "Done. The agent sees the changes on the Genesys Cloud home screen (reload it there)." : "Nothing to change: everything is already there.") : null);
}

/** run(input, button): runs a section and shows the result in out. */
function demoRunner(section, base, out, reload) {
  let last = null;
  const run = async (input, btn) => {
    if (input) last = input;
    if (!last) return;
    if (btn) btn.disabled = true;
    out.replaceChildren(h("div", { class: "muted" }, "Working…"));
    try {
      const r = await api(`/api/demo/${section}/run`, { method: "POST", body: { ...base, input: last } });
      out.replaceChildren(demoResult(r, () => run(last)));
      reload();
      state.demoChanged?.();
    } catch (err) { out.replaceChildren(h("div", { class: "error" }, err.message)); }
    if (btn) btn.disabled = false;
  };
  return run;
}

/** Sticky bar under a list of .pick cards: how many are ticked, and the button that creates them. */
function selBar(scope, noun, ...actions) {
  const n = h("span", { class: "n" });
  // The bar may sit inside scope: writing the same text again would trigger the observer forever.
  const sync = () => {
    const k = scope.querySelectorAll(".use:checked").length;
    const text = k ? `${k} ${noun}${k === 1 ? "" : "s"} selected` : `Tick the ${noun}s you want`;
    if (n.textContent !== text) n.textContent = text;
  };
  scope.addEventListener("change", sync);
  new MutationObserver(sync).observe(scope, { childList: true, subtree: true });
  sync();
  return h("div", { class: "selbar" }, icon("check"), n, h("span", { class: "spacer" }), ...actions);
}

/** One line per area for the overview cards: [state, text]; state ok (done), todo or bad. */
const DEMO_STATUS = {
  coaching: (s) => {
    const upcoming = s.appointments.filter((a) => Date.parse(a.dateStart) >= Date.now() && a.status !== "Completed").length;
    return upcoming ? ["ok", `${upcoming} upcoming appointment${upcoming > 1 ? "s" : ""}`] : s.appointments.length ? ["todo", "Only past appointments"] : ["todo", "No appointments yet"];
  },
  learning: (s) => s.assignments.length ? ["ok", `${s.assignments.length} module${s.assignments.length > 1 ? "s" : ""} assigned`] : ["todo", "Nothing assigned yet"],
  sta: (s) => {
    const q = s.agentQueues.find((id) => s.queuePrograms[id]);
    if (q && s.settings.text) return ["ok", `${s.queues.find((x) => x.id === q)?.name || "Queue"} is analysed`];
    return s.agentQueues.length ? ["todo", "Not set up yet"] : ["todo", "The agent is in no queue yet"];
  },
  evaluations: (s) => {
    const evals = Array.isArray(s.evaluations) ? s.evaluations : [];
    const convs = Array.isArray(s.conversations) ? s.conversations : [];
    if (evals.length) return ["ok", `${evals.length} evaluation${evals.length > 1 ? "s" : ""}`];
    return convs.length ? ["todo", `Not set up yet · ${convs.length} conversation${convs.length > 1 ? "s" : ""} to evaluate`] : ["bad", "Needs handled conversations first"];
  },
  scorecard: (s) => {
    const p = s.gamification.active && s.profiles.find((x) => x.id === s.currentProfile);
    return p ? ["ok", `In profile ${p.name}`] : ["todo", s.gamification.active ? "The agent is in no profile yet" : "Not set up yet"];
  },
  schedule: (s) => s.current && s.schedules.some((x) => x.published) ? ["ok", "Published schedule"] : ["todo", "No schedule yet"],
};

function demoCoaching(prof, pick, users) {
  const templates = state.demoMeta.coachingTemplates;
  const nameOf = (id) => users.find((u) => u.id === id)?.name || "";
  const list = h("div", {}, h("div", { class: "muted" }, "Loading appointments…"));
  const out = h("div");
  const base = { profile: pick.profile, userId: pick.userId, agentName: pick.userName };

  const facilitator = h("select", {}, h("option", { value: "" }, "No facilitator"),
    users.filter((u) => u.id !== pick.userId).map((u) => h("option", { value: u.id }, u.name)));
  const rows = h("div", { class: "picks" });
  const addRow = (t) => {
    const r = {
      use: h("input", { type: "checkbox", class: "use", checked: true, title: "Include" }),
      name: h("input", { value: t.name, class: "pick-title", placeholder: "Name of the appointment" }),
      when: h("input", { type: "datetime-local", value: localInput(t.date) }),
      length: h("input", { type: "number", min: 5, max: 480, step: 5, value: t.lengthInMinutes, style: "width:72px", title: "Minutes" }),
      completed: h("input", { type: "checkbox", checked: Boolean(t.completed) }),
      description: h("input", { value: t.description, placeholder: "Description (optional)", style: "width:100%" }),
      state: h("span"),
    };
    const el = h("div", { class: "pick" },
      h("div", { class: "pick-head" }, r.use, r.name, r.state, removeBtn(() => el.remove(), "Remove this appointment")),
      h("div", { class: "pick-meta" },
        h("label", {}, icon("calendar"), r.when),
        h("label", {}, r.length, "min"),
        h("label", { title: "Created, then set to completed. Completed appointments cannot be deleted later." }, r.completed, "already happened")),
      h("div", { class: "pick-body" }, r.description));
    el.demo = r;
    for (const f of [r.name, r.when]) f.addEventListener("change", () => mark(r, false));
    rows.append(el);
    mark(r, true);
  };

  // Marks suggestions the agent already has (same name and start: nothing would be created).
  let known = null;
  const mark = (r, uncheck) => {
    if (!known) return;
    const at = new Date(r.when.value).getTime();
    const same = known.find((a) => a.name === r.name.value && Math.abs(Date.parse(a.dateStart) - at) < 60_000);
    const named = known.find((a) => a.name === r.name.value);
    if (same && uncheck) r.use.checked = false;
    r.state.replaceChildren(same ? pill("already in the org", "s-applied") : named ? h("span", { class: "muted", style: "font-size:12px" }, `same name on ${new Date(named.dateStart).toLocaleDateString()}`) : pill("new", ""));
  };
  for (const t of templates) addRow({ ...t, date: workday(t.workdayOffset, t.time) });

  const run = demoRunner("coaching", base, out, () => load());

  const createBtn = h("button", { class: "btn primary" }, "Add to the agent's calendar");
  createBtn.addEventListener("click", () => {
    const chosen = [...rows.children].map((el) => el.demo).filter((r) => r.use.checked);
    if (!chosen.length) { out.replaceChildren(h("div", { class: "error" }, "Choose at least one appointment.")); return; }
    if (chosen.some((r) => !r.when.value)) { out.replaceChildren(h("div", { class: "error" }, "Every appointment needs a start.")); return; }
    if (chosen.some((r) => r.completed.checked) && !confirm("Appointments marked completed cannot be deleted afterwards (Genesys Cloud keeps them). Continue?")) return;
    run({ appointments: chosen.map((r) => ({
      name: r.name.value, description: r.description.value, dateStart: new Date(r.when.value).toISOString(),
      lengthInMinutes: Number(r.length.value), completed: r.completed.checked, ...(facilitator.value ? { facilitatorId: facilitator.value } : {}),
    })) }, createBtn);
  });

  const load = async () => {
    try {
      const s = await api(`/api/demo/coaching/status?profile=${encodeURIComponent(pick.profile)}&userId=${encodeURIComponent(pick.userId)}`);
      const now = Date.now();
      const upcoming = s.appointments.filter((a) => Date.parse(a.dateStart) >= now && a.status !== "Completed").length;
      known = s.appointments;
      for (const el of rows.children) mark(el.demo, true);
      put(list, 
        h("div", { class: "row", style: "margin-bottom:6px" }, h("strong", {}, `${s.appointments.length} appointment${s.appointments.length === 1 ? "" : "s"}`),
          h("span", { class: "muted" }, `(last 60 and next 90 days; ${upcoming} upcoming)`)),
        !s.appointments.length ? h("div", { class: "muted" }, "The agent has no coaching appointments yet.") : null,
        s.appointments.length ? h("div", { style: "overflow-x:auto" }, h("table", {},
          h("tr", {}, ["When", "Appointment", "Length", "Facilitator", "Status", ""].map((t) => h("th", {}, t))),
          s.appointments.map((a) => h("tr", {},
            h("td", { style: "white-space:nowrap" }, time(a.dateStart)),
            h("td", {}, a.name),
            h("td", {}, a.lengthInMinutes ? `${a.lengthInMinutes} min` : ""),
            h("td", {}, nameOf(a.facilitatorId)),
            h("td", {}, pill(a.status || "?", a.status === "Completed" ? "s-applied" : a.isOverdue ? "s-failed" : "s-approved")),
            h("td", {}, a.status === "Scheduled" ? h("button", { class: "btn danger", style: "padding:2px 10px", onclick: (e) => {
              if (confirm(`Delete "${a.name}"?`)) run({ appointments: [], remove: [a.id] }, e.target);
            } }, "Delete") : null))))) : null);
    } catch (err) { put(list, h("div", { class: "error" }, err.message)); }
  };
  load();

  return h("div", { class: "panel" },
    h("p", { class: "muted", style: "margin-top:0" }, "Shown in the agent's calendar and Development view. Only future dates work."),
    demoBlock("live", `${pick.userName || "The agent"}'s appointments`, "", list),
    demoBlock("setup", "Add appointments", "Suggestions: edit, untick or add your own.",
      h("div", { class: "settings-row" }, h("label", { title: "The facilitator and the agent need the permission coaching:appointment:participate." }, "Facilitator (optional)", facilitator)),
      rows,
      h("div", { style: "margin-top:8px" }, addBtn("Appointment", () => addRow({ name: "Coaching session", description: "", lengthInMinutes: 30, date: workday(3, "13:00") }))),
      selBar(rows, "appointment", createBtn)),
    out);
}

const dateInput = (d) => localInput(d).slice(0, 10);
/** A due date from a date input: that day, 17:00 local time. */

function demoLearning(pick) {

    const r = {

            h("td", {}, pill(a.isOverdue ? "overdue" : a.state || "?", a.state === "Completed" ? "s-applied" : a.isOverdue ? "s-failed" : "s-approved")),
            h("td", {}, h("button", { class: "btn danger", style: "padding:2px 10px", onclick: (e) => {
              if (confirm(`Remove "${a.moduleName}" from the agent?`)) run({ assignments: [], remove: [a.id] }, e.target);
            } }, "Remove")))))) : null);

        r.el = h("div", { class: "pick" }, h("div", { class: "pick-head" }, r.use,
          h("span", { style: "flex:1;min-width:200px;font-weight:600" }, m.name,
            h("span", { class: "muted", style: "font-size:12px;font-weight:400" }, [m.source === "GenesysBeyond" ? " · Genesys Beyond" : "", m.lengthInMinutes ? ` · ${m.lengthInMinutes} min` : ""].join(""))),
          h("label", { class: "row", style: "font-size:12px" }, "Due", r.due)));
        return r;
      });
      filter.addEventListener("input", () => { const q = filter.value.trim().toLowerCase(); for (const r of orgRows) r.el.style.display = !q || r.name.toLowerCase().includes(q) ? "" : "none"; });
      const existingNames = new Set(s.modules.map((m) => m.name));

      const newBox = h("div", { class: "picks" }, newRows.map((r) => r.el));

        selBar(pickBox, "module", assignBtn));

  };

  const assignBtn = h("button", { class: "btn primary" }, "Assign to the agent");
  assignBtn.addEventListener("click", () => {
    const chosen = rows.filter((r) => r.use.checked);

  load();

  return h("div", { class: "panel" },
    h("p", { class: "muted", style: "margin-top:0" }, "Shown on the home screen and in the Development view. Only the agent can complete a module."),
    demoBlock("live", `${pick.userName || "The agent"}'s learning`, "", list),
    demoBlock("setup", "Assign modules", "", pickBox),
    out);
}

/** Where a project stands: workshops by their harness, projects by their folder's tools. */
function projectState(x) {
  const w = x.workshop, f = x.folder;
  if (isLabProject(w)) return axlHarnessState(x);
  if (!w.profile || !w.folder) return ["incomplete", "", "Choose an org and a folder."];
  if (x.org?.problem) return ["problem", "s-failed", x.org.problem];

  const started = Object.keys(x.toolStarts || {}).length || x.lastStart;

  const own = templates.filter((t) => t.catalog), found = templates.filter((t) => !t.catalog);
  const orgTier = state.overview?.profiles.find((p) => p.name === w.profile)?.tier;
  if (own.length) rows.push(group("Added by you", "From the list on the AI Coding Tools page. gctk starts each one with this project's org."));
  for (const t of own) {
    const has = stored.some((x) => x.name === t.name);
    const box = h("input", { type: "checkbox", checked: has ? true : null, style: "width:auto" });
    boxes.push([box, t.id]);
    const limit = t.tiers.length < 4 ? `${t.tiers.join(", ")} orgs only` : "";
    const barred = orgTier && !t.tiers.includes(orgTier) ? ` · not for this ${orgTier} org` : "";
    rows.push(line(box, toolTitle(t.name), [t.description, limit].filter(Boolean).join(" · ") + barred));
  }
  if (found.length) rows.push(group("From your AI Coding Tools", "Genesys MCP servers you already have in Cursor or the Claude app. gctk copies the program and settings into this folder and gives them this project's org."));
  for (const t of found) {
    const has = stored.some((x) => x.name === t.name);
    const box = h("input", { type: "checkbox", checked: has ? true : null, style: "width:auto" });
    boxes.push([box, t.id]);
    rows.push(line(box, toolTitle(t.name), `${t.name !== toolTitle(t.name) ? `${t.name} · ` : ""}copied from ${t.from.replace(/^\/Users\/[^/]+/, "~")}`));
  }
  for (const x of stored.filter((x) => !templates.some((t) => t.name === x.name))) {
    const box = h("input", { type: "checkbox", checked: true, style: "width:auto" });
    boxes.push([box, `keep:${x.name}`]);
    rows.push(line(box, toolTitle(x.name), "set up earlier; no longer in your AI Coding Tools"));
  }
  if (!templates.length && !stored.length) rows.push(h("div", { class: "muted", style: "font-size:13px" }, "None yet. Add one (for example Architect) under MCP Server available on ", navLink("ai-setup", "AI Coding Tools"), "."));
  return { el: h("div", { style: "display:grid;gap:8px" }, rows), read: () => ({ ...(lab ? {} : { harness: harness.checked }), tools: boxes.filter(([b]) => b.checked).map(([, id]) => id) }) };
}

/**
 * The two skills an AXL workshop needs next to the AVA harness, and an install from their zip files
 * (one skill per zip, as they are shared). gctk puts them into ~/.cursor/skills.
 */
function axlSkillsBox(skills, onInstalled) {
  const msg = h("div");
  const missing = skills.filter((s) => !s.path);
  const file = h("input", { type: "file", accept: ".zip,application/zip", multiple: true, hidden: true });
  const asBase64 = (f) => new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).replace(/^data:[^,]*,/, ""));
    r.onerror = () => reject(new Error(`Could not read ${f.name}.`));
    r.readAsDataURL(f);
  });
  file.addEventListener("change", async () => {
    const done = [];
    let status;
    put(msg, h("div", { class: "muted", style: "font-size:13px" }, "Installing…"));
    try {
      for (const f of file.files) {
        const r = await api("/api/axl/skills", { method: "POST", body: { zip: await asBase64(f) } });
        done.push(...r.installed);
        status = r.status;
      }
      put(msg, h("div", { class: "okbox" }, `Installed ${done.join(" and ")} in ~/.cursor/skills. Cursor picks them up in a new chat.`));
      onInstalled(status);
    } catch (err) { put(msg, h("div", { class: "error" }, err.message)); }
    file.value = "";
  });
  return h("div", { style: "display:grid;gap:8px" },
    skills.map((s) => h("div", { class: "conn", style: "grid-template-columns:minmax(0,1fr) auto;padding:6px 0" },
      h("div", { class: "tool" }, h("strong", {}, s.name), h("small", {}, s.path ? `${s.what} · ${s.path.replace(/^\/Users\/[^/]+/, "~")}${s.link ? " (a link)" : ""}` : s.what)),
      h("div", { class: "end" }, s.path ? pill("Installed", "s-applied") : pill("Missing", "s-failed")))),
    h("div", { class: "row" }, file,
      h("button", { class: `btn sm${missing.length ? " primary" : ""}`, onclick: () => file.click() }, icon("plus"), missing.length ? "Install from zip…" : "Update from zip…"),
      h("span", { class: "muted", style: "font-size:12.5px" }, missing.length ? `Choose the zip file${missing.length > 1 ? "s" : ""} you were given (${missing.map((s) => `${s.name}.zip`).join(", ")}).` : "Both are there. A newer zip replaces the skill; gctk keeps the old one in its home folder.")),
    msg);
}

function axlNew(st, draw) {
  const back = () => { state.axlOpen = null; draw(st); };
  let lab = false;
  const name = h("input", { placeholder: "e.g. Acme Bank", style: "min-width:260px", "aria-label": "Project name" });
  const folder = h("input", { placeholder: "~/Demos/Acme Bank", style: "flex:1;min-width:320px", "aria-label": "Project folder" });
  let folderTouched = false;
  folder.addEventListener("input", () => { folderTouched = true; });
  name.addEventListener("input", () => { if (!folderTouched) folder.value = name.value.trim() ? `~/${lab ? "AXL" : "Demos"}/${name.value.trim()}` : ""; });
  const orgBox = h("div");
  const toolsBox = h("div");
  const skillsBox = h("div");
  let org, picker;
  const drawSkills = () => put(skillsBox, lab ? h("div", { style: "margin-top:12px" },
    h("div", { class: "sub-head", style: "margin:0 0 4px" }, "Skills the workshop needs"),
    axlSkillsBox(st.skills || [], (next) => { if (next) st.skills = next.skills; drawSkills(); })) : null);
  const drawType = () => {
    drawSkills();
    org = projectOrgSelect(st, org?.value, lab);
    put(orgBox, h("label", {}, lab ? "The org the lab builds in (sandbox or dev)" : "The org the AI works on in this folder", org));
    picker = toolPicker({ lab: lab ? undefined : false, harness: false }, st);
    put(toolsBox, picker.el);
    if (!folderTouched && name.value.trim()) folder.value = `~/${lab ? "AXL" : "Demos"}/${name.value.trim()}`;
  };
  const kind = (value, title, sub) => h("button", { class: "ws-opt", "aria-pressed": String(lab === value), onclick: (e) => { lab = value; for (const b of e.currentTarget.parentElement.children) b.setAttribute("aria-pressed", String(b === e.currentTarget)); drawType(); } },
    h("span", { class: "mark" }), h("span", {}, h("strong", {}, title), h("small", {}, sub)));
  drawType();
  const create = async () => {
    const missing = lab ? (st.skills || []).filter((s) => !s.path) : [];
    if (missing.length) { showError(new Error(`An AXL workshop needs the skill${missing.length > 1 ? "s" : ""} ${missing.map((s) => s.name).join(" and ")}. Install ${missing.length > 1 ? "them" : "it"} from the zip under step 4 first.`)); return; }
    const c = confirmOrg(st, org.value);
    if (!c.ok) return;
    try {
      const r = await api("/api/axl/workshops", { method: "POST", body: { name: name.value, profile: org.value, folder: folder.value, lab, ...(c.confirmProduction ? { confirmProduction: true } : {}), ...picker.read() } });
      state.axlOpen = r.id;
      draw(r);
    } catch (err) { showError(err); }
  };
  const part = (n, title, ...body) => h("div", { class: "tl" }, h("span", { class: "tl-n" }, n), h("div", { class: "panel" }, h("div", { class: "tl-title" }, title), ...body));
  return h("div", {},
    h("p", {}, h("a", { href: "#", onclick: (e) => { e.preventDefault(); back(); } }, "← All projects")),
    pageHead("New project", "Four choices; gctk sets up the folder for you."),
    h("div", { class: "timeline" },
      part(1, "What kind of project?",
        h("div", { class: "grid", style: "grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px" },
          kind(false, "Demo project", "Build a demo with the AI, on any of your orgs."),
          kind(true, "AXL workshop", "AVA harness, the AXL skills, lab guide and sessions; sandbox or dev orgs only."))),
      part(2, "Name and folder",
        h("div", { class: "grid", style: "grid-template-columns:1fr;gap:10px" },
          h("label", {}, "Name, usually the customer", name),
          h("label", {}, "Folder you open in Cursor (created if missing)", folder))),
      part(3, "Org", orgBox),
      part(4, "MCP servers and skills", toolsBox,
        h("p", { class: "muted", style: "font-size:12.5px;margin:10px 0 0" }, "Each MCP server starts with this org's credentials from the keychain. No secret goes into the folder."),
        skillsBox)),
    h("div", { class: "row", style: "margin:16px 0 0 46px" }, h("button", { class: "btn primary", onclick: create }, "Create project"), h("button", { class: "btn", onclick: back }, "Cancel")));
}

// A condensed AXL Session Field Guide (2026-09-24): what to do in each step, the prompts to paste
// into the Cursor agent, and what comes out. `done` names the session artifact that shows the step
// is finished. Keep it in step with the field guide when that changes. The facilitator skill never
// loads by itself (disable-model-invocation), so every prompt that starts a job names it; follow-ups
// in the same chat do not.
const AXL_GUIDE = [
  { id: "before", title: "Before the session", when: "days before", done: "spec",
    todo: [
      "Log the session in Salesforce as soon as it is agreed: SE/SA Task, Activity Type \"Agentic Experience Lab\".",
      "Six gates green: CX Activate sandbox org (recording and Architect execution history on), SDD role, SDD OAuth client, coding agent ready (current wheel, axl-lab-facilitator and axl-capsule installed, model: latest Opus, medium effort), SMS/WhatsApp number if needed, the right people incl. an executive sponsor.",
      "Verify the org connection in this workshop folder, then have the agent read something back from the org.",
      "Run the research job in the Cursor agent you will keep for the whole engagement. Review the assumptions and the customer's language (45–60 min).",
      "Nothing gets pre-built in Genesys Cloud.",
    ],
    prompts: [
      { text: "Confirm which Genesys Cloud org you are connected to and show me its name and id.", note: "Check the org (in this workshop folder)" },
      { dynamic: "research", note: "Job 1: research – starts the agent you keep. Built from the form above." },
      { text: "Ignore the previous sessions in this workspace and follow the skill instructions for this customer from scratch.", note: "Follow-up, only if the workspace has earlier sessions" },
    ],
    out: "Spec artifact (spec-artifact.md, plus the version you present)" },
  { id: "frame", title: "1 · Frame & point of view", when: "0:00–0:20",
    todo: [
      "Set the stage (5 min): AXL Intro Slides, example artifacts to hand. Say that most of the middle is a coding agent working, and that something will break and you will fix it live.",
      "Reconfirm the six gates, present the spec artifact (intent, success criteria, tools), explain spec-driven building and the anatomy of an AVA.",
      "Decide: keep the use case (Path A, also with changes) or start from scratch (Path B).",
    ],
    out: "Expectations set, gates green, scope agreed" },
  { id: "discovery", title: "2 · Discovery", when: "0:20–1:00",
    todo: [
      "Path A: write the customer's changes in their words at the end of the spec artifact, read them back, get a yes.",
      "Path B: pick the option to build a new use case during discovery and author it live (costs ~45 min).",
      "Agree about four success criteria, the happy path and the escalation. One intent, voice-first, at most 6 tools.",
    ],
    prompts: [{ text: "/axl-lab-facilitator Let's continue with the <use case>", note: "Job 2: discovery on the chosen use case (Path B: pick the new use case option it offers)" }],
    out: "Agreed spec artifact and signed-off success criteria" },
  { id: "build", title: "3 · Create & test the AVA", when: "1:00–2:30", done: "run",
    todo: [
      "Hand the build over with the Job 3 prompt; it runs design, build, test, evaluate and critique (30–80 min). Stop it past 90 min and take the best version.",
      "Don't spectate: work Track 1 in this order – custom summary configuration, DID, inbound and bot flow (After Contact AI on, Deepgram Flux), escalation queue with your own user, wrap-up codes with descriptions, ElevenLabs voice, test end to end.",
      "Track 2 only when Track 1 is green, one topic (Copilot with knowledge in a second Cursor window, or AI scoring).",
    ],
    prompts: [
      { dynamic: "build", note: "Job 3: build and test, once the plan is confirmed. Test strategy from the form in \"Before the session\"." },
      { text: "Refine, retest and iterate until all tests are passed.", note: "Follow-up, if it stops on failing tests" },
    ],
    out: "Published AVA, run artifact (run-artifact.html), end-to-end path wired" },
  { id: "review", title: "4 · Review, test manually & refine", when: "2:30–3:10",
    todo: [
      "Walk the run artifact with the customer and agree the UAT shortlist from the success criteria.",
      "With four or more people, split into groups: happy path, guardrails, edge cases & escalation, voice & language quality. Log everything, 5-minute readback, one refine pass.",
    ],
    out: "Independently validated AVA and agreed follow-up fixes" },
  { id: "polish", title: "5 · Polish & dry-run", when: "3:10–3:40", done: "readout",
    todo: [
      "One clean rehearsal: real number → Architect → AVA → escalation with summary.",
      "Then generate the readout artifact (after the last refine) and read it through for overstated claims.",
    ],
    prompts: [{ text: "/axl-lab-facilitator The build is complete. Create the readout artifact for this session.", note: "Job 4: readout, after the last refine" }],
    out: "Showcase-ready AVA and the readout artifact (readout-artifact.html)" },
  { id: "showcase", title: "6 · Live showcase & readout", when: "3:40–4:00",
    todo: [
      "Open with the readout artifact. Show in order: self-service on a real call, seamless escalation, the custom summary and wrap-up code, the scorecard – each tied to a KPI.",
      "Close with commitment: what happens to the prototype, who owns it and by when, what would need to be true to go live.",
    ],
    out: "A committed next step with a named owner and a date" },
  { id: "after", title: "After the session", when: "same day",
    todo: [
      "Send the readout artifact as PDF (never the HTML) with the next steps at the top.",
      "Package with axl-capsule if the customer continues (always on Kiro Crew, before the instance expires).",
      "Rotate the SDD OAuth client's secret.",
    ],
    prompts: [{ text: "/axl-capsule Package this AXL session so the customer can continue it\nin <their coding agent>.", note: "Only runs when named; after the readout is final" }],
    out: "Capsule for the customer (if they continue), secret rotated" },

const AXL_BRIEF_DEFAULTS = { moreUseCases: 2, language: (navigator.language || "").startsWith("de") ? "de" : "en", functionPath: true, runsPerCase: 1, threshold: 80, afterThreshold: "decide", maxVersions: 5, parallel: 2 };

/** The research (Job 1) and build (Job 3) prompts from a workshop's brief, in the session language. */
function axlPrompts(w, brief) {
  const b = { ...AXL_BRIEF_DEFAULTS, customer: w.name, ...brief };
  const de = b.language === "de";
  const lines = [];
  const add = (text) => { if (text) lines.push(text); };
  const runs = b.runsPerCase === 1 ? (de ? "einmal" : "once") : (de ? `${b.runsPerCase}-mal` : `${b.runsPerCase} times`);
  const after = {
    decide: de ? "entscheide ich, ob wir weitermachen oder diese Lösung in die UATs übergeben" : "I decide whether we continue or hand this solution over to the UATs",
    uat: de ? "übergib die Lösung in die UATs" : "hand the solution over to the UATs",
    continue: de ? `iteriere weiter, bis alle Testcases bestanden sind, höchstens bis Version ${b.maxVersions}` : `keep iterating until all test cases pass, up to version ${b.maxVersions} at most`,
  }[b.afterThreshold];
  const testing = de
    ? `Das Testing soll später nach folgendem Ziel ablaufen: Nach dem Erstellen der Test Cases soll jeder Testcase pro Iteration ${runs} durchlaufen werden. Wenn mindestens ${b.threshold} % der Testcases bestanden sind, ${after}.`
    : `Testing later follows this goal: once the test cases are created, run each test case ${runs} per iteration. When at least ${b.threshold}% of the test cases pass, ${after}.`;
  const parallel = b.parallel > 1
    ? (de ? `Versuche das Testing mit ${b.parallel} parallelen Testcase Runs. Wenn Rate Limits erreicht werden, gehe zurück auf eine parallele Session.` : `Try testing with ${b.parallel} parallel test case runs. If you hit rate limits, fall back to one session at a time.`)
    : (de ? "Führe die Testcase Runs nacheinander aus." : "Run the test cases one at a time.");

  add(de ? `/axl-lab-facilitator Recherchiere für eine AXL Session mit ${b.customer} als Kunden.` : `/axl-lab-facilitator Research ${b.customer} for an upcoming AXL session.`);
  add(b.useCase);
  if (b.moreUseCases > 0) add(b.useCase
    ? (de ? `Entwickle außerdem ${b.moreUseCases} weitere mögliche Use Cases als Entscheidungsgrundlage.` : `Also develop ${b.moreUseCases} further possible use cases as a basis for the decision.`)
    : (de ? `Schlage ${b.moreUseCases} mögliche Use Cases als Entscheidungsgrundlage vor.` : `Propose ${b.moreUseCases} possible use cases as a basis for the decision.`));
  if (b.knowledge) add(de ? `Außerdem soll es Wissen zu folgenden Themen geben: ${b.knowledge}` : `The agent should also have knowledge about: ${b.knowledge}`);
  if (b.persona) add(de ? `Der Agentic Agent soll den Namen ${b.persona} tragen.` : `The agentic agent should be called ${b.persona}.`);
  add(de ? "Alle Assets und diese Session sollen auf Deutsch stattfinden." : "All assets and this session are in English.");
  if (b.functionPath) add(de ? "Alle Tools sollen soweit möglich den Function Path nutzen und nicht den Echo Path." : "All tools should use the function path rather than the echo path wherever possible.");
  add(testing);
  add(parallel);
  const research = lines.join("\n");

  const build = [
    de ? "/axl-lab-facilitator Job 3: Baue und teste den AVA." : "/axl-lab-facilitator Job 3: Build and test the AVA.",
    de ? `Höchstens 10 Testcases; jeder Testcase läuft pro Iteration ${runs}. Wenn mindestens ${b.threshold} % bestanden sind, ${after}. Sonst verfeinere und iteriere, höchstens bis Version ${b.maxVersions}.`
       : `At most 10 test cases; run each test case ${runs} per iteration. When at least ${b.threshold}% pass, ${after}. Otherwise refine and iterate, up to version ${b.maxVersions} at most.`,
    parallel,
  ].join("\n");
  return { research, build };
}

/** The form behind the research prompt; saved with the workshop (the user's text, shown as text only). */
function axlBriefForm(w, onChange) {
  const b = { ...AXL_BRIEF_DEFAULTS, customer: w.name, ...(w.brief || {}) };
  const field = (label, el, wide) => h("label", { style: wide ? "grid-column:1/-1" : null }, label, el);
  const input = (key, attrs = {}) => h("input", { value: b[key] ?? "", ...attrs });
  const area = (key, placeholder) => h("textarea", { placeholder, style: "min-height:70px;font-family:inherit;font-size:13.5px" }, b[key] ?? "");
  const num = (key, min, max) => h("input", { type: "number", min, max, value: b[key], style: "width:80px" });
  const select = (key, opts) => h("select", {}, opts.map(([v, l]) => h("option", { value: v, selected: String(b[key]) === v }, l)));
  const els = {
    customer: input("customer", { placeholder: w.name }),
    useCase: area("useCase", "What the agent should do, e.g. a central reservation line: ask for date, tent, lunch or evening, number of tables (10 people each), point out the prices."),
    moreUseCases: num("moreUseCases", 0, 5),
    knowledge: area("knowledge", "Optional, e.g. which beer is served where, opening hours"),
    persona: input("persona", { placeholder: "e.g. Johann" }),
    language: select("language", [["de", "Deutsch"], ["en", "English"]]),
    functionPath: h("input", { type: "checkbox", checked: b.functionPath ? true : null, style: "width:auto" }),
    runsPerCase: num("runsPerCase", 1, 5),
    threshold: num("threshold", 50, 100),
    afterThreshold: select("afterThreshold", [["decide", "I decide: continue or hand over to UATs"], ["uat", "hand over to UATs"], ["continue", "keep iterating up to the max version"]]),
    maxVersions: num("maxVersions", 1, 10),
    parallel: num("parallel", 1, 4),
  };
  const read = () => {
    const out = {};
    for (const [k, el] of Object.entries(els)) out[k] = el.type === "checkbox" ? el.checked : el.type === "number" ? Number(el.value) : el.value;
    return out;
  };
  for (const el of Object.values(els)) {
    el.addEventListener("input", () => onChange(read(), false));
    el.addEventListener("change", () => onChange(read(), true));
  }
  return h("div", { class: "grid", style: "grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:8px 0" },
    field("Customer", els.customer),
    field("Session and assets in", els.language),
    field("Persona name of the agent", els.persona),
    field("Use case", els.useCase, true),
    field("Further use cases to propose", els.moreUseCases),
    field("Knowledge", els.knowledge, true),
    h("label", { style: "display:flex;gap:8px;align-items:center;grid-column:1/-1" }, els.functionPath, "Tools use the function path where possible (a tool with a failure path, e.g. for the escalation, still needs the echo path)"),
    field("Runs per test case and iteration", els.runsPerCase),
    field("Pass threshold (%)", els.threshold),
    field("When reached", els.afterThreshold),
    field("Max version", els.maxVersions),
    field("Parallel test runs (falls back to 1 on rate limits)", els.parallel));
}

/** The field guide for one workshop; steps whose artifact exists in the latest session are ticked. */
function axlGuide(x) {
  const w = x.workshop;
  let brief = w.brief || {};
  const dyn = {};
  const refresh = () => {
    const p = axlPrompts(w, brief);
    for (const [k, el] of Object.entries(dyn)) el.pre.textContent = p[k];
  };
  const onChange = (next, persist) => {
    brief = next;
    refresh();
    if (persist) api(axlUrl(w.id), { method: "PUT", body: { brief: next } }).then((r) => { const y = r.workshops.find((z) => z.workshop.id === w.id); if (y) w.brief = y.workshop.brief; }).catch(showError);
  };
  const latest = x.sessions[0];
  const have = new Set(latest ? latest.artifacts : []);
  const doneIdx = AXL_GUIDE.reduce((n, g, i) => (g.done && have.has(g.done) ? i : n), -1);
  const fill = (text) => text.replaceAll("<customer>", x.workshop.name);
  const panel = h("div", { class: "panel" },
    h("h3", { style: "margin-top:0" }, "Running the workshop"),
    h("p", { class: "muted", style: "font-size:13px;margin:0 0 8px" }, latest
      ? `Progress from the latest session, ${latest.name.replace(/^AXL-/i, "")}. Prompts go into the Cursor agent you started for the research; keep that one agent for the whole engagement.`
      : "Condensed from the AXL Session Field Guide. Prompts go into the Cursor agent you start for the research; keep that one agent for the whole engagement."),
    AXL_GUIDE.map((g, i) => {
      const done = i <= doneIdx;
      return h("details", { style: "border-top:1px solid var(--line);padding:4px 0", open: i === doneIdx + 1 ? true : null },
        h("summary", { style: "color:var(--text)" }, done ? "✓ " : "", h("strong", {}, g.title), h("span", { class: "muted" }, `  ${g.when}`)),
        h("ul", { style: "margin:4px 0 8px;padding-left:20px;font-size:13.5px" }, g.todo.map((t) => h("li", {}, t))),
        g.id === "before" ? axlBriefForm(w, onChange) : null,
        (g.prompts || []).map((pr) => {
          const pre = h("pre", { style: "flex:1;margin:0;white-space:pre-wrap" }, pr.dynamic ? "" : fill(pr.text));
          if (pr.dynamic) dyn[pr.dynamic] = { pre };
          const copy = h("button", { class: "btn", style: "padding:2px 10px;font-size:12px" }, "Copy");
          copy.addEventListener("click", () => { try { navigator.clipboard.writeText(pre.textContent); copy.textContent = "Copied"; setTimeout(() => (copy.textContent = "Copy"), 1200); } catch {} });
          return h("div", { style: "margin:6px 0" },
            h("div", { class: "muted", style: "font-size:12px;margin-bottom:2px" }, pr.note),
            h("div", { class: "row", style: "align-items:flex-start;flex-wrap:nowrap" }, pre, copy));
        }),
        h("div", { style: "font-size:13px;margin:4px 0 6px" }, h("span", { class: "muted" }, "Comes out: "), g.out));
    }));
  refresh();
  return panel;
}

// source), a calculator (computed by the server from the same figures), and one org's live billing
// broken down (read-only, the endpoint behind Admin → Billing & Usage).
const PRICING_TABS = [
  ["start", "Start here"], ["models", "Licence models"], ["licences", "Licences & add-ons"], ["tokens", "AI tokens"], ["how", "Rules & combinations"],
  ["cases", "Use cases"], ["calc", "Calculator"], ["live", "Live billing"], ["sources", "Sources"],

const CALC_KEY = "gctk-pricing-calc";
const usd = (v, cur = "USD") => {
  const x = Number(v) || 0;
  const small = x !== 0 && Math.abs(x) < 1;
  try { return new Intl.NumberFormat("en-US", { style: "currency", currency: cur, minimumFractionDigits: small ? 2 : 0, maximumFractionDigits: small ? 4 : 2 }).format(x); }
  catch { return `${x.toFixed(2)} ${cur}`; }
};
const numFmt = (v, digits = 2) => (Number(v) || 0).toLocaleString("en-US", { maximumFractionDigits: digits });
const extLink = (doc) => h("a", { href: doc.url, target: "_blank", rel: "noopener noreferrer" }, doc.title);
function docLinks(cat, ids) {
  const docs = (ids || []).map((id) => cat.docs[id]).filter(Boolean);
  return docs.length ? h("div", { class: "muted", style: "font-size:12px;margin-top:4px" }, docs.length > 1 ? "Sources: " : "Source: ", docs.map((d, i) => [i ? " · " : "", extLink(d)])) : null;
}
function pricingTabState() {
  if (!state.pricingTab) { try { state.pricingTab = sessionStorage.getItem("gctk-pricing-tab") || "start"; } catch { state.pricingTab = "start"; } }
  if (!PRICING_TABS.some(([id]) => id === state.pricingTab)) state.pricingTab = "start";
  return state.pricingTab;
}
// The page keeps one tier, people, Communicate users and hourly hours; old inputs and use cases (seats per licence) are converted.
function calcNormalise(cat, x) {
  const v = x && typeof x === "object" ? x : {};
  const seats = v.seats || {};
  const tiers = cat.licences.filter((l) => l.id !== "communicate");
  const tier = tiers.some((l) => l.id === v.tier) ? v.tier : (tiers.find((l) => seats[l.id] > 0) || tiers.find((l) => (v.hourly || {})[l.id] > 0) || tiers.find((l) => l.id === "cx2")).id;
  return {
    model: ["compare", "named", "concurrent"].includes(v.model) ? v.model : "compare",
    peakPercent: v.peakPercent || 100,
    tier,
    people: v.people ?? (seats[tier] || 0),
    communicate: v.communicate ?? (seats.communicate || 0),
    hours: v.hours ?? Object.values(v.hourly || {}).reduce((sum, n) => sum + (Number(n) || 0), 0),
    addOns: { ...(v.addOns || {}) }, usage: { ...(v.usage || {}) }, fairUse: { ...(v.fairUse || {}) },
    tokenPrice: v.tokenPrice ?? cat.tokenPrice,
  };
}
function calcInput(cat) {
  if (state.calcInput?.tier) return state.calcInput;
  let saved = state.calcInput || null;
  if (!saved) try { saved = JSON.parse(localStorage.getItem(CALC_KEY) || "null"); } catch {}
  return (state.calcInput = calcNormalise(cat, saved || cat.useCases[0].input));
}
const addOnFits = (a, tier) => !a.on.length || a.on.includes(tier);
function calcBody(cat, inp) {
  return {
    model: inp.model, peakPercent: inp.peakPercent, tokenPrice: inp.tokenPrice, usage: inp.usage, fairUse: inp.fairUse,
    seats: { [inp.tier]: inp.people || 0, communicate: inp.communicate || 0 },
    hourly: inp.hours ? { [inp.tier]: inp.hours } : {},
    addOns: Object.fromEntries(Object.entries(inp.addOns).filter(([id]) => addOnFits(cat.addOns.find((a) => a.id === id) || { on: ["none"] }, inp.tier))),
  };
}
