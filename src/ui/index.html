const CHART_COLORS = ["var(--accent)", "#4f7cff", "#1a9e8f", "#a259ff", "#e0a100", "#8a8f98", "#d6457a"];
// Horizontal stacked bar with a legend; segments: [{ label, value, color?, text? }].
function stackBar(segments, { format = (v) => numFmt(v), height = 14, empty = "Nothing to show." } = {}) {
  const segs = segments.filter((x) => x.value > 0).map((x, i) => ({ ...x, color: x.color || CHART_COLORS[i % CHART_COLORS.length] }));
  const total = segs.reduce((sum, x) => sum + x.value, 0);
  if (!total) return h("p", { class: "muted", style: "margin:4px 0" }, empty);
  return h("div", {},
    h("div", { role: "img", "aria-label": segs.map((x) => `${x.label} ${format(x.value)}`).join(", "), style: `display:flex;height:${height}px;border-radius:${height / 2}px;overflow:hidden;background:var(--neutral-bg);margin:6px 0` },
      segs.map((x) => h("div", { title: `${x.label}: ${format(x.value)} (${Math.round((x.value / total) * 100)} %)`, style: `width:${(x.value / total) * 100}%;background:${x.color};min-width:3px` }))),
    h("div", { style: "display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px" },
      segs.map((x) => h("span", { style: "display:inline-flex;align-items:center;gap:5px" },
        h("i", { style: `width:10px;height:10px;border-radius:3px;background:${x.color};display:inline-block` }),
        `${x.label}: ${x.text ?? format(x.value)} (${Math.round((x.value / total) * 100)} %)`))));
}
// One labelled bar per row, scaled to the largest value; rows: [{ label, value, text?, color?, marker?, markerLabel? }].
function barList(rows, { format = (v) => numFmt(v), max } = {}) {
  const top = max ?? Math.max(...rows.map((r) => Math.max(r.value, r.marker || 0)), 0);
  if (!top) return null;
  return h("div", { style: "display:grid;grid-template-columns:minmax(120px,38%) minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:13px;margin:6px 0" },
    rows.map((r, i) => [
      h("div", { style: "overflow:hidden;text-overflow:ellipsis;white-space:nowrap", title: r.label }, r.label),
      h("div", { style: "position:relative;height:12px;border-radius:6px;background:var(--neutral-bg)" },
        h("div", { style: `width:${Math.max(r.value ? 1 : 0, (r.value / top) * 100)}%;height:100%;border-radius:6px;background:${r.color || CHART_COLORS[i % CHART_COLORS.length]}` }),
        r.marker ? h("div", { title: r.markerLabel || "", style: `position:absolute;top:-3px;bottom:-3px;left:calc(${Math.min(100, (r.marker / top) * 100)}% - 1px);width:2px;background:var(--text)` }) : null),
      h("div", { style: "white-space:nowrap;text-align:right" }, r.text ?? format(r.value))]));
}

const periodLabel = (start, end) => `${new Date(start).toLocaleDateString(undefined, { day: "numeric", month: "short", timeZone: "UTC" })} – ${new Date(end).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" })}`;
const INSIGHT_STYLE = { alert: ["var(--bad)", "var(--bad-bg)", "Act"], warn: ["var(--warn)", "var(--warn-bg)", "Watch"], ok: ["var(--ok)", "var(--ok-bg)", "Fine"], info: ["var(--muted)", "var(--neutral-bg)", "Note"] };

// Columns of stacked segments; cols: [{ label, title, segments: [{ label, value, color }], ghost?, marker?, markerLabel? }].
function columnChart(cols, { height = 140, format = (v) => numFmt(v) } = {}) {
  const top = Math.max(...cols.map((c) => Math.max(c.segments.reduce((s, x) => s + x.value, 0), c.ghost || 0, c.marker || 0)), 0);
  if (!top) return null;
  const pc = (v) => `${(v / top) * 100}%`;
  return h("div", { role: "img", "aria-label": cols.map((c) => `${c.title || c.label}: ${format(c.segments.reduce((s, x) => s + x.value, 0))}`).join("; "), style: `display:grid;grid-template-columns:repeat(${cols.length},minmax(0,1fr));gap:10px;align-items:end;margin:8px 0` },
    cols.map((c) => {
      const total = c.segments.reduce((s, x) => s + x.value, 0);
      return h("div", { style: "display:flex;flex-direction:column;align-items:stretch;gap:4px;min-width:0", title: `${c.title || c.label}: ${format(total)}${c.ghost ? ` (forecast ${format(c.ghost)})` : ""}${c.marker ? ` · ${c.markerLabel || "included"} ${format(c.marker)}` : ""}` },
        h("div", { style: "font-size:11px;text-align:center;white-space:nowrap" }, c.error ? "–" : format(total)),
        h("div", { style: `position:relative;height:${height}px;display:flex;flex-direction:column-reverse` },
          c.ghost && c.ghost > total ? h("div", { style: `position:absolute;left:0;right:0;bottom:0;height:${pc(c.ghost)};border:1px dashed var(--muted);border-radius:4px 4px 0 0` }) : null,
          c.segments.filter((x) => x.value > 0).map((x, i, arr) => h("div", { style: `height:${pc(x.value)};background:${x.color};${i === arr.length - 1 ? "border-radius:4px 4px 0 0;" : ""}min-height:2px` })),
          c.marker ? h("div", { style: `position:absolute;left:-4px;right:-4px;bottom:${pc(c.marker)};border-top:2px solid var(--text)` }) : null),
        h("div", { class: "muted", style: `font-size:11px;text-align:center;white-space:nowrap;${c.current ? "font-weight:700;color:var(--text)" : ""}` }, c.label));
    }));
}

  const refresh = h("button", { class: "btn" }, "Refresh");

      periods.filter((p) => Date.parse(p.end) < now).slice(0, 24).map((p) => h("option", { value: p.end.slice(0, 10), selected: state.billingPeriod === p.end.slice(0, 10) }, periodLabel(p.start, p.end))));
    if (state.billingPeriod && period.value !== state.billingPeriod) { state.billingPeriod = ""; period.value = ""; }
  };
  const loadHistory = async (fresh) => {
    const profile = state.profile;
    put(trend, h("h3", { style: "margin-top:0" }, "Last 6 billing periods"), h("p", { class: "muted" }, "Reading earlier periods…"));
    try {
      const hist = await api(`/api/pricing/billing/history?profile=${encodeURIComponent(profile)}${fresh ? "&refresh=1" : ""}`);
      if (profile !== state.profile) return;
      fillPeriods(hist.periods);
      put(trend, ...billingTrend(cat, hist));

      put(trend, h("h3", { style: "margin-top:0" }, "Last 6 billing periods"), h("p", { class: "muted" }, `Earlier periods could not be read: ${err.message}`));

  const load = async (fresh) => {

      if (profile === state.profile && state.view === "pricing" && state.pricingTab === "live") put(out, billingReport(cat, r, trend));
    } catch (err) {
      put(out, h("div", { class: "error" }, err.message), /403|permission/i.test(err.message) ? h("div", { class: "warn" }, "The org's OAuth client needs the role permission Billing > Subscription > View (or Billing > All Permissions) and the scope billing:readonly.") : null);
    } finally { refresh.disabled = false; }
  };
  sel.addEventListener("change", () => { state.profile = sel.value; state.billingPeriod = ""; load(false); loadHistory(false); });
  period.addEventListener("change", () => { state.billingPeriod = period.value; load(false); });
  refresh.addEventListener("click", () => { load(true); loadHistory(true); });
  load(false);
  loadHistory(false);
  return h("div", {},
    h("div", { class: "row", style: "margin-bottom:8px" }, sel, period, h("span", { class: "spacer" }), refresh),

    out,

function billingTrend(cat, hist) {
  const months = hist.months;
  const title = h("h3", { style: "margin-top:0" }, `Last ${months.length} billing periods`);
  if (!months.length) return [title, h("p", { class: "muted" }, "The org's billing periods could not be read.")];
  const totals = new Map();
  for (const m of months) for (const f of m.features) totals.set(f.name, (totals.get(f.name) || 0) + f.tokens);
  const top = [...totals.entries()].sort((a, b) => b[1] - a[1]).slice(0, 4).map(([n]) => n);
  const colorOf = (name) => CHART_COLORS[top.indexOf(name)] ?? CHART_COLORS[5];
  const label = (m) => new Date(m.end).toLocaleDateString(undefined, { month: "short", timeZone: "UTC" });
  const tokenCols = months.map((m) => {
    const known = m.features.reduce((s, f) => s + f.tokens, 0);
    const segs = top.map((n) => ({ label: n, value: m.features.find((f) => f.name === n)?.tokens || 0, color: colorOf(n) }));
    const rest = Math.max(0, (m.tokensUsed ?? 0) - segs.reduce((s, x) => s + x.value, 0));
    segs.push({ label: known ? "Other and per-user" : "All features", value: rest, color: CHART_COLORS[5] });
    return { label: label(m), title: periodLabel(m.start, m.end), current: m.current, error: m.error, segments: segs, ghost: m.tokensForecast, marker: m.tokensIncluded, markerLabel: "included" };
  });
  const closed = months.filter((m) => !m.current && !m.error && m.tokensUsed !== null);
  const cur = months.find((m) => m.current);
  const last = closed[closed.length - 1];
  const avg = closed.length ? closed.reduce((s, m) => s + m.tokensUsed, 0) / closed.length : 0;
  const peak = closed.reduce((a, m) => (!a || m.tokensUsed > a.tokensUsed ? m : a), null);
  const lines = [];
  if (closed.length) lines.push(`On average the org used ${numFmt(avg, 0)} AI tokens a period; the most was ${numFmt(peak.tokensUsed, 0)} (${periodLabel(peak.start, peak.end)}).`);
  if (cur?.tokensForecast && last?.tokensUsed) {
    const d = Math.round(((cur.tokensForecast - last.tokensUsed) / last.tokensUsed) * 100);
    lines.push(`This period is heading for about ${numFmt(cur.tokensForecast, 0)} tokens: ${d === 0 ? "the same as" : `${Math.abs(d)} % ${d > 0 ? "more" : "less"} than`} last period.`);
  }
  const over = closed.filter((m) => m.tokensUsed > m.tokensIncluded && m.tokensIncluded);
  if (over.length) lines.push(`${over.length} of the last ${closed.length} closed periods used more tokens than included.`);
  const maxUsed = Math.max(0, ...months.map((m) => Math.max(m.tokensUsed || 0, m.tokensForecast || 0)));
  const maxIncluded = Math.max(0, ...months.map((m) => m.tokensIncluded));
  if (!maxUsed) for (const c of tokenCols) c.marker = 0;
  else if (maxIncluded > 2 * maxUsed) {
    for (const c of tokenCols) c.marker = 0;
    lines.push(`Every period stayed far below the ${numFmt(maxIncluded, 0)} included tokens, so the chart leaves that line out to keep the bars readable.`);
  }

// Enablement Radar: the partner survey's Excel export, uploaded here and kept in the gctk home.
// "All partners" compares them; one partner shows every answer, grouped as in the checklist.
const RADAR_STATUS = { ready: ["Ready", "ok"], attention: ["Needs attention", "todo"], unanswered: ["No answer", "off"] };
const radarPct = (r) => r.answered ? Math.round((r.ready / r.answered) * 100) : null;
const radarStack = (ready, attention) => {
  const all = ready + attention;
  return h("span", { class: "stack", title: `${ready} ready, ${attention} need attention` },
    all ? [h("i", { class: "s-r", style: `width:${(ready / all) * 100}%` }), h("i", { class: "s-a", style: `width:${(attention / all) * 100}%` })] : null);
};
/** One partner name may have answered more than once: the newest answer counts. */
function radarPartners(radar) {
  const by = new Map();
  for (const r of radar.responses) by.set(r.partner, [...(by.get(r.partner) || []), r]);
  for (const list of by.values()) list.sort((a, b) => String(b.submitted || "").localeCompare(String(a.submitted || "")));
  return [...by.entries()].map(([name, list]) => ({ name, latest: list[0], all: list })).sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));
}

async function viewPartner() {
  if (state.radar === undefined) state.radar = (await api("/api/partner/radar")).radar;
  const radar = state.radar;
  const msg = h("div");
  const picker = h("input", { type: "file", accept: ".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", hidden: true });
  const upload = async (f) => {
    if (!f) return;
    put(msg, h("div", { class: "muted", style: "font-size:13px" }, `Reading ${f.name}…`));
    try {
      const data = await new Promise((ok, fail) => { const r = new FileReader(); r.onload = () => ok(String(r.result).replace(/^data:[^,]*,/, "")); r.onerror = () => fail(new Error(`Could not read ${f.name}.`)); r.readAsDataURL(f); });
      state.radar = (await api("/api/partner/radar", { method: "POST", body: { file: data, name: f.name } })).radar;
      state.radarPartner = "";
      render();
    } catch (err) { put(msg, h("div", { class: "error" }, err.message)); }
    picker.value = "";
  };
  picker.addEventListener("change", () => upload(picker.files[0]));
  const choose = (label, primary) => h("button", { class: `btn${primary ? " primary" : ""}`, onclick: () => picker.click() }, icon("plus"), label);

  const head = [pageHead("Partner", "How ready your partners are to demo Genesys Cloud, from their own answers."), h("div", { class: "section-title" }, icon("eye"), "Enablement Radar")];
  if (!radar) {
    const drop = h("div", { class: "drop" },
      h("span", { class: "bubble" }, icon("layers")),
      h("strong", { style: "font-size:16px" }, "Upload the survey results"),
      h("span", { class: "muted", style: "max-width:560px" }, "The Excel file Microsoft Forms exports for the Genesys Partner Demo Org Readiness Checklist (Open results in Excel). Drop it here or choose it. It stays on this computer."),
      choose("Choose Excel file…", true), picker);
    drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); upload(e.dataTransfer.files[0]); });
    return h("div", {}, head, h("div", { class: "panel" }, drop, msg));
  }

  const partners = radarPartners(radar);
  if (state.radarPartner && !partners.some((p) => p.name === state.radarPartner)) state.radarPartner = "";
  const sel = h("select", { "aria-label": "Partner", style: "min-width:280px", onchange: () => { state.radarPartner = sel.value; state.radarSubmission = null; render(); } },
    h("option", { value: "" }, `All partners (${partners.length})`),
    partners.map((p) => h("option", { value: p.name, selected: p.name === state.radarPartner }, p.name)));
  const remove = h("button", { class: "btn danger", onclick: async () => {
    if (!confirm(`Remove the survey results (${radar.fileName}) from this computer?`)) return;
    try { await api("/api/partner/radar", { method: "DELETE" }); state.radar = null; state.radarPartner = ""; render(); } catch (err) { showError(err); }
  } }, icon("trash"), "Remove");
  const bar = h("div", { class: "panel row" },
    h("label", { style: "flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--text)" }, h("strong", {}, "Partner"), sel),
    h("span", { class: "spacer" }),
    h("span", { class: "muted", style: "font-size:12.5px" }, `${radar.fileName} · ${radar.responses.length} answers · uploaded ${time(radar.importedAt)}`),
    choose("Replace file…"), remove, picker);
  const chosen = partners.find((p) => p.name === state.radarPartner);
  return h("div", {}, head, bar, msg, chosen ? radarPartner(radar, chosen) : radarOverview(radar, partners));
}

  const gaps = statusTopics.map((t) => {
    const answers = latest.map((r) => r.answers.find((a) => a.topic === t.id)?.status);
    return { t, ready: answers.filter((s) => s === "ready").length, attention: answers.filter((s) => s === "attention").length };
  }).sort((a, b) => b.attention - a.attention || a.ready - b.ready);
  const filter = h("input", { type: "search", placeholder: "Filter by partner name", "aria-label": "Filter by partner name", style: "min-width:240px", value: state.radarFilter || "" });
  const rows = latest.slice().sort((a, b) => (radarPct(b) ?? -1) - (radarPct(a) ?? -1) || a.partner.localeCompare(b.partner)).map((r) => {

      h("td", { style: "width:170px" }, r.answered ? h("div", { class: "row", style: "flex-wrap:nowrap" }, radarStack(r.ready, r.attention), h("strong", { style: "min-width:38px;text-align:right" }, `${radarPct(r)} %`)) : h("span", { class: "status todo" }, "No demo org")),

// What the org's OAuth client needs for this demo, from the API spec. "a | b" means one of them is enough.
function permissionsPanel(d) {
  const groups = d.permissions || [];
  if (!groups.length) return null;
  const total = new Set(groups.flatMap((g) => g.items)).size;
  const text = groups.map((g) => `${g.title}\n${g.items.map((x) => `  ${x.split(" | ").join(" or ")}`).join("\n")}`).join("\n\n");
  return h("details", { class: "sub-block more" },
    h("summary", {}, icon("key"), h("strong", { style: "font-size:13.5px" }, `Permissions the org's OAuth client needs (${total})`)),
    h("p", { class: "muted", style: "font-size:13px" }, "Give the org's OAuth client a role with these. Where it says \"or\", one is enough."),
    h("div", { class: "row", style: "margin-bottom:8px" }, h("button", { class: "btn", onclick: async (ev) => { await navigator.clipboard.writeText(text); ev.target.textContent = "Copied"; setTimeout(() => (ev.target.textContent = "Copy list"), 1500); } }, "Copy list")),
    groups.map((g) => h("div", { style: "margin-top:10px" },
      h("strong", { style: "font-size:13px" }, `${g.title} (${g.items.length})`),
      h("div", { class: "mono", style: "font-size:12px;columns:2 320px;column-gap:24px;margin-top:4px" }, g.items.map((x) => h("div", {}, x.split(" | ").join(" or ")))))));
}

function demoDetail(d, data, pick, keep, msg) {
  if (d.error) return h("div", { class: "error" }, d.error);

  const orgSel = h("select", { onchange: () => { pick.profile = orgSel.value; keep(); render(); } },

  const personaValue = () => ({ salutation: persona.salutation.value, firstName: persona.firstName.value.trim(), lastName: persona.lastName.value.trim() });
  const personaFields = () => personaOn ? h("label", { style: "grid-column:1/-1" }, "Your customer (the contact you play; the name must be unique in the org)", h("div", { class: "row" }, persona.salutation, persona.firstName, persona.lastName)) : null;
  const deployed = d.deployments.find((x) => x.profile === pick.profile);

  const divSel = h("select", {}, h("option", {}, "…"));

  const waSel = h("select", { style: "min-width:240px" }, h("option", { value: "" }, "…"));
  userSel.addEventListener("change", () => { if (orgStatus?.deployment) drawDeploy(); });
  let whatsapp = [];

    out.scrollIntoView({ behavior: "smooth", block: "nearest" });
    try {
      const { job } = await api(url, { method: "POST", body });
      for (;;) {
        await new Promise((r) => setTimeout(r, 1500));
        const j = await api(`/api/demos/jobs/${job}`);
        logEl.textContent = j.lines.join("\n");
        logEl.scrollTop = logEl.scrollHeight;
        if (j.done) {

  const drawDeploy = () => {

        which !== "update" ? personaFields() : null,
        paramInputs.filter(({ p }) => which === "deploy" || (which === "join" ? p.perPresenter : !p.perPresenter)).map(({ p, el }) => h("label", {}, `${p.label}${p.optional ? "" : " *"}`, el)))];
    const deploy = (update) => {

      const empty = paramInputs.find(({ p, el }) => !p.optional && !el.value.trim() && (!update || !p.perPresenter));
      if (!update && personaOn && (!userSel.value || !personaValue().firstName || !personaValue().lastName)) { put(msg, h("div", { class: "error" }, "Choose yourself as the presenter and give your customer a first and last name.")); return; }
      if (empty) { empty.el.focus(); put(msg, h("div", { class: "error" }, `Enter "${empty.p.label}".`)); return; }
      put(msg);
      const via = channels.length && !update ? `\n\nCustomer channel: ${channelLabel(pick.channel)}.` : "";
      const ask = update
        ? `Update the deployment of "${m.name}" in ${pick.profile} to the demo's latest version? It stays the one deployment everyone in this org shares; nothing is created twice.`
        : `Deploy "${m.name}" into ${pick.profile}?${via} Objects that already exist with the same name are used as they are; everything else is created. Everyone with gctk then sees this deployment.${route}`;

    };
    const warnBox = (text) => h("div", { class: "warn" }, text);
    let body;
    if (!d.snapshot) body = warnBox(d.canSnapshot ? `No snapshot yet: take one from ${d.sourceProfile} under "What the demo contains" first.` : "No snapshot yet, so this demo cannot be deployed. Update gctk to get it.");
    else if (!st) body = h("div", { class: "muted" }, "Checking whether the demo is in this org …");

    else if (dep) {

      const join = async () => {
        if (!userSel.value) { put(msg, h("div", { class: "error" }, "Choose yourself as the presenter first.")); return; }
        const params = Object.fromEntries(paramInputs.filter(({ p }) => p.perPresenter).map(({ p, el }) => [p.id, el.value.trim()]));

    h("div", { class: "banner demo-hero", style: demoColors(d.id) },

    h("details", { class: "panel more", style: "margin-top:14px" }, h("summary", {}, icon("layers"), h("strong", {}, "What the demo contains"), snap ? h("span", { class: "muted", style: "font-size:13px" }, `${snap.objects} objects, snapshot of ${time(snap.at)}`) : null),

/** The UI's address: it stays the same, so it can be bookmarked; another port moves this tab there. */
function addressPanel() {
  const box = h("div", { class: "panel" }, h("strong", {}, "Address of gctk"));
  api("/api/ui/port").then((p) => {
    const address = `http://${location.hostname}:${p.port}/`;

    const note = h("span", { class: "muted", style: "font-size:13px" });
    const save = h("button", { class: "btn" }, "Change port");
    save.addEventListener("click", async () => {
      const port = Number(input.value);
      if (port === p.port) return;
      save.disabled = true;
      try {
        const check = await api(`/api/ui/port?check=${port}`);
        if (!check.free) { put(note, h("span", { style: "color:var(--bad)" }, `Port ${port} is in use by another program. Choose another one.`)); return; }
        if (!confirm(`Move gctk to port ${port}?\n\nIts address becomes http://${location.hostname}:${port}/ from now on, also after a restart. Update your bookmark.`)) return;
        const r = await api("/api/ui/port", { method: "POST", body: { port } });
        // The token moves along in the fragment; the new address keeps it in this browser again.
        if (r.url) location.href = `${r.url}&view=data`;
      } catch (err) { put(note, h("span", { style: "color:var(--bad)" }, err.message)); } finally { save.disabled = false; }
    });
    put(box,
      h("div", { class: "row" }, h("strong", {}, "Address of gctk"), h("span", { class: "mono" }, address), copyButton(address)),
      h("p", { class: "muted", style: "font-size:13px;margin:6px 0 8px" }, "Bookmark it: gctk keeps this address, also after a restart, and this browser remembers it may open it. It answers while the gctk UI runs; the AI or `gctk ui` starts it."),
      p.movable ? h("div", { class: "row" }, h("span", { class: "muted", style: "font-size:13px" }, "Port"), input, save, note)
        : h("p", { class: "muted", style: "font-size:13px;margin:0" }, "This UI runs in a terminal; start it with `gctk ui --port <n>` to change the port."));
  }).catch((err) => put(box, h("div", { class: "error" }, err.message)));
  return box;
}

// ------------------------------------------------------------- AI setup
// The MCP servers and skills of the user's editors, read from their config files by the gctk server.
// Secrets arrive masked; the fix buttons change the user's config files (server side).
// AI Coding Tools (page id ai-setup; the old page id claude-app opens it too): what Cursor loads in
// every folder and the Claude app in every chat and Cowork session, the org each Genesys server works
// on, and one-click fixes. A folder's own servers and org belong to the Projects page; folders with
// their own config are offered as projects. The Claude app has no folders, so its one AVA harness
// gets a workshop here.
const CREDS = {
  none: ["no credentials", ""],
  plain: ["secret in plain text in the file", "s-failed"],
  reference: ["secret from a variable", ""],
  keychain: ["secret in a keychain entry of its own", "s-pending"],
  org: ["org on the Orgs page", "s-applied"],
  "gctk-profile": ["gctk orgs (keychain)", "s-applied"],
  axl: ["AXL workshop org (keychain, through gctk)", "s-applied"],
  project: ["project org (keychain, through gctk)", "s-applied"],
};
const FIX_LABELS = { keychain: "Move the secret to the keychain", restore: "Move the secret back into the file", remove: "Remove this entry", "clean-env": "Remove the old variable", repair: "Repair" };
/** Plain names for the Genesys MCP servers people meet most. */
const TOOL_NAMES = { "ava-harness": ["AVA harness", "builds and tests AI agents (Agentic Virtual Agents)"], "genesys-cloud-architect-mcp": ["Architect", "reads and writes Architect flows"], gctk: ["gctk", "lets the AI open this UI"] };
const RELOAD_HINTS = {
  cursor: "Restart the server in Cursor so it picks up the change: Settings → MCP, switch it off and on.",
  "claude-desktop": "Quit the Claude app (Cmd+Q on a Mac, not just the window) and open it again: it reads its servers only when it starts.",
};
const APP_NAMES = { cursor: "Cursor", "claude-desktop": "Claude app" };
const projName = (p) => (p ? p.split(/[\\/]/).filter(Boolean).pop() : "");
const whereText = (x) => x.editor === "claude-desktop" ? "Claude app" : x.scope === "plugin" ? `plugin ${x.plugin}` : x.scope === "project" ? `folder ${projName(x.project)}` : "every folder";
const sortServers = (list) => [...list].sort((a, b) => a.name.localeCompare(b.name) || whereText(a).localeCompare(whereText(b)));

/** Only what one app loads: its config files, their servers and the keychain items those use. */
function forEditor(s, editor) {
  const files = s.files.filter((f) => f.editor === editor);
  const paths = new Set(files.map((f) => f.path));
  return { ...s, files, servers: s.servers.filter((x) => x.editor === editor), secrets: s.secrets.filter((m) => m.usedBy.some((u) => paths.has(u.file))) };
}

/** AI Coding Tools (page id ai-setup): Cursor and the Claude app on one page. */
async function viewAiSetup() {
  const msg = h("div");
  const body = h("div", {}, h("div", { class: "panel empty" }, "Reading the configs of Cursor and the Claude app…"));
  const refresh = h("button", { class: "btn" }, icon("refresh"), "Refresh");
  let projects = [];
  let axl = null;
  const draw = (s) => put(body, aiToolsReport(s, msg, draw, projects, axl, load));
  const load = async () => {
    refresh.disabled = true;
    try {
      const [s, a, templates] = await Promise.all([api("/api/ai-setup"), api("/api/axl").catch(() => ({ workshops: [] })), api("/api/axl/tool-templates").catch(() => [])]);
      axl = { ...a, templates };
      projects = a.workshops.map((x) => x.workshop);
      draw(s);
    } catch (err) { put(body, h("div", { class: "error" }, err.message)); } finally { refresh.disabled = false; }
  };
  refresh.addEventListener("click", () => { msg.replaceChildren(); state.updates = api("/api/ai-setup/updates?refresh=1").then((r) => r.programs); load(); });
  load();
  return h("div", {},
    pageHead("AI Coding Tools", "Which MCP servers Cursor and the Claude app load, and which Genesys Cloud org each one works on.", refresh),
    msg, body);
}

/** The fixes for one app's servers; results show in msg with that app's restart hint. */
function aiCtx(msg, draw, editor) {
  const hint = RELOAD_HINTS[editor];
  const done = (text, next) => { put(msg, h("div", { class: "okbox" }, text, " ", hint)); draw(next); window.scrollTo({ top: 0, behavior: "smooth" }); };
  const failed = (err) => { put(msg, h("div", { class: "error" }, err.message)); window.scrollTo({ top: 0, behavior: "smooth" }); };
  const post = (x, kind) => api("/api/ai-setup/fix", { method: "POST", body: { file: x.file, section: x.section, name: x.name, fix: kind } });
  return {
    msg, draw, editor, hint,
    async fix(x, kind) {
      const names = x.env.filter((v) => v.plain).map((v) => v.name).join(", ");
      const ask = {
        keychain: `Move ${names} of "${x.name}" (${whereText(x)}) into the keychain? The secret is then no longer in\n${x.file}\n\nScripts that read the secret from this file themselves stop working (a demo started from the Demos page gets it from gctk).`,
        restore: `Write the secret of "${x.name}" back into\n${x.file}\nin plain text?`,
        remove: `Remove the server "${x.name}" from\n${x.file}?`,
        "clean-env": `Remove the old variable from "${x.name}"?`,
        repair: `Point "${x.name}" (${whereText(x)}) to the copy of gctk that stays across plugin updates?\n${x.file}`,
      }[kind];
      if (!confirm(ask)) return;
      try { done(`Done: ${FIX_LABELS[kind].toLowerCase()} (${x.name}).`, await post(x, kind)); } catch (err) { failed(err); }
    },
    async restoreSkill(r) {
      try { done(`Restored ${r.name} to ${r.from}.`, await api("/api/ai-setup/skills/restore", { method: "POST", body: { id: r.id } })); } catch (err) { failed(err); }
    },
    /** Links x to an org on the Orgs page; asks once when x's secret differs from the org's. */
    async link(x, body) {
      const call = (extra) => api("/api/ai-setup/link", { method: "POST", body: { file: x.file, section: x.section, name: x.name, ...body, ...extra } });
      try {
        let r;
        try { r = await call({}); }
        catch (err) {
          if (err.code !== "SECRET_DIFFERS") throw err;
          if (!confirm(`${err.message.replace(/^[A-Z_]+: /, "")}\n\nUse the org's secret? The one ${x.credentials === "plain" ? "in the file" : "in its own keychain entry"} is dropped. (If the org's is the old one, cancel and store the new secret on the Orgs page first.)`)) return;
          r = await call({ useOrgSecret: true });
        }
        await refreshOverview();
        done(r.linked.created ? `Added the org ${r.linked.profile} on the Orgs page and linked ${x.name} to it.` : `Linked ${x.name} to the org ${r.linked.profile}.`, r);
      } catch (err) { failed(err); }
    },
    async setCredentials(x, body) {
      try { done(`Saved the new credentials of ${x.name}.`, await api("/api/ai-setup/credentials", { method: "POST", body: { file: x.file, section: x.section, name: x.name, ...body } })); } catch (err) { failed(err); }
    },
    async fixAll(list, kind, what) {
      if (!confirm(`${what}?\n\n${list.map((x) => `• ${x.name} (${whereText(x)})`).join("\n")}`)) return;
      let next;
      try { for (const x of list) next = await post(x, kind); done(`Done for ${list.length} entries.`, next); } catch (err) { failed(err); if (next) draw(next); }
    },
  };
}

function aiToolsReport(s, msg, draw, projects, axl, reload) {
  state.aiAxl = axl;
  state.aiReload = reload;
  state.aiClaudeHere = forEditor(s, "claude-desktop").files.length > 0;
  const cur = forEditor(s, "cursor");
  const cla = forEditor(s, "claude-desktop");
  const ctx = { cursor: aiCtx(msg, draw, "cursor"), "claude-desktop": aiCtx(msg, draw, "claude-desktop") };
  const claudeHere = cla.files.length > 0;
  // The org a server works on: its own OAuth client's, its project's, or the Claude app's workshop's.
  const orgOf = (x) => x.org?.profile
    || (x.scope === "project" ? projects.find((w) => w.folder === x.project)?.profile : "")
    || (x.editor === "claude-desktop" && x.credentials === "axl" ? axl?.claudeApp?.org : "") || "";
  // Project folders' servers belong to the Projects page; gctk's own server works on no org.
  const genesys = s.servers.filter((x) => x.genesys && x.credentials !== "gctk-profile" && x.name !== "gctk" && x.scope !== "project");

  const todoC = todoGroups(cur, ctx.cursor);
  const todoA = claudeHere ? todoGroups(cla, ctx["claude-desktop"]) : [];
  const attention = todoC.length || todoA.length ? h("div", { class: "panel", style: "border-color:color-mix(in srgb, var(--bad) 35%, var(--line))" },
    h("div", { class: "app-head" }, h("span", { class: "bubble", style: "background:var(--bad-bg);color:var(--bad)" }, icon("alert")), h("strong", {}, "Needs your attention")),
    todoC.length ? [todoA.length ? h("div", { class: "sub-head" }, "Cursor") : null, todoC] : null,
    todoA.length ? [h("div", { class: "sub-head", style: "margin-top:10px" }, "Claude app"), todoA] : null) : null;

  const mode = state.aiView === "org" ? "org" : "app";
  const seg = h("div", { class: "seg", role: "group", "aria-label": "Show" },
    [["app", "By app"], ["org", "By org"]].map(([id, label]) => h("button", { "aria-pressed": String(mode === id), onclick: () => { state.aiView = id; draw(s); } }, label)));
  // The Claude app only shows where it is installed; many users have Cursor alone.
  const claudeCard = claudeHere ? appCard(cla, ctx["claude-desktop"], orgOf) : null;
  const cursorCard = appCard(cur, ctx.cursor, orgOf);
  const first = state.aiFocus === "claude-desktop";
  state.aiFocus = null;
  const map = mode === "app"
    ? h("div", { class: "apps" }, first ? [claudeCard, cursorCard] : [cursorCard, claudeCard])
    : byOrgView(genesys, orgOf);

  const details = h("details", { class: "panel more" },
    h("summary", {}, icon("layers"), h("strong", {}, "Every entry and config file"), h("span", { class: "muted", style: "font-size:13px" }, "commands, variables (secrets masked), keychain items, files")),
    h("div", { style: "margin-top:10px" },
      detailsFor(cur, ctx.cursor, msg, draw),
      claudeHere ? detailsFor(cla, ctx["claude-desktop"], msg, draw) : null));

  return [attention,
    h("div", { class: "section-title" }, "Who works on which org", h("span", { class: "spacer" }), seg),
    map,
    h("p", { class: "muted", style: "font-size:12.5px;margin:8px 0 0" }, "The MCP servers Cursor", claudeHere ? " and the Claude app load" : " loads", " in every folder, and the org their OAuth client belongs to. Folders with their own MCP servers are on the ", navLink("axl", "Projects"), " page."),
    availablePanel(axl, msg),
    h("div", { class: "section-title" }, "More"),
    updatesPanel(msg, "cursor", reload),
    claudeHere ? coworkSkillsPanel(msg) : null,
    details];
}

/** One app: each Genesys MCP server it loads everywhere, the org it works on, and its state. */
function appCard(sx, ctx, orgOf) {
  const claude = ctx.editor === "claude-desktop";
  const genesys = sortServers(sx.servers.filter((x) => x.scope !== "project" && x.genesys && x.name !== "gctk"));
  return h("div", { class: "panel" },
    h("div", { class: "app-head" }, h("span", { class: "bubble" }, icon(claude ? "claude" : "cursor")),
      h("div", {}, h("strong", {}, APP_NAMES[ctx.editor]), h("div", { class: "muted", style: "font-size:12.5px" }, claude ? "in every chat and Cowork session" : "in every folder you open"))),
    genesys.length ? genesys.map((x) => connRow(x, ctx, orgOf))
      : h("p", { class: "muted", style: "margin:8px 0" }, claude ? "No Genesys MCP servers yet." : "No Genesys MCP servers in every folder."));
}

function serverOrg(x, orgOf) {
  if (x.credentials === "gctk-profile") return h("span", { class: "chip none" }, "needs no org");
  const name = orgOf(x);
  if (name) return orgChip(name);
  if (x.org?.clientId) return h("span", { class: "chip none", title: x.org.clientId }, "unknown OAuth client");
  if (x.credentials === "reference") return h("span", { class: "chip none" }, "from a variable");
  return orgChip("", "no org set");
}

function serverStatus(x) {
  const warn = x.problems.filter((p) => p.level === "warn");
  if (x.disabled) return h("span", { class: "status off" }, "Off");
  if (warn.some((p) => p.kind === "missing-command" || p.kind === "launch-invalid")) return h("span", { class: "status bad" }, "Cannot start");
  if (warn.some((p) => p.kind === "plain-secret")) return h("span", { class: "status bad", title: "The secret is in plain text in the config file" }, "Plain secret");
  if (x.org?.profile && state.overview?.profiles.find((p) => p.name === x.org.profile)?.tier === "production") return h("span", { class: "status bad" }, "Production");
  return h("span", { class: "status ok", title: "Its program exists and no secret is in plain text. gctk does not start it to check." }, "Entry OK");
}

/** Lets a Genesys server work on another of the user's orgs (its credentials then come from that org). */
function useOrgSelect(x, ctx) {
  const orgs = (state.overview?.profiles || []).filter((p) => !p.error && p.credentialsStored);
  if (!x.credentialKeys || !x.editable || !orgs.length) return null;
  const sel = h("select", { "aria-label": `Org for ${x.name}` }, h("option", { value: "" }, "Change org…"),
    orgs.filter((o) => o.name !== x.org?.profile).map((o) => h("option", { value: o.name }, `${o.name} (${o.tier})`)));
  sel.addEventListener("change", () => {
    const o = sel.value;
    if (!o) return;
    if (!confirm(`Let "${x.name}" (${whereText(x)}) work on ${o}?\n\nIts client ID, secret and region become those of ${o}; the secret stays in the keychain.\n${x.file}`)) { sel.value = ""; return; }
    ctx.setCredentials(x, { profile: o, keychain: true });
  });
  return sel;
}

/**
 * The Claude app's AVA harness when it still runs an AXL workshop: the same org list as everywhere;
 * choosing one links it to that org like Cursor's (the workshop then no longer decides).
 */
function claudeWorkshopSelect(x, ctx) {
  if (x.editor !== "claude-desktop" || x.credentials !== "axl" || !state.aiAxl?.claudeApp?.ours) return null;
  const orgs = (state.overview?.profiles || []).filter((p) => !p.error && p.credentialsStored);
  if (!orgs.length) return null;
  const now = state.aiAxl.claudeApp.org;
  const sel = h("select", { "aria-label": `Org for ${x.name}` }, h("option", { value: "" }, "Change org…"),
    orgs.filter((o) => o.name !== now).map((o) => h("option", { value: o.name }, `${o.name} (${o.tier})`)));
  sel.addEventListener("change", async () => {
    const o = orgs.find((p) => p.name === sel.value);
    if (!o) return;
    if (!confirm(`Let the Claude app's AVA harness work on ${o.name}?${o.tier === "production" ? "\n\nThis is a PRODUCTION org: the AI in the Claude app can change it directly." : ""}\n\nIts credentials then come from that org on the Orgs page, at every start.\n${x.file}`)) { sel.value = ""; return; }
    try {
      const next = await api("/api/ai-setup/claude-harness-org", { method: "POST", body: { profile: o.name } });
      put(ctx.msg, h("div", { class: "okbox" }, `The Claude app's AVA harness now works on ${o.name}.`, " ", ctx.hint));
      state.aiReload ? state.aiReload() : ctx.draw(next);
    } catch (err) { put(ctx.msg, h("div", { class: "error" }, err.message)); }
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  return sel;
}

function connRow(x, ctx, orgOf) {
  const [title, what] = TOOL_NAMES[x.name] || [x.name, ""];
  return h("div", { class: "conn" },
    h("div", { class: "tool" }, h("strong", {}, title), h("small", {}, x.scope === "plugin" ? `from plugin ${x.plugin}` : what || x.name)),
    h("span", { class: "arrow" }, icon("arrow")),
    h("div", {}, serverOrg(x, orgOf)),
    h("div", { class: "end" }, serverStatus(x), useOrgSelect(x, ctx) || claudeWorkshopSelect(x, ctx)));
}

/** Folders with their own .cursor/mcp.json that are no project yet: one click makes them one. */
function otherFoldersPanel(setup, st, draw) {
  const known = new Set(st.workshops.map((x) => x.workshop.folder).filter(Boolean));
  const servers = (setup?.servers || []).filter((x) => x.scope === "project" && !known.has(x.project));
  const folders = [...new Set(servers.map((x) => x.project))].sort((a, b) => projName(a).localeCompare(projName(b)));
  if (!folders.length) return null;
  const fresh = !st.workshops.length;
  const make = async (folder) => {
    try {
      const r = await api("/api/axl/workshops", { method: "POST", body: { name: projName(folder), folder, lab: false } });
      state.axlOpen = r.id;
      draw(r);
    } catch (err) { showError(err); }
  };
  return [h("div", { class: "section-title" }, fresh ? `Your existing Cursor folders with MCP servers · ${folders.length}` : `Other folders with their own MCP servers · ${folders.length}`),
    h("div", { class: "panel" },
      h("p", { class: "muted", style: "margin:0 0 6px;font-size:13px" }, fresh
        ? "You already set these up in Cursor yourself. Make one a project to see and choose its org here; gctk keeps your entries in the folder."
        : "Cursor loads these when the folder is open. Make one a project to choose its org and MCP servers here."),
      folders.map((f) => {
        const here = servers.filter((x) => x.project === f);
        const orgs = [...new Set(here.map((x) => x.org?.profile).filter(Boolean))];
        return h("div", { class: "conn", title: f },
          h("div", { class: "tool" }, h("strong", {}, projName(f)), h("small", {}, here.map((x) => toolTitle(x.name)).join(", "))),
          h("span", { class: "arrow" }, icon("arrow")),
          h("div", { class: "chips" }, orgs.length ? orgs.map((o) => orgChip(o)) : orgChip("", "no org set")),
          h("div", { class: "end" }, h("button", { class: "btn sm", onclick: () => make(f) }, "Make it a project")));
      }))];
}


/**
 * The MCP servers a project can get: the AVA harness (part of gctk), the ones the user added and the

/**
 * Adding an MCP server for projects: how it starts, which variables take the org's client ID, secret

 */
function catalogForm(msg, close) {
  const f = {
    name: h("input", { placeholder: "architect" }),
    description: h("input", { placeholder: "reads and writes Architect flows" }),
    source: h("input", { placeholder: "npmjs.com/package/… or a GitHub link" }),

    args: h("textarea", { placeholder: "-y\n@scope/package-name", style: "min-height:60px" }),
    clientIdVar: h("input", { value: "GENESYS_CLIENT_ID" }),
    secretVar: h("input", { value: "GENESYS_CLIENT_SECRET" }),
    regionVar: h("input", { value: "GENESYS_REGION" }),
    regionFormat: h("select", {}, h("option", { value: "domain" }, "domain, e.g. mypurecloud.de"), h("option", { value: "key" }, "region key, e.g. eu-central-1")),
    env: h("textarea", { placeholder: "LOG_LEVEL=info", style: "min-height:50px" }),
  };
  const tiers = ["sandbox", "dev", "test", "production"].map((t) => [t, h("input", { type: "checkbox", checked: t !== "production" ? true : null, style: "width:auto" })]);
  const box = (label) => { const b = h("input", { type: "checkbox", style: "width:auto" }); return [b, h("label", { style: "display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--text)" }, b, label)]; };
  const [inCursor, cursorLabel] = box("Cursor, in every folder");
  const [inClaude, claudeLabel] = state.aiClaudeHere ? box("Claude app") : [null, null];
  const org = h("select", { "aria-label": "Org outside projects" });
  const drawOrgs = () => {
    const allowed = tiers.filter(([, b]) => b.checked).map(([t]) => t);
    const list = (state.overview?.profiles || []).filter((p) => !p.error && p.credentialsStored && allowed.includes(p.tier));
    const keep = org.value;
    put(org, h("option", { value: "" }, list.length ? "on the org…" : "no org of these tiers"), list.map((p) => h("option", { value: p.name, selected: p.name === keep ? true : null }, `${p.name} (${p.tier})`)));
  };
  for (const [, b] of tiers) b.addEventListener("change", drawOrgs);
  drawOrgs();
  const err = h("div");
  const save = h("button", { class: "btn primary" }, "Add");
  save.addEventListener("click", async () => {
    const lines = (v) => v.split("\n").map((x) => x.trim()).filter(Boolean);
    const env = {};
    for (const l of lines(f.env.value)) {
      const i = l.indexOf("=");
      if (i < 1) { put(err, h("div", { class: "error" }, `"${l}" is not NAME=value.`)); return; }
      env[l.slice(0, i).trim()] = l.slice(i + 1).trim();
    }
    const picked = tiers.filter(([, b]) => b.checked).map(([t]) => t);
    const useIn = [inCursor.checked ? "cursor" : null, inClaude?.checked ? "claude-desktop" : null].filter(Boolean);
    if (useIn.length && !org.value) { put(err, h("div", { class: "error" }, "Choose the org it works on in Cursor or the Claude app.")); return; }
    if (picked.includes("production") && !confirm("Let this server work on production orgs?\n\nThe AI in a project on a production org can then change that org directly through it.")) return;
    const chosen = (state.overview?.profiles || []).find((p) => p.name === org.value);
    if (useIn.length && chosen?.tier === "production" && !confirm(`${chosen.name} is a PRODUCTION org. The AI in ${useIn.map((a) => APP_NAMES[a]).join(" and ")} can then change it directly through this server. Continue?`)) return;
    const name = f.name.value.trim();
    try {
      const r = await api("/api/mcp-catalog", { method: "POST", body: {
        name: f.name.value, description: f.description.value, source: f.source.value, command: f.command.value, args: lines(f.args.value),
        clientIdVar: f.clientIdVar.value, secretVar: f.secretVar.value, regionVar: f.regionVar.value, regionFormat: f.regionFormat.value, env, tiers: picked,
        ...(useIn.length ? { useIn, profile: org.value } : {}),

      put(msg, h("div", {},
        h("div", { class: "okbox" }, `${name} is available for projects${where ? ` and works on ${org.value} in ${where}` : ""}.`, where ? ` ${r.added.map((a) => RELOAD_HINTS[a]).join(" ")}` : " Tick it in a project's settings on the Projects page."),
        r.failed.length ? h("div", { class: "error" }, `Not added: ${r.failed.join(" · ")}`) : null));
      close();
      await refreshOverview();

    } catch (e) { put(err, h("div", { class: "error" }, e.message)); }
  });
  const cancel = h("button", { class: "btn", onclick: close }, "Cancel");
  return h("div", { class: "dblock", style: "margin:4px 0 12px;padding:14px;border:1px solid var(--line);border-radius:10px;display:grid;gap:12px" },
    h("strong", {}, "Add an MCP server"),
    h("div", { class: "muted", style: "font-size:12.5px" }, "Never enter a secret here. Whenever the server starts, gctk puts the org it works on into the variables you name below: its OAuth client ID, secret and region from the Orgs page. In a project that is the project's org."),
    h("div", { class: "grid" }, h("label", {}, "Name", f.name), h("label", {}, "What it does", f.description), h("label", {}, "Where it is published", f.source)),
    h("div", { class: "grid", style: "grid-template-columns:minmax(0,1fr) minmax(0,2fr)" },
      h("label", {}, "Command (a program on this computer, e.g. npx or uvx)", f.command), h("label", {}, "Arguments, one per line", f.args)),
    h("div", { class: "grid" }, h("label", {}, "Variable for the client ID", f.clientIdVar), h("label", {}, "Variable for the secret", f.secretVar),
      h("label", {}, "Variable for the region (empty if none)", f.regionVar), h("label", {}, "Region format", f.regionFormat)),
    h("label", {}, "Other settings, NAME=value per line (no secrets)", f.env),
    h("div", {}, h("div", { style: "font-size:12px;color:var(--muted);margin-bottom:4px" }, "May work on these org tiers"),
      h("div", { class: "row", style: "gap:14px" }, tiers.map(([t, b]) => h("label", { style: "display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--text)" }, b, t)))),
    h("div", {}, h("div", { style: "font-size:12px;color:var(--muted);margin-bottom:4px" }, "Also use it outside projects (optional)"),
      h("div", { class: "row", style: "gap:14px" }, cursorLabel, claudeLabel, org),
      h("div", { class: "muted", style: "font-size:12px;margin-top:4px" }, "gctk adds it there with this org's credentials from the Orgs page, at every start. You can change the org later under Who works on which org.")),
    err,
    h("div", { class: "row" }, save, cancel));
}

/**

function coworkSkillsPanel(msg) {
  const headState = h("span", { class: "muted", style: "font-size:13px" }, "reading…");
  const box = h("div", { style: "margin-top:10px" });
  const panel = h("details", { class: "panel more" }, h("summary", {}, icon("claude"), h("strong", {}, "Skills for Cowork"), headState), box);
  const STATUS = { new: ["not zipped by gctk yet", "s-pending"], changed: ["changed since your last zip", "s-failed"], same: ["same as your last zip", "s-applied"] };
  const reveal = () => api("/api/claude-app/skills/reveal", { method: "POST", body: {} }).catch((err) => put(msg, h("div", { class: "error" }, err.message)));
  const draw = (r) => {
    const todo = r.skills.filter((x) => x.status !== "same");
    const make = async (names, label) => {
      try {
        const next = await api("/api/claude-app/skills/export", { method: "POST", body: { names } });
        put(msg, h("div", { class: "okbox" }, `Made ${next.exported.written.length} zip${next.exported.written.length > 1 ? "s" : ""} (${label}). Upload each one in the Claude app: Settings → Capabilities → Skills (one skill per upload; an upload with the same name replaces the old one). Then start a new Cowork session. `,
          h("button", { class: "btn", style: "padding:2px 10px;font-size:12px", onclick: reveal }, "Open the folder")));
        window.scrollTo({ top: 0, behavior: "smooth" });

    const row = (x) => {

          x.fixes.length ? h("div", { style: "font-size:12px" }, `In the zip: ${x.fixes.join("; ")}`) : null,
          x.problems.length ? h("div", { class: "warn", style: "margin:4px 0 0;font-size:12px" }, `The upload may refuse it: ${x.problems.join("; ")}`) : null),

      h("p", { class: "muted", style: "margin:0 0 8px;font-size:13px" }, "Cowork keeps skills in your Claude account. gctk zips the AVA skills; you upload each zip in the Claude app (Settings → Capabilities → Skills)."),
      r.skills.length ? r.skills.map(row) : h("p", { class: "muted", style: "margin:0" }, `No AVA skills in ${r.source}. They come with the AVA harness; Update under Versions installs them for Cursor.`),
      r.skills.length ? h("div", { class: "row", style: "margin-top:10px" },
        todo.length ? h("button", { class: "btn primary", onclick: () => make(todo.map((x) => x.name), todo.every((x) => x.status === "new") ? "all skills" : "the changed ones") }, `Zip ${todo.length === r.skills.length ? "all" : `the ${todo.length} changed`} skill${todo.length > 1 ? "s" : ""}`) : null,

  };

/** Programs behind the servers that gctk can update (ava-mcp, gctk). The check asks GitHub, so it loads on its own. */
const PROGRAM_NAMES = { "ava-mcp": "AVA harness (ava-mcp)", gctk: "gctk" };
/** editor "claude-desktop": only what its servers run (the AVA harness), not gctk's npx copy for Cursor. */
function updatesPanel(msg, editor = "cursor", onUpdated = null) {
  const headState = h("span", { class: "muted", style: "font-size:13px" }, "checking…");

  const panel = h("details", { class: "panel more" }, h("summary", {}, icon("refresh"), h("strong", {}, "Versions"), headState), box);

    if (!programs.length) { panel.remove(); return; }

    put(headState, due ? h("span", { class: "status todo" }, `${due} update${due > 1 ? "s" : ""} available`) : h("span", { class: "status ok" }, "all up to date"));
    if (due) panel.open = true;

        const also = (p.skills?.length ? `\n\nIt also refreshes the AVA skills and subagents in:\n${p.skills.join("\n")}` : "")

        const what = p.kind === "gctk-npx" ? "gctk deletes the gctk Cursor downloaded; Cursor downloads the newest at its next start." : `${p.name} ${p.latest} is installed with uv.`;
        if (!confirm(`Update ${PROGRAM_NAMES[p.name] || p.name} to ${p.latest}?\n\n${what}${also}`)) return;
        btn.disabled = true; btn.textContent = "Updating…";

            x.skills.length ? ` AVA skills refreshed in ${x.skills.join(", ")}.` : "", " ", x.next,
            x.skillErrors.length ? h("div", { class: "warn", style: "margin:6px 0 0" }, `Skills not refreshed: ${x.skillErrors.join("; ")}`) : null));
          state.updates = Promise.resolve(r.programs);
          draw(r.programs);
          onUpdated?.();
        } catch (err) { put(msg, h("div", { class: "error" }, err.message)); btn.disabled = false; btn.textContent = "Update"; }
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      return h("div", { class: "todo-row" },
        h("strong", { style: "flex:0 0 200px" }, PROGRAM_NAMES[p.name] || p.name),

    };
    put(box, h("p", { class: "muted", style: "margin:0 0 4px;font-size:13px" }, "Programs gctk can update for you. Plugins update in their app."), programs.map(row));
  };
  (state.updates ||= api("/api/ai-setup/updates").then((r) => r.programs)).then(draw).catch((err) => { state.updates = null; put(headState, "could not check"); put(box, h("div", { class: "muted" }, `Could not check for updates: ${err.message}`)); });
  return panel;
}

      ctx.link(x, { newOrg: { name: name.value.trim(), tier: tier.value, region: region.value } });
    } }, "Add org and link"), other),
    h("div", { class: "muted", style: "font-size:12px" }, "The client ID and secret it has now become this org on the Orgs page; the server then takes them from there."));
  const open = h("button", { class: "btn primary", onclick: () => { box.style.display = box.style.display === "none" ? "" : "none"; } }, "Add as an org");
  return [open, box];
}

/** Everything that needs a look, grouped by what it is, with one button per group where gctk can fix it. */
function todoGroups(s, ctx) {
  const having = (kind) => s.servers.filter((x) => x.problems.some((p) => p.kind === kind));
  const fixable = (kind, fix) => having(kind).filter((x) => x.problems.some((p) => p.kind === kind && p.fix === fix));
  const SAYS_MORE = ["missing-command", "launch-invalid"];
  const row = (x, kind, btn) => h("div", { class: "todo-row" },
    h("strong", {}, x.name), h("span", { class: "muted" }, whereText(x)),
    SAYS_MORE.includes(kind) ? h("span", { class: "muted", style: "font-size:12px;flex-basis:100%" }, x.problems.filter((p) => p.kind === kind).map((p) => p.text).join(" ")) : null,
    h("span", { class: "spacer" }), btn);
  let first = true;
  const group = (title, why, rows, all) => {
    if (!rows.length) return null;
    const open = first;
    first = false;
    return h("details", { class: "todo-group", open },
      h("summary", {}, h("strong", {}, title), pill(String(rows.length), "s-pending"), why ? h("span", { class: "muted", style: "font-size:13px" }, why) : null),
      all ? h("div", { class: "row", style: "margin:4px 0 6px" }, all) : null, rows);
  };
  const secrets = having("plain-secret");
  const canMove = fixable("plain-secret", "keychain");
  const shared = secrets.some((x) => x.problems.some((p) => p.kind === "same-secret"));
  const broken = [...having("missing-command"), ...having("launch-invalid")];
  const removable = broken.filter((x) => x.editable && !x.problems.some((p) => p.fix === "repair"));
  const groups = [
    group("Secrets in plain text", `Anyone who can read the file can use them. Move them to the keychain.${shared ? " Several entries share one secret." : ""}`,
      secrets.map((x) => row(x, "plain-secret", x.linkOrg ? linkControl(x, ctx) : canMove.includes(x) ? h("button", { class: "btn", onclick: () => ctx.fix(x, "keychain") }, "Move to keychain") : null))),
    group("Credentials not on the Orgs page", "Link them to an org, so a new secret is entered once.",
      having("not-linked").map((x) => row(x, "not-linked", linkControl(x, ctx)))),
    group("Entries that cannot start", "The program they point to is gone.",
      broken.map((x) => row(x, x.problems.some((p) => p.kind === "missing-command") ? "missing-command" : "launch-invalid", !x.editable ? null : x.problems.some((p) => p.fix === "link") ? linkControl({ ...x, linkOrg: x.linkOrg || {} }, ctx) : x.problems.some((p) => p.fix === "repair")
        ? h("button", { class: "btn primary", onclick: () => ctx.fix(x, "repair") }, "Repair")
        : h("button", { class: "btn danger", onclick: () => ctx.fix(x, "remove") }, "Remove"))),
      removable.length > 1 ? h("button", { class: "btn", onclick: () => ctx.fixAll(removable, "remove", `Remove ${removable.length} entries that cannot start`) }, "Remove all") : null),
    group("Older gctk entries", "They need git and start slowly.",
      having("old-package").map((x) => row(x, "old-package", x.editable ? h("button", { class: "btn", onclick: () => ctx.fix(x, "repair") }, "Repair") : null))),
    group("Entries that only work on this computer", "They point to a gctk copy an update deletes.",
      having("unstable-path").map((x) => row(x, "unstable-path", x.editable ? h("button", { class: "btn", onclick: () => ctx.fix(x, "repair") }, "Repair") : null))),
    group("Leftovers from an earlier gctk", "", having("obsolete-env").map((x) => row(x, "obsolete-env", x.editable ? h("button", { class: "btn", onclick: () => ctx.fix(x, "clean-env") }, "Clean up") : null))),
    group("Secrets in headers", "gctk cannot move these; use a variable such as ${env:NAME}.", having("header-secret").map((x) => row(x, "header-secret", null))),
    group("OAuth clients gctk does not know", "Add their org on the Orgs page.", having("unknown-client").map((x) => row(x, "unknown-client", null))),
  ];
  return groups.filter(Boolean);
}

/** One server as a compact line; the details open on click. */
function serverRow(x, ctx) {
  const [credText, credCls] = CREDS[x.credentials] || [x.credentials, ""];
  const issues = x.problems.filter((p) => p.level === "warn" && p.kind !== "plain-secret" && p.kind !== "same-secret").length;
  const restore = x.credentials === "keychain" && x.launch?.valid && x.editable;
  const vars = [...x.env, ...x.headers.map((v) => ({ ...v, name: `header ${v.name}` }))];
  const org = x.org;
  return h("details", { class: "srv" },
    h("summary", {}, h("strong", {}, x.name), h("span", { class: "muted" }, whereText(x)), x.disabled ? pill("switched off") : null,
      h("span", { class: "spacer" }), issues ? pill(`${issues} to fix`, "s-failed") : null, pill(credText, credCls)),
    h("div", { class: "body" },
      h("dl", { class: "kv" },
        h("dt", {}, "File"), h("dd", { class: "mono", style: "font-size:12px;overflow-wrap:anywhere" }, x.file),
        h("dt", {}, "Org"), h("dd", {}, org?.profile ? org.profile : org?.clientId ? "not one of your gctk orgs" : x.credentials === "gctk-profile" ? "needs no org" : "—"),
        org?.region ? [h("dt", {}, "Region"), h("dd", { class: "mono" }, org.region)] : null,
        org?.clientId ? [h("dt", {}, "OAuth client"), h("dd", { class: "mono" }, org.clientId)] : null,
        h("dt", {}, x.transport === "http" ? "URL" : "Starts"), h("dd", { class: "mono", style: "font-size:12px;overflow-wrap:anywhere" }, x.transport === "http" ? x.url : [x.command, ...x.args].join(" "))),
      vars.length ? h("table", {}, vars.map((v) => h("tr", {}, h("td", { class: "mono", style: "font-size:12px" }, v.name), h("td", { class: "v" }, v.value, v.plain ? [" ", pill("plain text", "s-failed")] : "")))) : null,
      x.problems.length ? x.problems.map((p) => h("div", { class: p.level === "warn" ? "warn" : "muted", style: p.level === "warn" ? "margin:0" : "font-size:13px" }, p.text)) : null,
      x.credentialKeys ? credentialsForm(x, ctx)
        : x.credentials === "axl" || x.credentials === "project" ? h("div", { class: "muted", style: "font-size:13px" }, x.editor === "claude-desktop" ? "Its workshop is chosen under AVA harness above; the org comes from that workshop." : "Its org is set on the Projects page.") : null,
      x.editable ? h("div", { class: "row" },
        x.problems.some((p) => p.fix === "keychain") ? h("button", { class: "btn primary", onclick: () => ctx.fix(x, "keychain") }, FIX_LABELS.keychain) : null,
        x.problems.some((p) => p.fix === "repair") ? h("button", { class: "btn primary", onclick: () => ctx.fix(x, "repair") }, FIX_LABELS.repair) : null,
        x.problems.some((p) => p.fix === "clean-env") ? h("button", { class: "btn", onclick: () => ctx.fix(x, "clean-env") }, FIX_LABELS["clean-env"]) : null,
        restore ? h("button", { class: "btn", onclick: () => ctx.fix(x, "restore") }, FIX_LABELS.restore) : null,
        h("button", { class: "btn danger", onclick: () => ctx.fix(x, "remove") }, FIX_LABELS.remove))
        : h("div", { class: "muted", style: "font-size:12px" }, x.scope === "plugin" ? "Comes with a plugin; change it there." : "gctk does not change this file.")));
}

/** New client ID, secret or region for a Genesys server, or those of one of the user's gctk orgs. */
function credentialsForm(x, ctx) {
  const keys = x.credentialKeys;
  const orgs = (state.overview?.profiles || []).filter((p) => !p.error && p.credentialsStored);
  const org = h("select", {}, h("option", { value: "" }, "Enter them below"), orgs.map((p) => h("option", { value: p.name }, `${p.name} (${p.tier}, ${p.region})`)));
  const clientId = keys.clientId ? h("input", { placeholder: x.org?.clientId ? `now ${x.org.clientId}` : "Client ID", autocomplete: "off", style: "min-width:280px" }) : null;
  const secret = keys.secret ? h("input", { type: "password", placeholder: "Client secret (empty: keep the current one)", autocomplete: "new-password", style: "min-width:280px" }) : null;
  const region = keys.region || keys.habitat ? h("input", { placeholder: x.org?.region ? `now ${x.org.region}` : "Region, e.g. mypurecloud.de", style: "min-width:200px" }) : null;
  const plain = x.credentials !== "keychain";
  const keychain = h("input", { type: "checkbox", checked: true });
  const typed = [clientId, secret, region].filter(Boolean);
  org.addEventListener("change", () => { for (const el of typed) el.disabled = Boolean(org.value); });
  const save = () => ctx.setCredentials(x, org.value
    ? { profile: org.value, keychain: plain ? keychain.checked : true }
    : { clientId: clientId?.value || "", secret: secret?.value || "", region: region?.value || "", keychain: plain ? keychain.checked : true });
  const field = (label, el) => el ? h("label", {}, label, el) : null;
  return h("details", { class: "creds" },
    h("summary", {}, "Change credentials"),
    h("div", { class: "grid", style: "margin-top:6px" },
      h("label", {}, "Take them from an org", org),
      field(`Client ID (${keys.clientId})`, clientId), field(`Secret (${keys.secret})`, secret), field(`Region (${[keys.region, keys.habitat].filter(Boolean).join(", ")})`, region)),
    plain && keys.secret ? h("label", { class: "row", style: "margin-top:8px;color:var(--text)" }, keychain, "Keep the secret in the keychain, not in the file") : null,
    h("div", { class: "row", style: "margin-top:8px" }, h("button", { class: "btn primary", onclick: save }, "Save credentials"),
      h("span", { class: "muted", style: "font-size:12px" }, x.credentials === "keychain" ? "Changes only this server, also when its secret is shared with others." : "")));
}

/** A keychain item gctk created; a rotated OAuth secret is entered here once for all its servers. */
function secretCard(m, msg, draw, hint = RELOAD_HINTS.cursor) {
  const inputs = m.names.map((n) => [n, h("input", { type: "password", autocomplete: "new-password", placeholder: "new value", style: "flex:1;min-width:220px" })]);
  const save = async () => {
    try {
      const next = await api(`/api/ai-setup/secrets/${encodeURIComponent(m.account)}`, { method: "PUT", body: { values: Object.fromEntries(inputs.map(([n, el]) => [n, el.value])) } });
      put(msg, h("div", { class: "okbox" }, `Saved the new secret for ${m.usedBy.map((u) => u.server).join(", ")}. `, hint));
      draw(next);
    } catch (err) { put(msg, h("div", { class: "error" }, err.message)); }
  };
  return h("div", { class: "keybox" },
    h("div", { class: "row" }, "🔑", h("strong", {}, `Secret in the keychain: ${m.names.join(", ")}`), m.profile ? h("span", { class: "muted" }, `org ${m.profile}`) : null, m.stored ? null : pill("missing in the keychain", "s-failed"),
      h("span", { class: "muted", style: "font-size:13px" }, `used by ${m.usedBy.length} entr${m.usedBy.length > 1 ? "ies" : "y"}`)),
    h("details", {}, h("summary", {}, "Enter a new secret (after rotating it in Genesys Cloud)"),
      inputs.map(([n, el]) => h("div", { class: "row", style: "margin:6px 0" }, h("span", { class: "mono", style: "min-width:220px" }, n), el)),
      h("button", { class: "btn primary", onclick: save }, "Save in the keychain")));
}

function filesPanel(s, msg, draw, editor = "cursor") {
  const input = h("input", { placeholder: "~/projects/demo or ~/somewhere/.cursor/mcp.json", style: "flex:1;min-width:280px" });
  const call = async (url, body) => {
    try { draw(await api(url, { method: "POST", body })); msg.replaceChildren(); } catch (err) { put(msg, h("div", { class: "error" }, err.message)); window.scrollTo({ top: 0, behavior: "smooth" }); }
  };
  const status = (f) => !f.exists ? h("span", { class: "muted" }, "not there") : f.error ? h("span", { class: "muted" }, f.error) : f.scope === "plugin" ? h("span", { class: "muted" }, "read-only (plugin)") : pill("found", "s-applied");
  const added = s.locations.filter((l) => !s.files.some((f) => f.path === l && f.added));
  if (editor === "claude-desktop") return h("div", { style: "margin-top:16px" },
    h("h3", { style: "margin:0 0 4px;font-size:15px" }, "Config file"),
    h("p", { class: "muted", style: "margin:0 0 8px;font-size:13px" }, "The Claude app keeps its local MCP servers next to its own settings, which gctk leaves as they are. Extensions you install in the app are not listed here."),
    h("table", {}, s.files.map((f) => h("tr", {}, h("td", { class: "mono", style: "font-size:12px;overflow-wrap:anywhere" }, f.path), h("td", { style: "white-space:nowrap" }, status(f))))));
  return h("div", { style: "margin-top:16px" },
    h("h3", { style: "margin:0 0 4px;font-size:15px" }, "Config files"),
    h("p", { class: "muted", style: "margin:0 0 8px;font-size:13px" }, "gctk reads ~/.cursor/mcp.json, Cursor's plugins and the .cursor/mcp.json of the folders Cursor knows (its recent folders and your projects). Add a folder or file that is somewhere else."),
    h("table", {}, h("tr", {}, h("th", {}, "File"), h("th", {}, "For"), h("th", {}, "")),
      s.files.map((f) => h("tr", {},
        h("td", { class: "mono", style: "font-size:12px;overflow-wrap:anywhere" }, f.path),
        h("td", { class: "muted" }, f.scope === "plugin" ? `plugin ${f.plugin}` : f.scope === "project" ? "one folder" : "every folder"),
        h("td", { style: "white-space:nowrap" }, status(f), f.added ? [" ", h("button", { class: "btn", style: "padding:2px 8px;font-size:12px", onclick: () => call("/api/ai-setup/locations/remove", { path: f.path }) }, "Remove")] : null)))),
    added.length ? h("div", { style: "margin-top:10px" }, h("strong", { style: "font-size:13px" }, "Added folders"), added.map((l) => h("div", { class: "row", style: "margin-top:4px" }, h("span", { class: "mono", style: "font-size:12px;flex:1" }, l),
      h("button", { class: "btn", style: "padding:2px 8px;font-size:12px", onclick: () => call("/api/ai-setup/locations/remove", { path: l }) }, "Remove")))) : null,
    h("div", { class: "row", style: "margin-top:12px" }, input, h("button", { class: "btn primary", onclick: () => input.value.trim() && call("/api/ai-setup/locations", { path: input.value }) }, "Add")));
}

// ---------------------------------------------------------------- start
(async () => {
  if (!TOKEN) { main().replaceChildren(h("div", { class: "error" }, "This browser has not opened gctk yet. Ask the AI to open the gctk UI, or run `gctk ui` in a terminal; after that this address works as a bookmark.")); return; }
  try {
    await refreshOverview();
    state.view = pageAlias(state.view);
    // A page this tab remembers that no longer exists opens Orgs.
    if (![...VIEWS, ...MINOR_VIEWS].some(([id]) => id === state.view)) {
      state.view = "profiles";
      try { sessionStorage.setItem("gctk-view", "profiles"); } catch {}
    }
    await render();
  }
  catch (err) { main().replaceChildren(h("div", { class: "error" }, err.message)); return; }
})();
</script>
</body>
